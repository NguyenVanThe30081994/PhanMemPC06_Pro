{% extends "base_mobile.html" %}

{% block title %}Trợ lý AI{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/ai-assistant.css') }}?v=20260506b">
<style>
    .assistant-page .pc06-page-toolbar {
        padding: 0;
        margin-bottom: 16px;
    }
    .assistant-page .assistant-hero-actions {
        justify-content: flex-start;
        max-width: none;
    }
    .assistant-page .assistant-pill {
        background: rgba(255, 255, 255, 0.12);
        color: #fff;
        border-color: rgba(255, 255, 255, 0.14);
    }
    @media (max-width: 767px) {
        .assistant-page .assistant-topic-grid {
            grid-template-columns: 1fr 1fr;
        }
    }

{% endblock %}

{% block content %}
{% include "partials/ai_assistant_content.html" %}
{% endblock %}

{% block scripts %}
