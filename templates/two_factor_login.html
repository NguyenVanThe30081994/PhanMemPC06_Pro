<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="csrf-token" content="{{ csrf_token_value }}">
    <title>Xác minh hai lớp – HỆ THỐNG PC06</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/pc06-premium.css') }}?v=1.0.0">
    <style>
        .pc-login-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            background: url('/static/img/cand_logo_bg.jpg') center/cover no-repeat;
        }
        .pc-login-bg::after {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(18, 31, 56, .84) 0%, rgba(43, 83, 150, .60) 100%);
        }
        .pc-login-shell {
            position: relative;
            z-index: 1;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: var(--pc-space-6);
        }
        .pc-tfa-card { width: 100%; max-width: 420px; padding: 36px 32px; }
        .pc-tfa-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto var(--pc-space-5);
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--pc-radius-lg);
            background: var(--pc-primary);
            color: #fff;
            font-size: 26px;
            box-shadow: var(--pc-shadow-md);
        }
        .pc-code-input {
            font-size: 1.6rem;
            letter-spacing: .5rem;
            text-align: center;
            font-weight: 700;
            text-indent: .5rem;
        }
    </style>
</head>
<body>
    <div class="pc-login-bg" aria-hidden="true"></div>
    <div class="pc-login-shell">
        <div class="pc-card pc-tfa-card pc-login text-center">
            <div class="pc-tfa-icon"><i class="fa-solid fa-shield-halved"></i></div>
            <h1 style="font-size: var(--pc-text-h2); font-weight: 800; letter-spacing: -.02em; color: var(--pc-text); margin-bottom: 6px;">Xác minh hai lớp</h1>
            <p style="font-size: var(--pc-text-body); color: var(--pc-text-muted); margin-bottom: var(--pc-space-6);">Nhập mã 6 số trong ứng dụng authenticator của bạn (Google Authenticator, Authy…).</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% for category, message in messages %}
                <div class="pc-alert {{ 'pc-alert-danger' if category == 'danger' else ('pc-alert-warning' if category == 'warning' else 'pc-alert-info') }} mb-3 text-start">
                    <i class="fa-solid fa-circle-exclamation mt-1"></i>
                    <div>{{ message }}</div>
                </div>
                {% endfor %}
            {% endwith %}

            <form method="POST" action="/login/two-factor">
                <input type="hidden" name="csrf_token" value="{{ csrf_token_value }}">
                <input type="text" name="code" class="pc-input pc-code-input mb-3"
                       inputmode="numeric" autocomplete="one-time-code"
                       pattern="[0-9 ]{6,8}" maxlength="8" autofocus required
                       placeholder="000000" aria-label="Mã xác minh 6 số">
                <button type="submit" class="pc-btn pc-btn-primary w-100 mb-2">
                    <i class="fa-solid fa-check me-1"></i> Xác nhận
                </button>
            </form>
            <a href="/login" class="pc-btn pc-btn-ghost w-100">Đăng nhập lại từ đầu</a>
        </div>
    </div>
</body>
</html>
