<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token_value }}">
    <title>Xác minh hai lớp – HỆ THỐNG PC06</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh; margin: 0;
            background: url('/static/img/cand_logo_bg.jpg') center/cover no-repeat fixed;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
            font-family: 'Be Vietnam Pro', 'Inter', sans-serif;
        }
        .tfa-card {
            background: #ffffff; width: 100%; max-width: 420px;
            border-radius: 24px; padding: 36px 32px;
            box-shadow: 0 24px 60px rgba(15, 23, 42, .18);
        }
        .code-input {
            font-size: 1.6rem; letter-spacing: .5rem; text-align: center;
            font-weight: 700; text-indent: .5rem;
        }
    </style>
</head>
<body>
    <div class="tfa-card">
        <div class="text-center mb-4">
            <i class="fa-solid fa-shield-halved fa-2x text-primary mb-3"></i>
            <h1 class="h4 fw-bold mb-1">Xác minh hai lớp</h1>
            <p class="text-muted small mb-0">Nhập mã 6 số trong ứng dụng authenticator của bạn (Google Authenticator, Authy…).</p>
        </div>

        {% with messages = get_flashed_messages(with_categories=true) %}
            {% for category, message in messages %}
            <div class="alert alert-{{ 'danger' if category == 'danger' else ('warning' if category == 'warning' else 'info') }} py-2 small">{{ message }}</div>
            {% endfor %}
        {% endwith %}

        <form method="POST" action="/login/two-factor">
            <input type="hidden" name="csrf_token" value="{{ csrf_token_value }}">
            <input type="text" name="code" class="form-control code-input mb-3"
                   inputmode="numeric" autocomplete="one-time-code"
                   pattern="[0-9 ]{6,8}" maxlength="8" autofocus required
                   placeholder="000000" aria-label="Mã xác minh 6 số">
            <button type="submit" class="btn btn-primary w-100 rounded-pill fw-bold py-2 mb-2">
                <i class="fa-solid fa-check me-1"></i> Xác nhận
            </button>
        </form>
        <a href="/login" class="btn btn-link w-100 small text-muted text-decoration-none">Đăng nhập lại từ đầu</a>
    </div>
</body>
</html>
