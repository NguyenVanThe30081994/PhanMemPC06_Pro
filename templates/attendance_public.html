<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Điểm danh</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
            font-family: 'Be Vietnam Pro', sans-serif;
            background: linear-gradient(180deg, #eff6ff 0%, #f8fafc 100%);
            color: #0f172a;
        }
        .attendance-public-shell {
            width: min(520px, 100%);
            padding: 28px;
            border-radius: 24px;
            background: rgba(255, 255, 255, 0.94);
            border: 1px solid rgba(148, 163, 184, 0.18);
            box-shadow: 0 24px 48px rgba(15, 23, 42, 0.08);
            display: grid;
            gap: 16px;
        }
        .attendance-public-shell p {
            margin: 0;
            color: #64748b;
        }
    </style>
</head>
<body>
    <section class="attendance-public-shell">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                <div class="alert alert-{{ category if category != 'error' else 'danger' }} mb-0" role="alert">
                    {{ message }}
                </div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <h1 class="h3 fw-bold mb-0">Điểm danh cần đăng nhập</h1>
        <p>Luồng điểm danh đã chuyển sang theo nhiệm vụ, gắn theo vai trò hoặc đơn vị cụ thể.</p>
        <a href="{{ login_url }}" class="btn btn-primary rounded-pill fw-semibold">Đăng nhập</a>
    </section>
</body>
</html>
