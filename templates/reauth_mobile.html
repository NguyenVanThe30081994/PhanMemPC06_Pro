{% extends "base_mobile.html" %}

{% block title %}Xác minh lại - PC06 Mobile{% endblock %}

{% block content %}
<div class="pc-login-mobile" style="max-width: 480px; margin: 0 auto; padding: var(--pc-space-6) var(--pc-space-5);">
    <div class="text-center mb-4">
        <div class="d-inline-flex p-3 mb-3" style="border-radius: var(--pc-radius-pill); background: var(--pc-warning-bg); color: var(--pc-warning);">
            <i class="fa-solid fa-user-shield fs-3"></i>
        </div>
        <h1 style="font-size: 24px; font-weight: 800; letter-spacing: -.02em; color: var(--pc-text);">Xác minh lại danh tính</h1>
        <p style="color: var(--pc-text-muted); font-size: var(--pc-text-sm); margin: 0;">Khu vực này yêu cầu nhập lại mật khẩu hiện tại.</p>
    </div>

    <div class="pc-card pc-login">
        <div class="pc-card-body">
            <span class="pc-badge pc-badge-warning mb-4">STEP-UP AUTH</span>
            <form method="POST">
                <input type="hidden" name="next" value="{{ next_url }}">
                <div class="pc-form-group">
                    <label class="pc-label" for="reauth_pw_m">Mật khẩu hiện tại</label>
                    <div class="d-flex">
                        <input type="password" name="password" id="reauth_pw_m" class="pc-input" placeholder="••••••••" autocomplete="current-password" required style="height: 50px; border-top-right-radius: 0; border-bottom-right-radius: 0;">
                        <button class="pc-btn pc-btn-secondary toggle-password" type="button" aria-label="Hiện hoặc ẩn mật khẩu" style="border-top-left-radius: 0; border-bottom-left-radius: 0; border-left: 0;">
                            <i class="fa-solid fa-eye-slash"></i>
                        </button>
                    </div>
                </div>

                <div class="mt-5">
                    <button type="submit" class="pc-btn pc-btn-primary w-100" aria-label="Xác minh và tiếp tục" title="Xác minh và tiếp tục">
                        <i class="fa-solid fa-shield-check"></i><span class="visually-hidden">Xác minh và tiếp tục</span>
                    </button>
                    <a href="{{ next_url or url_for('admin_bp.index') }}" class="pc-btn pc-btn-ghost w-100 mt-2" aria-label="Quay lại" title="Quay lại"><i class="fa-solid fa-arrow-left"></i><span class="visually-hidden">Quay lại</span></a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.querySelectorAll('.toggle-password').forEach(btn => {
    btn.addEventListener('click', () => {
        const input = btn.parentElement.querySelector('input');
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        }
    });
});
</script>
{% endblock %}
