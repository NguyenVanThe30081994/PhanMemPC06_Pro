{% extends "base.html" %}

{% block content %}
<div class="container-fluid px-4 py-4">
    <div class="row justify-content-center">
        <div class="col-xl-5 col-lg-6 col-md-8">
            <div class="pc-card pc-login">
                <div class="pc-card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center mb-3"
                             style="width: 64px; height: 64px; border-radius: var(--pc-radius-lg); background: var(--pc-warning-bg); color: var(--pc-warning);">
                            <i class="fa-solid fa-user-shield fs-3"></i>
                        </div>
                        <h1 style="font-size: var(--pc-text-h2); font-weight: 800; letter-spacing: -.02em; color: var(--pc-text); margin-bottom: var(--pc-space-2);">Xác minh lại danh tính</h1>
                        <p style="color: var(--pc-text-muted); margin-bottom: var(--pc-space-3);">Bắt buộc trước khi truy cập khu vực quản trị nhạy cảm.</p>
                        <span class="pc-badge pc-badge-warning">STEP-UP AUTH</span>
                    </div>

                    <form method="POST" class="mt-4">
                        <input type="hidden" name="csrf_token" value="{{ csrf_token_value }}">
                        <input type="hidden" name="next" value="{{ next_url }}">

                        <div class="pc-form-group">
                            <label class="pc-label" for="reauth_pw">Mật khẩu hiện tại</label>
                            <div class="d-flex">
                                <input type="password" name="password" id="reauth_pw" class="pc-input" placeholder="••••••••" autocomplete="current-password" required style="height: 48px; border-top-right-radius: 0; border-bottom-right-radius: 0;">
                                <button class="pc-btn pc-btn-secondary toggle-password" type="button" aria-label="Hiện hoặc ẩn mật khẩu" style="border-top-left-radius: 0; border-bottom-left-radius: 0; border-left: 0;">
                                    <i class="fa-solid fa-eye-slash"></i>
                                </button>
                            </div>
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="pc-btn pc-btn-primary pc-btn-lg w-100">
                                <i class="fa-solid fa-shield-check me-2"></i>Xác minh và tiếp tục
                            </button>
                            <a href="{{ next_url or url_for('admin_bp.index') }}" class="pc-btn pc-btn-ghost w-100">Quay lại</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.querySelectorAll('.toggle-password').forEach(btn => {
    btn.addEventListener('click', () => {
        const input = btn.parentElement.querySelector('input');
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        }
    });
});
</script>
{% endblock %}
