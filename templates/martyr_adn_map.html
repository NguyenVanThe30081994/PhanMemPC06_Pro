          ${allHubs.map((hub) => {
            const isActive = hub.key === activeHubKey;
            const color = hub.occurrences?.[0]?.color || "#c4661f";
            const areaCount = Array.from(routeNodes.values())
              .filter((n) => n.kind === "area" && n.sourceHubKey === hub.key).length;
            return `
              <button
                type="button"
                class="hub-sidebar-item${isActive ? " is-active" : ""}"
                data-hub-key="${hub.key}"
                style="--item-color: ${color};"
              >
                <div class="hub-sidebar-dot"></div>
                <div class="hub-sidebar-info">
                  <span class="hub-sidebar-name">${hub.name}</span>
                  <span class="hub-sidebar-sub">${areaCount} xã/phường</span>
                </div>
              </button>
            `;
          }).join("")}
        `;

        sidebarEl.querySelectorAll(".hub-sidebar-item").forEach((btn) => {
          btn.addEventListener("click", (event) => {
            event.stopPropagation();
            event.preventDefault();
            const hubKey = btn.getAttribute("data-hub-key");
            const hubNode = routeNodes.get(hubKey);
            state.activeNodeKey = hubKey;
            if (hubNode && hubNode.occurrences && hubNode.occurrences[0]) {
              state.activeRouteId = hubNode.occurrences[0].routeId;
            }
            state.summaryOpen = true;
            summaryDrawerEl.classList.add("is-open");
            state.shouldAutoFit = false;
            render();
          });
        });
      }

      function buildFixedCatchmentSegments(routes, routeNodes) {
        const segments = [];
        
        let activeHubKey = null;
        const activeRoute = resolveActiveRoute(routes);
        const preferredNodeKey = getPreferredRouteNodeKey(activeRoute);
        let activeKey = state.activeNodeKey || preferredNodeKey;
        if (activeKey) {
          const activeNode = routeNodes.get(activeKey);
          if (activeNode) {
            activeHubKey = activeNode.kind === "hub" ? activeNode.key : activeNode.sourceHubKey;
          }
        }

        routes.forEach((route) => {
          route.segments.forEach((segment) => {
            if (!routeNodes.has(segment.fromKey) || !routeNodes.has(segment.toKey) || segment.metric.source === "same-site") {
              return;
            }
            segments.push({
              ...segment,
              routeId: route.id,
              color: route.color,
              kind: "route"
            });
          });
        });

        Array.from(routeNodes.values())
          .filter((node) => node.kind === "area" && node.sourceHubKey === activeHubKey && routeNodes.has(node.sourceHubKey))
          .forEach((node) => {
            const occurrence = node.occurrences[0] || {};
            segments.push({
              id: `catchment-${node.key}`,
              fromKey: node.key,
              toKey: node.sourceHubKey,
              color: occurrence.color || TRACK_COLORS[0],
              routeId: occurrence.routeId || "",
              kind: "catchment",
              metric: node.metric || occurrence.metric || { source: "catchment" }
            });
          });

        return segments;
      }


      function buildBoardPositions(direction, routeNodes, activeRoute, referenceMode, routes) {
        if (direction.id === "co-dinh") {
          if (state.dayIndex !== null) {
            return buildFixedDayRoutePositions(routes, routeNodes);
          }
          return buildMultiRouteTimelinePositions(routes, routeNodes);
        }
        return buildSchematicRoutePositions(activeRoute, routeNodes);
      }

      function buildStraightPath(points) {
        if (points.length < 2) {
          return "";
        }
        let path = `M ${points[0].x} ${points[0].y}`;
        for (let index = 1; index < points.length; index += 1) {
          path += ` L ${points[index].x} ${points[index].y}`;
        }
        return path;
      }

      function buildSegmentPath(fromNode, toNode, isCatchment = false) {
        if (isCatchment) {
          const startX = toNode.x;
          const startY = toNode.y;
          const endX = fromNode.x;
          const endY = fromNode.y;
          const controlX1 = startX + (endX - startX) * 0.45;
          const controlY1 = startY;
          const controlX2 = startX + (endX - startX) * 0.55;
          const controlY2 = endY;
          return `M ${startX} ${startY} C ${controlX1} ${controlY1}, ${controlX2} ${controlY2}, ${endX} ${endY}`;
        }
        return buildStraightPath([fromNode, toNode]);
      }

      function buildSegmentBadgePosition(fromNode, toNode, segmentIndex = 0, isCatchment = false) {
        const angleRad = Math.atan2(toNode.y - fromNode.y, toNode.x - fromNode.x);
        let angleDeg = angleRad * (180 / Math.PI);
        if (angleDeg > 90 || angleDeg < -90) {
          angleDeg += 180;
        }

        if (isCatchment) {
          const startX = toNode.x;
          const startY = toNode.y;
          const endX = fromNode.x;
          const endY = fromNode.y;
          const controlX1 = startX + (endX - startX) * 0.45;
          const controlY1 = startY;
          const controlX2 = startX + (endX - startX) * 0.55;
          const controlY2 = endY;

          // Compute exact Bezier midpoint coordinates at t = 0.65
          const t = 0.65;
          const mt = 1 - t;
          const w0 = mt * mt * mt; // 0.042875
          const w1 = 3 * mt * mt * t; // 0.238875
          const w2 = 3 * mt * t * t; // 0.443625
          const w3 = t * t * t; // 0.274625
 
          const bx = w0 * startX + w1 * controlX1 + w2 * controlX2 + w3 * endX;
          const by = w0 * startY + w1 * controlY1 + w2 * controlY2 + w3 * endY;
 
          // Compute exact Bezier tangent vector at t = 0.65
          const tangentX = 0.3675 * (controlX1 - startX) + 1.365 * (controlX2 - controlX1) + 1.2675 * (endX - controlX2);
          const tangentY = 0.3675 * (controlY1 - startY) + 1.365 * (controlY2 - controlY1) + 1.2675 * (endY - controlY2);

          let tangentAngleDeg = Math.atan2(tangentY, tangentX) * (180 / Math.PI);
          if (tangentAngleDeg > 90 || tangentAngleDeg < -90) {
            tangentAngleDeg += 180;
          }

          return {
            x: bx,
            y: by,
            angle: tangentAngleDeg
          };
        }

        const midX = (fromNode.x + toNode.x) / 2;
        const midY = (fromNode.y + toNode.y) / 2;
        
        return {
          x: midX,
          y: midY,
          angle: angleDeg
        };
      }





      function nodeSize(total, maxTotal) {
        if (!maxTotal) {
          return 24;
        }
        return 22 + Math.sqrt(Math.max(0, total) / maxTotal) * 30;
      }

      function nodeColor(node, activeRoute) {
        if (activeRoute && activeRoute.points.some((point) => point.key === node.key)) {
          const matchingOccurrence = node.occurrences.find((occurrence) => occurrence.routeId === activeRoute.id);
          return matchingOccurrence ? TRACK_COLORS[matchingOccurrence.trackIndex] || activeRoute.color : activeRoute.color;
        }
        const dominant = node.occurrences.reduce((best, occurrence) => (
          !best || occurrence.total > best.total ? occurrence : best
        ), null);
        return dominant ? TRACK_COLORS[dominant.trackIndex] || dominant.color : TRACK_COLORS[0];
      }

      function clampScale(value) {
        return Math.min(2.8, Math.max(0.55, value));
      }

      function updateViewport() {
        mapViewportEl.style.transform = `translate(${state.viewport.translateX}px, ${state.viewport.translateY}px) scale(${state.viewport.scale})`;
        mapStatusEl.textContent = `${Math.round(state.viewport.scale * 100)}%`;
      }

      function setViewport(scale, translateX, translateY) {
        state.viewport.scale = clampScale(scale);
        state.viewport.translateX = translateX;
        state.viewport.translateY = translateY;
        updateViewport();
      }

      function zoomAt(clientX, clientY, scaleFactor) {
        const rect = mapStageEl.getBoundingClientRect();
        const offsetX = clientX - rect.left;
        const offsetY = clientY - rect.top;
        const previousScale = state.viewport.scale;
        const nextScale = clampScale(previousScale * scaleFactor);
        if (nextScale === previousScale) {
          return;
        }
        const worldX = (offsetX - state.viewport.translateX) / previousScale;
        const worldY = (offsetY - state.viewport.translateY) / previousScale;
        state.viewport.scale = nextScale;
        state.viewport.translateX = offsetX - worldX * nextScale;
        state.viewport.translateY = offsetY - worldY * nextScale;
        updateViewport();
      }

      function fitViewportToPositions(routePoints, positions) {
        if (!routePoints.length) {
          setViewport(1, 0, 0);
          return;
        }
        const projected = routePoints.map((point) => positions.get(point.key)).filter(Boolean);
        if (!projected.length) {
          setViewport(1, 0, 0);
          return;
        }
        const bounds = projected.reduce((acc, point) => ({
          minX: Math.min(acc.minX, point.x),
          maxX: Math.max(acc.maxX, point.x),
          minY: Math.min(acc.minY, point.y),
          maxY: Math.max(acc.maxY, point.y)
        }), {
          minX: projected[0].x,
          maxX: projected[0].x,
          minY: projected[0].y,
          maxY: projected[0].y
        });
        const rect = mapStageEl.getBoundingClientRect();
        const viewWidth = rect.width || STAGE_WIDTH;
        const viewHeight = rect.height || STAGE_HEIGHT;
        const horizontalPadding = 180;
        const topSafe = 180;
        const bottomSafe = 90;
        let padX = 280;
        let padY = 185;
        if (projected.length === 1) {
          padX = 420;
          padY = 260;
        } else if (projected.length === 2) {
          padX = 260;
          padY = 180;
        } else if (projected.length === 3) {
          padX = 180;
          padY = 120;
        }
        bounds.minX -= padX;
        bounds.maxX += padX;
        bounds.minY -= padY;
        bounds.maxY += padY;

        const contentWidth = Math.max(320, bounds.maxX - bounds.minX);
        const contentHeight = Math.max(260, bounds.maxY - bounds.minY);
        let scale = clampScale(Math.min(
          (viewWidth - horizontalPadding) / contentWidth,
          (viewHeight - topSafe - bottomSafe) / contentHeight
        ));
        if (projected.length === 1) {
          scale = Math.min(scale, 0.76);
        } else if (projected.length === 2) {
          scale = Math.min(scale, 0.86);
        } else if (projected.length === 3) {
          scale = Math.min(scale, 0.96);
        } else {
          scale = Math.min(scale, 1.0);
        }

        const centerX = (bounds.minX + bounds.maxX) / 2;
        const centerY = (bounds.minY + bounds.maxY) / 2;
        const translateX = viewWidth / 2 - centerX * scale;
        const visibleHeight = viewHeight - topSafe - bottomSafe;
        const targetCenterY = topSafe + visibleHeight / 2;
        const translateY = targetCenterY - centerY * scale;
        setViewport(scale, translateX, translateY);
      }

      function initializeViewportControls() {
        if (mapStageEl.dataset.viewportReady === "true") {
          return;
        }
        mapStageEl.dataset.viewportReady = "true";
        let dragMoved = false;
 
        zoomInButtonEl.addEventListener("click", () => {
          const rect = mapStageEl.getBoundingClientRect();
          zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 1.18);
        });
 
        zoomOutButtonEl.addEventListener("click", () => {
          const rect = mapStageEl.getBoundingClientRect();
          zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 1 / 1.18);
        });
 
        resetViewButtonEl.addEventListener("click", () => {
          state.activeNodeKey = null;
          state.shouldAutoFit = true;
          state.summaryOpen = false;
          summaryDrawerEl.classList.remove("is-open");
          render();
        });
 
        mapStageEl.addEventListener("click", (event) => {
          if (dragMoved) {
            return;
          }
          if (event.target.closest(".map-node") || event.target.closest(".map-toolbar") || event.target.closest("#summary-drawer") || event.target.closest("#summary-toggle") || event.target.closest("#hub-sidebar")) {
            return;
          }
          state.activeNodeKey = null;
          state.shouldAutoFit = true;
          state.summaryOpen = false;
          summaryDrawerEl.classList.remove("is-open");
          render();
        });
 
 
 
        mapStageEl.addEventListener("wheel", (event) => {
          event.preventDefault();
          const scaleFactor = event.deltaY < 0 ? 1.12 : 1 / 1.12;
          zoomAt(event.clientX, event.clientY, scaleFactor);
        }, { passive: false });
 
        mapStageEl.addEventListener("pointerdown", (event) => {
          if (event.target.closest(".map-node") || event.target.closest(".map-toolbar")) {
            return;
          }
          interactionState.isDragging = true;
          interactionState.startX = event.clientX;
          interactionState.startY = event.clientY;
          interactionState.translateX = state.viewport.translateX;
          interactionState.translateY = state.viewport.translateY;
          dragMoved = false;
          mapStageEl.classList.add("is-grabbing");
        });
 
        window.addEventListener("pointermove", (event) => {
          if (!interactionState.isDragging) {
            return;
          }
          const dx = event.clientX - interactionState.startX;
          const dy = event.clientY - interactionState.startY;
          if (Math.hypot(dx, dy) > 4) {
            dragMoved = true;
          }
          state.viewport.translateX = interactionState.translateX + dx;
          state.viewport.translateY = interactionState.translateY + dy;
          updateViewport();
        });
 
        window.addEventListener("pointerup", () => {
          interactionState.isDragging = false;
          mapStageEl.classList.remove("is-grabbing");
        });
      }


      function initializeSummaryDrawer() {
        if (summaryDrawerEl.dataset.drawerReady === "true") {
          return;
        }
        summaryDrawerEl.dataset.drawerReady = "true";

        summaryToggleEl.addEventListener("click", () => {
          state.summaryOpen = !state.summaryOpen;
          summaryDrawerEl.classList.toggle("is-open", state.summaryOpen);
        });

        summaryCloseEl.addEventListener("click", () => {
          state.summaryOpen = false;
          summaryDrawerEl.classList.remove("is-open");
        });
      }

      function labelAnchor(node, positions) {
        if (node.kind === "area" && node.sourceHubKey) {
          const hubNode = positions ? positions.get(node.sourceHubKey) : null;
          if (hubNode) {
            return node.x < hubNode.x ? "anchor-left" : "anchor-right";
          }
          return "anchor-right";
        }
        if (node.x > STAGE_WIDTH - 260) {
          return "anchor-left";
        }
        if (node.x < 180) {
          return "anchor-right";
        }
        if (node.y > STAGE_HEIGHT - 160) {
          return "anchor-top";
        }
        if (node.y < 140) {
          return "anchor-bottom";
        }
        return node.y > STAGE_HEIGHT * 0.64 ? "anchor-top" : "anchor-right";
      }


      function renderBoard(routes, nodes) {
        const direction = getSelectedDirection();
        const activeRoute = resolveActiveRoute(routes);
        if (!activeRoute) {
          mapSvgEl.innerHTML = "";
          segmentLayerEl.innerHTML = "";
          nodeLayerEl.innerHTML = "";
          const sb = document.getElementById("hub-sidebar");
          if (sb) { sb.classList.remove("is-visible"); sb.innerHTML = ""; }
          return;
        }

        const referenceMode = isReferenceBoardMode(direction);
        pageShellEl.classList.toggle("is-reference-mode", referenceMode);
        mapStageEl.classList.toggle("is-reference-mode", referenceMode);
        mapNoteEl.style.display = "none";
        mapNoteEl.innerHTML = "";

        const showAllRoutes = direction.id === "co-dinh";
        const routeNodes = showAllRoutes ? nodes : new Map();
        if (!showAllRoutes) {
          activeRoute.points.forEach((point) => {
            if (nodes.has(point.key)) {
              routeNodes.set(point.key, nodes.get(point.key));
            }
          });
        }
        const preferredNodeKey = getPreferredRouteNodeKey(activeRoute);
        const activeNodeKey = routeNodes.has(state.activeNodeKey) ? state.activeNodeKey : preferredNodeKey;
        if (activeNodeKey && state.activeNodeKey !== activeNodeKey) {
          state.activeNodeKey = activeNodeKey;
        }
        const fixedCatchmentMode = direction.id === "co-dinh" && state.dayIndex !== null;
        let activeHubKey = null;
        if (fixedCatchmentMode && activeNodeKey) {
          const activeNode = routeNodes.get(activeNodeKey);
          if (activeNode) {
            activeHubKey = activeNode.kind === "hub" ? activeNode.key : activeNode.sourceHubKey;
          }
        }
        const positions = fixedCatchmentMode
          ? buildFixedCatchmentPositions(routes, routeNodes)
          : buildBoardPositions(direction, routeNodes, activeRoute, referenceMode, routes);

        const maxTotal = Math.max(...Array.from(routeNodes.values()).map((node) => node.total), 0);

        const renderedSegments = fixedCatchmentMode
          ? buildFixedCatchmentSegments(routes, routeNodes)
          : (showAllRoutes
            ? routes.flatMap((route) => route.segments.map((segment) => ({ ...segment, routeId: route.id, color: route.color, kind: "route" })))
            : activeRoute.segments.map((segment) => ({ ...segment, routeId: activeRoute.id, color: activeRoute.color, kind: "route" })));

        mapSvgEl.innerHTML = renderedSegments.map((segment) => {
          const fromNode = positions.get(segment.fromKey);
          const toNode = positions.get(segment.toKey);
          if (!fromNode || !toNode || (segment.metric && segment.metric.source === "same-site")) {
            return "";
          }
          const isCatchment = segment.kind === "catchment";
          const path = buildSegmentPath(fromNode, toNode, isCatchment);
          const isActiveRoute = activeRoute && activeRoute.id === segment.routeId;
          const baseColor = segment.color || activeRoute.color;
          return `
            <path
              class="route-path${isCatchment ? " route-path-catchment" : ""}${isActiveRoute ? " is-active" : ""}"
              d="${path}"
              stroke="rgba(255, 255, 255, 0.9)"
              stroke-width="${isCatchment ? 6 : 12}"
              opacity="${showAllRoutes ? (isCatchment ? 0.34 : 0.88) : 0.96}"
            ></path>
            <path
              class="route-path${isCatchment ? " route-path-catchment" : ""}${isActiveRoute ? " is-active" : ""}"
              d="${path}"
              stroke="${baseColor}"
              stroke-width="${isCatchment ? 3 : 6}"
              opacity="${isCatchment ? 0.72 : 1}"
            ></path>
          `;
        }).join("");

        const badgeSegments = (fixedCatchmentMode || showAllRoutes ? renderedSegments : activeRoute.segments)
          .filter((segment) => segment.metric && segment.metric.source !== "same-site" && hasNumericMetric(segment.metric))
          .filter(Boolean);

        segmentLayerEl.innerHTML = badgeSegments.map((segment, segmentIndex) => {
          const fromNode = positions.get(segment.fromKey);
          const toNode = positions.get(segment.toKey);
          if (!fromNode || !toNode) {
            return "";
          }
          const isCatchment = segment.kind === "catchment";
          const badgePosition = buildSegmentBadgePosition(fromNode, toNode, segmentIndex, isCatchment);

          const metricText = formatMetricText(segment.metric);
          return `
            <div class="segment-badge" style="left:${badgePosition.x}px; top:${badgePosition.y}px; transform: translate(-50%, -50%) rotate(${badgePosition.angle}deg);">
              ${metricText}
            </div>
          `;

        }).join("");


        nodeLayerEl.innerHTML = Array.from(positions.values()).map((node) => {
          const anchor = labelAnchor(node, positions);

          const primaryOccurrence = node.occurrences[0];
          const color = (showAllRoutes || fixedCatchmentMode)
            ? nodeColor(node, activeRoute)
            : (referenceMode ? (primaryOccurrence.color || activeRoute.color) : activeRoute.color);
          const size = node.kind === "area"
            ? Math.max(16, nodeSize(node.total, maxTotal) - 10)
            : nodeSize(node.total, maxTotal);
          const isActive = activeNodeKey === node.key;
          const occurrenceCount = node.occurrences.length;
          const isAreaNode = node.kind === "area";

          // PowerPoint animation class — only in fixedCatchmentMode
          let pptClass = "";
          if (fixedCatchmentMode) {
            if (isAreaNode) {
              pptClass = " is-area-hidden";
            } else {
              pptClass = node.key === activeHubKey ? " is-hub-focused" : " is-hub-idle";
            }
          }

          const hubKey = isAreaNode ? (node.sourceHubKey || "") : node.key;

          return `
            <button
              type="button"
              class="map-node ${isAreaNode ? "is-area-node " : ""}${anchor}${isActive ? " is-active" : ""}${pptClass}"
              style="left:${node.x}px; top:${node.y}px; --node-color:${color}; --node-size:${size}px;"
              data-node-key="${node.key}"

        // Render hub sidebar (left panel) for fixed catchment mode
        renderHubSidebar(routes, routeNodes, activeHubKey, direction, fixedCatchmentMode);

        // PowerPoint stagger: reveal satellite area nodes one by one
        if (fixedCatchmentMode && activeHubKey) {
          const escapedHubKey = CSS.escape(activeHubKey);
          const areaButtons = Array.from(
            nodeLayerEl.querySelectorAll(`.is-area-hidden[data-hub-key="${activeHubKey}"]`)
          );
          areaButtons.forEach((btn, idx) => {
            setTimeout(() => {
              btn.classList.remove("is-area-hidden");
              btn.classList.add("is-area-reveal");
              btn.style.pointerEvents = "auto";
            }, 100 + idx * 95);
          });
        }

        nodeLayerEl.querySelectorAll("[data-node-key]").forEach((button) => {
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            event.preventDefault();
            const nextNodeKey = button.getAttribute("data-node-key");
            const nextNode = routeNodes.get(nextNodeKey);
            state.activeNodeKey = nextNodeKey;
            if (nextNode && nextNode.occurrences[0]?.routeId) {
              state.activeRouteId = nextNode.occurrences[0].routeId;
            }
            state.summaryOpen = true;
            summaryDrawerEl.classList.add("is-open");
            state.shouldAutoFit = false;
            render();
          });
        });


        if (state.shouldAutoFit) {
          let fitPoints = [];
          if (fixedCatchmentMode && activeHubKey) {
            fitPoints.push({ key: activeHubKey });
            Array.from(routeNodes.values()).forEach((node) => {
              if (node.kind === "area" && node.sourceHubKey === activeHubKey) {
                fitPoints.push({ key: node.key });
              }
            });
          } else {
            fitPoints = showAllRoutes ? Array.from(routeNodes.values()) : activeRoute.points;
          }
          fitViewportToPositions(fitPoints, positions);
          state.shouldAutoFit = false;
        } else {
          updateViewport();
        }

      function buildGoogleMapsUrl(route) {
        if (!route || route.points.length < 2) {
          return "";
        }
        const origin = `${route.points[0].lat},${route.points[0].lng}`;
        const destination = `${route.points[route.points.length - 1].lat},${route.points[route.points.length - 1].lng}`;
        const waypointPoints = route.points.slice(1, -1).map((point) => `${point.lat},${point.lng}`);
        const params = new URLSearchParams({
          api: "1",
          origin,
          destination,
          travelmode: "driving"
        });
        if (waypointPoints.length) {
          params.set("waypoints", waypointPoints.join("|"));
        }
        return `https://www.google.com/maps/dir/?${params.toString()}`;
      }

      function buildRouteListTitle(route, referenceMode) {
        if (!route) {

        }
        if (!route.points.length) {
          return route.summary || route.title || route.label;

        if (referenceMode || route.points.length <= 3) {
          return route.summary;
        }
        return `${route.points[0].name} → ${route.points[route.points.length - 1].name}`;

      function buildRouteListMeta(route, referenceMode) {
        if (!route) {
          return "";
        }
        if (referenceMode) {
          return `${formatNumber(route.total)} TNLS`;

        if (!route.points.length) {
          const parts = [];
          if (route.noteCount) {
            parts.push(`${route.noteCount} mục nghiệp vụ`);
          }
          if (route.total > 0) {
            parts.push(`${formatNumber(route.total)} TNLS`);
          }
          return parts.join(" · ") || "Không có điểm bản đồ";
        }
        if (route.noteCount) {
          return `${route.points.length} điểm · ${route.noteCount} mục nghiệp vụ · ${formatNumber(route.total)} TNLS`;
        }
        return `${route.points.length} điểm · ${formatNumber(route.total)} TNLS`;
      }

      function escapeHtml(value) {
        return String(value || "")
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;")
          .replace(/'/g, "&#39;");
      }

      // Normalize a text block: convert inline markers like "- Buổi sáng:", "(1)", "+ " etc.
      // into actual newlines so subsequent functions can split by line.
      function normalizeTextToLines(text) {
        if (!text) return [];
        return String(text)
          // Ensure section headers start on their own line
          .replace(/\s*-\s*Buổi sáng:/gi, "\nBuổi sáng:")
          .replace(/\s*-\s*Buổi chiều:/gi, "\nBuổi chiều:")
          .replace(/\s*Buổi sáng:/gi, "\nBuổi sáng:")
          .replace(/\s*Buổi chiều:/gi, "\nBuổi chiều:")
          // Numbered items (1) (2) ... start new line
          .replace(/\s+\((\d+)\)/g, "\n($1)")
          // "+" bullet items start new line (but not inside times like 7h.00+...)
          .replace(/\s+\+\s/g, "\n+ ")
          // "- " at word boundary (not at start already handled above)
          .replace(/([^\n])\s+-\s+/g, "$1\n- ")
          // "* Lưu ý" starts new line
          .replace(/\s+\*\s*Lưu ý/gi, "\nLưu ý")
          .split(/\n/)
          .map(l => l.trim())
          .filter(l => l.length > 0);
      }

      function formatToBulletPoints(text) {
        if (!text) {
          return `<div style="opacity: 0.6; font-style: italic;">Không có thông tin chi tiết</div>`;
        }
        const lines = normalizeTextToLines(text);
        if (!lines.length) {
          return `<div style="opacity: 0.6; font-style: italic;">Không có thông tin chi tiết</div>`;
        }
        const listItems = lines.map(line => {
          // Strip leading bullet chars before displaying
          const cleanLine = line.replace(/^[\s\-\•\*\+\u2022]+/, "").trim();
          return `<li style="margin-bottom: 6px; list-style-type: disc; margin-left: 14px; line-height: 1.6; text-align: justify;">${escapeHtml(cleanLine)}</li>`;
        }).join("");
        return `<ul style="margin: 0; padding: 0; list-style-position: outside;">${listItems}</ul>`;
      }

      function filterSessionText(text, sessionName) {
        if (!text) return "";
        if (!sessionName) return text;

        const isMorning   = /s\u00e1ng/i.test(sessionName);
        const isAfternoon = /chi\u1ec1u/i.test(sessionName);
        if (!isMorning && !isAfternoon) return text;

        // Pre-normalize so section separators become real newlines
        const lines = normalizeTextToLines(text);

        const morningRx  = /bu\u1ed5i\s*s\u00e1ng/i;
        const afternoonRx = /bu\u1ed5i\s*chi\u1ec1u/i;

        const hasBothSections = lines.some(l => morningRx.test(l)) && lines.some(l => afternoonRx.test(l));
        if (!hasBothSections) {
          // Only one session in data – return as-is
          return lines.join("\n");
        }

        const targetRx = isMorning ? morningRx : afternoonRx;
        const otherRx  = isMorning ? afternoonRx : morningRx;

        // Collect preamble (before any section header), then target section only
        const firstSectionIdx = lines.findIndex(l => morningRx.test(l) || afternoonRx.test(l));
        const preamble = firstSectionIdx > 0 ? lines.slice(0, firstSectionIdx) : [];

        const collected = [];
        let inTarget = false;
        for (const line of lines) {
          if (targetRx.test(line)) {
            inTarget = true;
            collected.push(line);
          } else if (otherRx.test(line)) {
            inTarget = false;
          } else if (inTarget) {
            collected.push(line);
          }
        }

        return [...preamble, ...collected].join("\n");
      }




      function formatDetailValue(value) {
        if (!value) {
          return "";
        }
        const normalized = String(value)
          .replace(/\s+/g, " ")
          .replace(/\s*-\s*Buổi sáng:/g, "\nBuổi sáng:")
          .replace(/\s*-\s*Buổi chiều:/g, "\nBuổi chiều:")
          .replace(/\s*Dự kiến tính trong ngày:/g, "Dự kiến tính trong ngày:")
          .replace(/\s*Sáng:/g, "\nSáng:")
          .replace(/\s*Chiều:/g, "\nChiều:")
          .replace(/\s+\*\s*Lưu ý:/g, "\nLưu ý:")
          .replace(/\s+\((\d+)\)/g, "\n($1)")
          .replace(/\s+\+\s/g, "\n+ ")
          .replace(/\s+-\s+/g, "\n- ")
          .trim();
        return escapeHtml(normalized);
      }

      function buildHubAreaRows(node) {
        const grouped = new Map();
        node.occurrences.forEach((occurrence) => {
          (occurrence.areas || []).forEach((area) => {
            const areaName = normalizePlaceName(area.name || "");
            if (!areaName || areaName.toLowerCase() === normalizePlaceName(node.name).toLowerCase()) {
              return;
            }
            if (!grouped.has(areaName)) {
              grouped.set(areaName, {
                name: areaName,
                total: 0,
                metric: getCatchmentMetric(areaName, node.name)
              });
            }
            grouped.get(areaName).total += Number(area.count || 0);
          });
        });
        if (!grouped.size) {
          return "";
        }
        return Array.from(grouped.values())
          .sort((left, right) => Number(right.total || 0) - Number(left.total || 0))
          .map((area) => {
            const metricText = area.metric ? formatMetricText(area.metric) : "Chưa xác minh di chuyển";
            return `

      async function fetchForecast(lat, lng) {
        const coordKey = buildCoordKey(lat, lng);
        if (!forecastCache.has(coordKey)) {
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lng)}&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_sum,wind_speed_10m_max,et0_fao_evapotranspiration&hourly=relative_humidity_2m&timezone=Asia%2FBangkok&forecast_days=16`;
          forecastCache.set(coordKey, fetch(url).then((r) => r.json()).catch(() => null));
        }
        return forecastCache.get(coordKey);
      }

      async function fetchElevation(lat, lng) {
        const key = `${Number(lat).toFixed(4)}|${Number(lng).toFixed(4)}`;
        if (!elevationCache.has(key)) {
          const url = `https://api.open-meteo.com/v1/elevation?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lng)}`;
          elevationCache.set(key, fetch(url).then((r) => r.json()).catch(() => null));
        }
        return elevationCache.get(key);
      }

      // Returns rich enviro object for a specific lat/lng/date
      async function resolveEnviroDetail(lat, lng, isoDate) {
        const key = `${buildCoordKey(lat, lng)}|${isoDate}`;
        if (enviroDetailCache.has(key)) return enviroDetailCache.get(key);

        const [forecastPayload, elevationPayload] = await Promise.all([
          fetchForecast(lat, lng),
          fetchElevation(lat, lng)
        ]);

        const elevation_m = elevationPayload && Array.isArray(elevationPayload.elevation)
          ? elevationPayload.elevation[0] : null;

        let result = { elevation_m, weather: null };

        if (forecastPayload && forecastPayload.daily && Array.isArray(forecastPayload.daily.time)) {
          const di = forecastPayload.daily.time.indexOf(isoDate);
          if (di >= 0) {
            const d = forecastPayload.daily;
            const code = d.weather_code[di];
            const minTemp = Math.round(d.temperature_2m_min[di]);
            const maxTemp = Math.round(d.temperature_2m_max[di]);
            const rain_mm = Math.round((d.precipitation_sum[di] || 0) * 10) / 10;
            const wind_kmh = Math.round(d.wind_speed_10m_max[di] || 0);
            // Avg humidity from hourly (0-23h of that day index)
            let humidity = null;
            if (forecastPayload.hourly && Array.isArray(forecastPayload.hourly.relative_humidity_2m)) {
              const startH = di * 24;
              const slice = forecastPayload.hourly.relative_humidity_2m.slice(startH, startH + 24).filter(v => v != null);
              if (slice.length) humidity = Math.round(slice.reduce((a, b) => a + b, 0) / slice.length);
            }
            result.weather = { code, minTemp, maxTemp, rain_mm, wind_kmh, humidity };
          }
        }

        enviroDetailCache.set(key, result);
        return result;
      }

      function buildEnviroPanel(lat, lng, isoDate) {
        const key = `enviro|${buildCoordKey(lat, lng)}|${isoDate}`;
        // Return a placeholder div — hydrateEnviro will fill it
        return `<div class="enviro-panel" data-enviro-key="${key}">
          <div class="enviro-panel-title">🌍 Địa hình · Thời tiết · Cảnh báo</div>
          <div class="enviro-pending">⏳ Đang tải dữ liệu môi trường...</div>
        </div>`;
      }

      function buildTrafficAdvisories(w, elevation_m) {
        // Generate traffic advisories based on weather + terrain
        const advisories = [];
        if (!w) {
          advisories.push({ level: 'watch', icon: '🔶', text: 'Chưa có dữ liệu dự báo — Theo dõi thông tin trước khi xuất phát.' });
          return advisories;
        }
        const isMountain = elevation_m != null && elevation_m >= 500;
        const isHighMountain = elevation_m != null && elevation_m >= 1000;

        // Thunder & lightning
        if (w.code >= 95) {
          advisories.push({ level: 'danger', icon: '⚡', text: 'Dông sét — Nguy hiểm cao. Tránh các tuyến đèo, khu vực trống trải. Hạn chế di chuyển khi có sấm sét.' });
        }
        // Heavy rain
        if (w.rain_mm >= 50) {
          advisories.push({ level: 'danger', icon: '🌊', text: `Mưa rất lớn (${w.rain_mm}mm) — Nguy cơ ngập đường, lũ quét, sạt lở đất cao. Kiểm tra cảnh báo lũ lụt tại nchmf.gov.vn trước khi đi.` });
        } else if (w.rain_mm >= 25) {
          advisories.push({ level: 'warning', icon: '🌧', text: `Mưa lớn (${w.rain_mm}mm) — Đường trơn, tầm nhìn hạn chế. Giảm tốc độ, bật đèn. Chú ý biển báo sạt lở ven đường.` });
        } else if (w.rain_mm >= 10) {
          advisories.push({ level: 'watch', icon: '🌦', text: `Mưa vừa (${w.rain_mm}mm) — Mặt đường ẩm ướt, trơn trượt. Giữ khoảng cách an toàn, giảm tốc độ 20–30%.` });
        } else if (w.rain_mm >= 2) {
          advisories.push({ level: 'watch', icon: '🌂', text: `Mưa nhẹ (${w.rain_mm}mm) — Chú ý mặt đường ướt, đặc biệt các đoạn cua tay áo vùng núi.` });
        }
        // Strong wind
        if (w.wind_kmh >= 50) {
          advisories.push({ level: 'danger', icon: '💨', text: `Gió rất mạnh (${w.wind_kmh}km/h, cấp ${w.wind_kmh < 62 ? '7' : '≥8'}) — Nguy hiểm với xe tải, xe máy trên đèo. Dừng lại nơi an toàn khi gió giật mạnh.` });
        } else if (w.wind_kmh >= 30) {
          advisories.push({ level: 'warning', icon: '🌬', text: `Gió mạnh (${w.wind_kmh}km/h, cấp ${w.wind_kmh < 40 ? '4–5' : '5–6'}) — Chú ý xe máy, xe tải nhẹ dễ bị ảnh hưởng, đặc biệt trên các đèo cao.` });
        }
        // Fog
        if (w.code >= 45 && w.code <= 48) {
          advisories.push({ level: 'warning', icon: '🌫', text: 'Sương mù dày — Tầm nhìn dưới 200m. Bật đèn sương mù, giảm tốc độ tối thiểu. Đặc biệt nguy hiểm trên đèo Bắc Sum, đèo Gió (Bắc Mê, Hà Giang).' });
        }
        // Humidity risk (slippery roads)
        if (w.humidity != null && w.humidity >= 90 && isMountain) {
          advisories.push({ level: 'watch', icon: '💧', text: `Độ ẩm rất cao (${w.humidity}%) — Mặt đường đèo núi dễ đọng ẩm, trơn trượt. Chú ý đoạn bóng cây, cua khuất.` });
        }
        // Mountain-specific general advisory
        if (isMountain && advisories.length === 0) {
          advisories.push({ level: 'safe', icon: '✅', text: 'Thời tiết thuận lợi — Đường đèo núi thông thoáng. Vẫn chú ý an toàn trên các đoạn cua tay áo và dốc dài.' });
        } else if (!isMountain && advisories.length === 0) {
          advisories.push({ level: 'safe', icon: '✅', text: 'Thời tiết tốt — Điều kiện giao thông thuận lợi. Tuân thủ tốc độ quy định.' });
        }
        // Landslide risk for mountain areas with rain
        if (isMountain && w.rain_mm >= 15) {
          advisories.push({ level: isHighMountain ? 'danger' : 'warning', icon: '🪨', text: `Nguy cơ sạt lở đường núi — Chú ý biển cảnh báo. Tham khảo cảnh báo PCTT tại phongchongthientai.vn.` });
        }
        return advisories;
      }

      async function hydrateEnviro(routes) {
        // Collect all unique points (lat/lng/isoDate)
        const seen = new Set();
        const tasks = [];
        routes.forEach(route => {
          route.points.forEach(point => {
            const key = `enviro|${buildCoordKey(point.lat, point.lng)}|${point.isoDate}`;
            if (seen.has(key)) return;
            seen.add(key);
            tasks.push((async () => {
              const data = await resolveEnviroDetail(point.lat, point.lng, point.isoDate);
              document.querySelectorAll(`[data-enviro-key="${key}"]`).forEach(el => {
                if (!data) {
                  el.innerHTML = `<div class="enviro-panel-title">🚦 Thời tiết &amp; Giao thông</div><div class="enviro-pending">Không lấy được dữ liệu</div>`;
                  return;
                }
                const w = data.weather;

                // Weather summary row
                let weatherRowHtml = '';
                if (w) {
                  weatherRowHtml = `
                    <div class="enviro-weather-row">
                      <div class="enviro-card">
                        <div class="enviro-card-label">🌡 Nhiệt độ</div>
                        <div class="enviro-card-value">${w.minTemp}–${w.maxTemp}°</div>
                        <div class="enviro-card-sub">°C</div>
                      </div>
                      <div class="enviro-card">
                        <div class="enviro-card-label">🌧 Mưa</div>
                        <div class="enviro-card-value">${w.rain_mm}</div>
                        <div class="enviro-card-sub">mm/ngày</div>
                      </div>
                      <div class="enviro-card">
                        <div class="enviro-card-label">💨 Gió</div>
                        <div class="enviro-card-value">${w.wind_kmh}</div>
                        <div class="enviro-card-sub">km/h</div>
                      </div>
                      <div class="enviro-card">
                        <div class="enviro-card-label">💧 Độ ẩm</div>
                        <div class="enviro-card-value">${w.humidity != null ? w.humidity : '—'}</div>
                        <div class="enviro-card-sub">${w.humidity != null ? '%' : ''}</div>
                      </div>
                    </div>
                    <div class="enviro-card-sub" style="margin-bottom:8px; color:#64748b;">${describeWeatherCode(w.code)}</div>
                  `;
                } else {
                  weatherRowHtml = `<div class="enviro-pending">⏳ Ngoài cửa sổ dự báo 16 ngày</div>`;
                }

                // Traffic advisories
                const advisories = buildTrafficAdvisories(w, data.elevation_m);
                const advisoriesHtml = advisories.map(a => `
                  <div class="enviro-alert level-${a.level}">
                    <span class="enviro-alert-icon">${a.icon}</span>
                    <span class="enviro-alert-text">${a.text}</span>
                  </div>
                `).join('');

                el.innerHTML = `
                  <div class="enviro-panel-title">🚦 Thời tiết &amp; Cảnh báo giao thông</div>
                  ${weatherRowHtml}
                  <div class="enviro-section-label">🛣 Khuyến cáo an toàn giao thông</div>
                  ${advisoriesHtml}
                `;
              });
            })());
          });
        });
        await Promise.all(tasks);
      }

      async function resolveWeather(lat, lng, isoDate, dateLabel) {
        const key = buildWeatherKey(lat, lng, isoDate);
        if (weatherCache.has(key)) {
          return weatherCache.get(key);
        }
        const payload = await fetchForecast(lat, lng);
        if (!payload || !payload.daily || !Array.isArray(payload.daily.time)) {
          const value = { status: "unavailable", text: "Không lấy được thời tiết" };
          weatherCache.set(key, value);
          return value;
        }
        const dayIndex = payload.daily.time.indexOf(isoDate);
        if (dayIndex < 0) {
          const value = { status: "unavailable", text: `Ngoài cửa sổ dự báo 16 ngày cho ${dateLabel}` };
          weatherCache.set(key, value);
          return value;
        }
        const code = payload.daily.weather_code[dayIndex];
        const minTemp = Math.round(payload.daily.temperature_2m_min[dayIndex]);
        const maxTemp = Math.round(payload.daily.temperature_2m_max[dayIndex]);
        const value = { status: "ready", text: `${describeWeatherCode(code)} · ${minTemp}-${maxTemp}°C` };
        weatherCache.set(key, value);
        return value;
      }

      function updateWeatherElement(key, weather) {
        document.querySelectorAll(`[data-weather-key="${key}"]`).forEach((element) => {
          element.textContent = weather.text;
          element.classList.remove("is-pending", "is-unavailable");
          if (weather.status !== "ready") {
            element.classList.add("is-unavailable");
          }
        });
      }

      async function hydrateWeather(routes) {
        const tasks = [];
        routes.forEach((route) => {
          route.points.forEach((point) => {
            const key = buildWeatherKey(point.lat, point.lng, point.isoDate);
            tasks.push((async () => {
              const weather = await resolveWeather(point.lat, point.lng, point.isoDate, point.dateLabel);
              updateWeatherElement(key, weather);
            })());
          });
        });
        await Promise.all(tasks);
      }

      function render() {
        const direction = getSelectedDirection();
        const routes = buildRoutes(direction);
        const activeRoute = resolveActiveRoute(routes);
        if (activeRoute) {
          state.activeRouteId = activeRoute.id;
          if (!activeRoute.points.some((point) => point.key === state.activeNodeKey)) {
            state.activeNodeKey = getPreferredRouteNodeKey(activeRoute);
          }
        }
        const nodes = buildVisibleNodes(routes, direction);
        renderDirectionTabs(direction);
        renderDayFilter(direction);
        renderBoard(routes, nodes);
        renderSummary(direction, routes, nodes);
        hydrateWeather(routes);
        hydrateEnviro(routes);
      }

      initializeViewportControls();
      initializeSummaryDrawer();
      updateViewport();
      render();
      window.setInterval(() => {
        forecastCache.clear();
        weatherCache.clear();
        elevationCache.clear();
        enviroDetailCache.clear();
        render();
      }, 600000);
    })();
  </script>
</body>
</html>
