<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page_title or 'Bản đồ ADN liệt sĩ - PhanMemPC06_Pro' }}</title>
  <style>
    :root {
      color-scheme: light;
      --bg-cream: #f4efe4;
      --surface: rgba(255, 255, 255, 0.92);
      --surface-strong: rgba(255, 255, 255, 0.98);
      --ink-900: #1f2937;
      --ink-700: #475569;
      --ink-500: #64748b;
      --font-sans: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --font-display: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
      --shadow-soft: 0 22px 54px rgba(63, 46, 18, 0.1);
      --shadow-card: 0 14px 32px rgba(15, 23, 42, 0.1);
      --day-1: #c4661f;
      --day-2: #325fd8;
      --day-3: #167b73;
      --day-4: #7c3aed;
      --day-5: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: var(--font-sans);
      color: var(--ink-900);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.62), rgba(244, 239, 228, 0.95)),
        radial-gradient(circle at top left, rgba(113, 148, 122, 0.18), transparent 35%),
        radial-gradient(circle at top right, rgba(196, 102, 31, 0.11), transparent 28%),
        var(--bg-cream);
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(122, 106, 70, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(122, 106, 70, 0.08) 1px, transparent 1px);
      background-size: 76px 76px;
      opacity: 0.22;
    }

    .pc06-home-link {
      position: fixed;
      top: 22px;
      right: 22px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 16px;
      border-radius: 999px;
      color: #fff;
      background: rgba(15, 23, 42, 0.9);
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.02em;
      box-shadow: var(--shadow-card);
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .pc06-home-link:hover,
    .pc06-home-link:focus-visible {
      background: rgba(15, 23, 42, 0.98);
      transform: translateY(-1px);
    }

    .page-shell {
      position: relative;
      z-index: 1;
      width: min(1780px, calc(100% - 40px));
      margin: 28px auto 32px;
      padding-top: 24px;
    }

    .toolbar-card,
    .map-card,
    .summary-card {
      background: var(--surface);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.76);
      border-radius: 32px;
      box-shadow: var(--shadow-soft);
    }

    .hero-kicker {
      position: relative;
      z-index: 1;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(154, 95, 29, 0.1);
      color: #9a5f1d;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    .toolbar-card {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 9px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.96), rgba(248, 244, 236, 0.9));
    }

    #direction-tabs,
    #day-filter {
      display: flex;
      flex-wrap: nowrap;
      gap: 8px;
      align-items: center;
    }

    .segmented-button,
    .day-chip {
      border: 0;
      border-radius: 18px;
      font: inherit;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease, color 0.16s ease;
    }

    .day-chip {
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.84);
      color: var(--ink-700);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.02em;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.06);
    }

    .segmented-button {
      min-width: auto;
      padding: 10px 20px;
      background: transparent;
      color: var(--ink-700);
      text-align: center;
      border-radius: 20px;
    }

    .segmented-button strong,
    .segmented-button span {
      display: block;
    }

    .segmented-button strong {
      font-size: 14px;
      font-family: var(--font-display);
    }

    .segmented-button span {
      display: none;
    }

    .segmented-button.is-active {
      background: rgba(255, 255, 255, 0.98);
      color: var(--ink-900);
      box-shadow: inset 0 0 0 1px rgba(196, 102, 31, 0.18), 0 12px 24px rgba(148, 95, 43, 0.08);
      transform: translateY(-1px);
    }

    .day-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .day-chip {
      padding: 10px 14px;
      background: rgba(255, 255, 255, 0.84);
      color: var(--ink-700);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.02em;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.06);
    }

    .day-chip.is-active {
      color: #fff;
      background: linear-gradient(135deg, rgba(196, 102, 31, 0.98), rgba(154, 95, 29, 0.96));
      box-shadow: 0 18px 30px rgba(196, 102, 31, 0.24);
    }

    .workspace {
      position: relative;
      display: block;
    }

    .map-card {
      padding: 18px;
    }

    .map-stage {
      position: relative;
      min-height: 980px;
      border-radius: 28px;
      overflow: hidden;
      user-select: none;
      background:
        linear-gradient(rgba(255, 255, 255, 0.91), rgba(253, 251, 247, 0.93)),
        url("{{ url_for('static', filename='img/bg_le_phat_dong.jpg') }}") no-repeat center center / cover;
      border: 1px solid rgba(226, 232, 240, 0.74);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6);
      isolation: isolate;
    }

    .map-header-title {
      font-size: 14.5px;
      font-weight: 800;
      color: #b91c1c; /* Dark red */
      letter-spacing: 0.05em;
      background: rgba(255, 255, 255, 0.95);
      padding: 10px 18px;
      border-radius: 14px;
      border: 1px solid rgba(239, 68, 68, 0.25);
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
      font-family: var(--font-display);
      text-transform: uppercase;
      width: fit-content;
      backdrop-filter: blur(8px);
      display: inline-flex;
      align-items: center;
      gap: 8px;
      pointer-events: none;
    }
    .map-header-title::before {
      content: "🛡️";
      font-size: 16px;
    }

    .map-stage.is-reference-mode {
      min-height: 980px;
    }

    /* ── Hub Sidebar (left panel, fixed catchment mode) ─────────────── */
    #hub-sidebar {
      position: absolute;
      top: 50%;
      left: 18px;
      transform: translateY(-50%);
      z-index: 12;
      width: 220px;
      max-height: calc(100% - 180px);
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(14px);
      border: 1px solid rgba(226, 232, 240, 0.9);
      border-radius: 20px;
      box-shadow: 0 8px 32px rgba(15, 23, 42, 0.12), 0 2px 8px rgba(15, 23, 42, 0.06);
      padding: 10px 8px;
      display: none;
      flex-direction: column;
      gap: 4px;
    }
    #hub-sidebar.is-visible {
      display: flex;
    }
    .hub-sidebar-head {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #94a3b8;
      padding: 4px 10px 6px;
      border-bottom: 1px solid rgba(226, 232, 240, 0.6);
      margin-bottom: 4px;
      font-family: var(--font-display);
    }
    .hub-sidebar-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 9px 10px;
      border-radius: 12px;
      border: none;
      background: transparent;
      cursor: pointer;
      text-align: left;
      width: 100%;
      transition: background 0.15s ease;
      font-family: var(--font-body, inherit);
    }
    .hub-sidebar-item:hover {
      background: rgba(196, 102, 31, 0.07);
    }
    .hub-sidebar-item.is-active {
      background: linear-gradient(135deg, rgba(196, 102, 31, 0.12), rgba(234, 179, 8, 0.08));
      border: 1px solid rgba(196, 102, 31, 0.2);
    }
    .hub-sidebar-dot {
      flex-shrink: 0;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      border: 2px solid #fff;
      box-shadow: 0 0 0 2px var(--item-color, #c4661f);
      background: var(--item-color, #c4661f);
    }
    .hub-sidebar-info {
      min-width: 0;
    }
    .hub-sidebar-name {
      display: block;
      font-size: 12.5px;
      font-weight: 700;
      color: #1e293b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.2;
    }
    .hub-sidebar-sub {
      display: block;
      font-size: 11px;
      color: #64748b;
      margin-top: 1px;
    }

    .map-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(148, 163, 184, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
      background-size: 86px 86px;
      opacity: 0.46;
    }

    .map-stage.is-grabbing {
      cursor: grabbing;
    }

    .map-hud {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      z-index: 6;
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 18px;
    }

    .map-switch-stack {
      width: fit-content;
      max-width: min(1180px, calc(100% - 80px));
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .map-filter-card {
      padding: 10px;
    }

    .map-filter-bar {
      display: flex;
      flex-wrap: nowrap;
      align-items: center;
      gap: 12px;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .map-filter-bar::-webkit-scrollbar {
      display: none;
    }



    .filter-divider {
      width: 1px;
      align-self: stretch;
      background: rgba(226, 232, 240, 0.92);
    }

    .map-toolbar {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 10px 10px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(226, 232, 240, 0.86);
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(14px);
    }

    .map-toolbar-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .map-overlay-card {
      width: fit-content;
      max-width: 100%;
      padding: 8px;
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(226, 232, 240, 0.88);
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
      backdrop-filter: blur(14px);
    }

    .map-control {
      border: 0;
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: rgba(248, 250, 252, 0.98);
      color: var(--ink-900);
      font: inherit;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(226, 232, 240, 0.88);
      transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .map-control:hover,
    .map-control:focus-visible {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.98);
      box-shadow: inset 0 0 0 1px rgba(196, 102, 31, 0.28), 0 10px 20px rgba(15, 23, 42, 0.08);
      outline: none;
    }

    .map-status {
      min-width: 76px;
      padding: 0 6px;
      color: var(--ink-700);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-align: center;
    }

    .summary-toggle {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border: 0;
      border-radius: 16px;
      background: rgba(15, 23, 42, 0.92);
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.18);
      transition: transform 0.16s ease, background 0.16s ease;
    }

    .summary-toggle:hover,
    .summary-toggle:focus-visible {
      background: rgba(15, 23, 42, 0.98);
      transform: translateY(-1px);
      outline: none;
    }

    .map-viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 1400px;
      height: 900px;
      transform-origin: 0 0;
      z-index: 1;
      will-change: transform;
    }

    .map-svg,
    .node-layer,
    .segment-layer {
      position: absolute;
      inset: 0;
      width: 1400px;
      height: 900px;
    }

    .map-svg {
      z-index: 1;
      overflow: visible;
    }

    .segment-layer {
      z-index: 4;
      pointer-events: none;
    }

    .node-layer {
      z-index: 3;
      pointer-events: none;
    }

    .route-path {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.96;
      transition: opacity 0.18s ease, stroke-width 0.18s ease;
    }

    .route-path.route-path-catchment {
      opacity: 0.88;
      stroke-dasharray: 8 6;
      animation: dash-catchment 2.2s linear infinite;
    }

    @keyframes dash-catchment {
      to {
        stroke-dashoffset: 140;
      }
    }


    .route-path.is-active {
      opacity: 1;
      filter: drop-shadow(0 10px 20px rgba(15, 23, 42, 0.14));
    }

    .map-node {
      position: absolute;
      width: 0;
      height: 0;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      pointer-events: auto;
      color: inherit;
      transform: none;
      transition:
        left 0.55s cubic-bezier(0.34, 1.56, 0.64, 1),
        top  0.55s cubic-bezier(0.34, 1.56, 0.64, 1),
        opacity 0.36s ease,
        transform 0.36s ease;
      overflow: visible;
    }

    /* Hub states — hubs always show at full opacity in fixed column */
    .map-node.is-hub-idle {
      opacity: 1;
      transform: scale(1);
    }
    .map-node.is-hub-idle:hover {
      opacity: 1;
      transform: scale(1.08);
    }
    .map-node.is-hub-focused {
      opacity: 1;
      transform: scale(1);
      z-index: 10;
    }
    .map-node.is-hub-focused .map-node-dot {
      animation: hub-pulse 2.2s ease-in-out infinite;
    }
    @keyframes hub-pulse {
      0%, 100% {
        box-shadow:
          0 0 0 8px rgba(255,255,255,0.4),
          0 0 0 18px rgba(196,102,31,0.18),
          0 0 40px 8px rgba(196,102,31,0.22),
          0 22px 42px rgba(15,23,42,0.3);
      }
      50% {
        box-shadow:
          0 0 0 8px rgba(255,255,255,0.4),
          0 0 0 26px rgba(196,102,31,0.07),
          0 0 64px 18px rgba(196,102,31,0.12),
          0 22px 42px rgba(15,23,42,0.3);
      }
    }

    /* Staggered satellite reveal */
    .map-node.is-area-hidden {
      opacity: 0;
      transform: scale(0.38) translateX(-24px);
      pointer-events: none;
    }
    .map-node.is-area-reveal {
      opacity: 1;
      transform: scale(1);
      transition:
        left 0.55s cubic-bezier(0.34, 1.56, 0.64, 1),
        top  0.55s cubic-bezier(0.34, 1.56, 0.64, 1),
        opacity 0.38s ease,
        transform 0.46s cubic-bezier(0.34, 1.56, 0.64, 1);
    }


    .map-node.is-dimmed {
      opacity: 0.82;
    }

    .map-node:hover,
    .map-node:focus-visible {
      transform: scale(1.03);
      outline: none;
      z-index: 5;
    }

    .map-node.is-active {
      z-index: 6;
    }

    .map-node.is-area-node {
      opacity: 0.95;
    }

    .map-node-dot {
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(-50%, -50%);
      width: var(--node-size);
      height: var(--node-size);
      border-radius: 50%;
      background: var(--node-color);
      border: 4px solid rgba(255, 255, 255, 0.96);
      box-shadow:
        0 0 0 6px rgba(255, 255, 255, 0.24),
        0 18px 34px rgba(15, 23, 42, 0.2);
    }

    .map-node.is-active .map-node-dot {
      box-shadow:
        0 0 0 7px rgba(255, 255, 255, 0.34),
        0 0 0 15px rgba(196, 102, 31, 0.16),
        0 22px 42px rgba(15, 23, 42, 0.28);
    }

    .map-node-label {
      position: absolute;
      min-width: max-content;
      max-width: 210px;
      padding: 7px 10px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(226, 232, 240, 0.78);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.07);
      color: var(--ink-900);
      text-align: left;
      pointer-events: none;
      backdrop-filter: blur(10px);
    }

    .map-node-label strong,
    .map-node-label span,
    .map-node-label small {
      display: block;
    }

    .map-node-label strong {
      font-size: 14px;
      line-height: 1.14;
      letter-spacing: -0.02em;
      font-family: var(--font-display);
    }

    .map-node-label span {
      margin-top: 3px;
      color: var(--ink-700);
      font-size: 11px;
      font-weight: 900;
    }

    .map-node-label small {
      margin-top: 5px;
      color: var(--ink-500);
      font-size: 10px;
      font-weight: 700;
      line-height: 1.35;
    }

    .map-node:not(.is-active) .map-node-label small {
      display: none;
    }

    .map-node.is-area-node .map-node-label {
      padding: 5px 8px;
      max-width: 160px;
    }

    .map-node.is-area-node .map-node-label strong {
      font-size: 12px;
    }

    .map-node.is-area-node .map-node-label span {
      font-size: 10px;
    }

    .map-node.is-active .map-node-label {
      padding: 8px 11px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.98);
      border: 1px solid rgba(226, 232, 240, 0.84);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.08);
    }

    .anchor-right .map-node-label {
      left: 16px;
      top: 0;
      transform: translateY(-58%);
    }

    .anchor-left .map-node-label {
      right: 16px;
      top: 0;
      transform: translateY(-58%);
      text-align: right;
    }

    .anchor-bottom .map-node-label {
      top: 16px;
      left: 0;
      transform: translateX(-50%);
      text-align: center;
    }

    .anchor-top .map-node-label {
      bottom: 16px;
      left: 0;
      transform: translateX(-50%);
      text-align: center;
    }

    .segment-badge {
      position: absolute;
      transform: translate(-50%, -50%);
      padding: 0;
      background: transparent;
      border: none;
      box-shadow: none;
      color: #0f172a;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.2;
      white-space: nowrap;
      pointer-events: none;
      text-align: center;
      font-family: var(--font-display);
      text-shadow: 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff, 0 0 3px #fff;
      transition: transform 0.15s ease;
    }



    .map-note {
      position: absolute;
      left: 50%;
      bottom: 18px;
      z-index: 6;
      transform: translateX(-50%);
      width: min(760px, calc(100% - 48px));
      padding: 12px 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 18px 34px rgba(15, 23, 42, 0.08);
      color: var(--ink-700);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.45;
      text-align: left;
    }

    .map-note strong {
      color: var(--ink-900);
    }

    .summary-drawer {
      position: fixed;
      top: 86px;
      right: 20px;
      z-index: 22;
      width: min(380px, calc(100vw - 28px));
      max-height: calc(100vh - 108px);
      transform: translateX(calc(100% + 24px));
      transition: transform 0.22s ease;
      pointer-events: none;
    }

    .summary-drawer.is-open {
      transform: translateX(0);
      pointer-events: auto;
    }

    .summary-drawer-shell {
      display: grid;
      gap: 10px;
      height: 100%;
    }

    .summary-drawer-head {
      display: flex;
      justify-content: flex-end;
    }

    .summary-close {
      width: 42px;
      height: 42px;
      border: 0;
      border-radius: 14px;
      background: rgba(255, 255, 255, 0.96);
      color: var(--ink-900);
      font-size: 22px;
      cursor: pointer;
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.1);
    }

    .summary-card {
      padding: 18px;
      max-height: calc(100vh - 162px);
      overflow: auto;
      background: rgba(255, 255, 255, 0.97);
    }

    .summary-head {
      display: grid;
      gap: 8px;
    }

    .summary-head h2 {
      margin: 0;
      font-size: 24px;
      line-height: 1.02;
      letter-spacing: -0.03em;
      font-family: var(--font-display);
      font-weight: 800;
    }

    .summary-context {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .summary-blocks {
      display: grid;
      gap: 12px;
      margin-top: 16px;
    }

    .summary-block {
      display: grid;
      gap: 10px;
      padding: 13px;
      border-radius: 20px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(248, 244, 236, 0.9));
      border: 1px solid rgba(226, 232, 240, 0.84);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.72), 0 6px 16px rgba(15, 23, 42, 0.04);
    }

    .summary-block-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--ink-500);
    }

    .route-summary,
    .route-day-group {
      display: grid;
      gap: 8px;
    }

    .route-day-title {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--ink-900);
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .route-day-swatch {
      width: 24px;
      height: 8px;
      border-radius: 999px;
      background: var(--day-color);
      flex: 0 0 auto;
    }

    .route-item {
      width: 100%;
      border: 0;
      padding: 11px 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(226, 232, 240, 0.8);
      text-align: left;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .route-item:hover,
    .route-item:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.08);
      outline: none;
    }

    .route-item.is-active {
      background: rgba(255, 255, 255, 0.98);
      box-shadow: inset 0 0 0 2px var(--route-color), 0 14px 28px rgba(15, 23, 42, 0.08);
    }

    .route-item strong,
    .route-item span,
    .route-item small {
      display: block;
    }

    .route-item strong {
      font-size: 13px;
      line-height: 1.3;
      font-family: var(--font-display);
    }

    .route-item span {
      margin-top: 4px;
      color: var(--ink-700);
      font-size: 11px;
      font-weight: 800;
      line-height: 1.45;
    }

    .route-item small {
      margin-top: 4px;
      color: var(--ink-500);
      font-size: 11px;
      line-height: 1.45;
    }

    .detail-card {
      padding: 14px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(226, 232, 240, 0.82);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.62);
    }

    .detail-card strong,
    .detail-card span,
    .detail-card small {
      display: block;
    }

    .detail-card strong {
      font-size: 16px;
      line-height: 1.2;
      font-family: var(--font-display);
    }

    .detail-card span {
      margin-top: 5px;
      color: var(--ink-700);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.5;
    }

    .detail-card small {
      margin-top: 6px;
      color: var(--ink-500);
      font-size: 11px;
      line-height: 1.45;
    }

    .detail-list {
      display: grid;
      gap: 7px;
      margin-top: 10px;
    }

    .detail-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 8px 10px;
      border-radius: 12px;
      background: rgba(248, 250, 252, 0.88);
      border: 1px solid rgba(226, 232, 240, 0.74);
    }

    .detail-row span,
    .detail-row strong {
      margin: 0;
    }

    .detail-row-copy {
      min-width: 0;
      flex: 1 1 auto;
    }

    .detail-row span {
      color: var(--ink-700);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.45;
    }

    .detail-row-copy span,
    .detail-row-copy small {
      display: block;
    }

    .detail-row-copy small {
      margin-top: 3px;
      color: var(--ink-500);
      font-size: 11px;
      line-height: 1.4;
    }

    .detail-weather.is-pending {
      color: var(--ink-500);
    }

    .detail-weather.is-unavailable {
      color: #b45309;
    }

    /* ── Weather / Traffic Panel ─────────────────────── */
    .enviro-panel {
      background: #ffffff;
      border-radius: 12px;
      padding: 14px 16px 12px;
      margin-bottom: 18px;
      border: 1.5px solid #e2e8f0;
      box-shadow: 0 1px 6px rgba(15,23,42,0.06);
    }
    .enviro-panel-title {
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #64748b;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .enviro-weather-row {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }
    .enviro-card {
      background: #f8fafc;
      border-radius: 9px;
      padding: 9px 10px;
      border: 1px solid #e8edf3;
      text-align: center;
    }
    .enviro-card-label {
      font-size: 9.5px;
      color: #94a3b8;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.6px;
      margin-bottom: 4px;
    }
    .enviro-card-value {
      font-size: 15px;
      font-weight: 800;
      color: #1e293b;
      line-height: 1.1;
    }
    .enviro-card-sub {
      font-size: 9.5px;
      color: #94a3b8;
      margin-top: 2px;
    }
    /* Traffic alert row */
    .enviro-alert {
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 700;
      display: flex;
      align-items: flex-start;
      gap: 7px;
      margin-bottom: 6px;
      line-height: 1.45;
    }
    .enviro-alert-icon { flex-shrink: 0; font-size: 14px; margin-top: 1px; }
    .enviro-alert-text { flex: 1; }
    .enviro-alert.level-safe    { background: #f0fdf4; color: #166534; border: 1px solid #bbf7d0; }
    .enviro-alert.level-watch   { background: #fefce8; color: #854d0e; border: 1px solid #fde68a; }
    .enviro-alert.level-warning { background: #fff7ed; color: #9a3412; border: 1px solid #fed7aa; }
    .enviro-alert.level-danger  { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
    .enviro-section-label {
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: #94a3b8;
      margin: 10px 0 6px;
    }
    .enviro-pending {
      text-align: center;
      color: #94a3b8;
      font-size: 12px;
      padding: 10px 0;
      font-style: italic;
    }

    .detail-row strong {
      font-size: 13px;
    }

    .detail-row-note {
      align-items: flex-start;
    }

    .detail-row-note strong {
      max-width: 68%;
      color: var(--ink-700);
      font-size: 12px;
      line-height: 1.45;
      text-align: right;
    }

    .detail-day-stack {
      display: grid;
      gap: 10px;
    }

    .detail-day-card {
      display: block;
      padding: 0;
      border-radius: 16px;
      background: rgba(248, 250, 252, 0.78);
      border: 1px solid rgba(226, 232, 240, 0.78);
      overflow: hidden;
    }

    .detail-day-card[open] {
      background: rgba(255, 255, 255, 0.9);
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.06);
    }

    .detail-day-toggle {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      padding: 12px;
      cursor: pointer;
      list-style: none;
    }

    .detail-day-toggle::-webkit-details-marker {
      display: none;
    }

    .detail-day-head strong,
    .detail-day-head small {
      display: block;
      margin: 0;
    }

    .detail-day-head strong {
      font-size: 13px;
      line-height: 1.35;
    }

    .detail-day-head small {
      margin-top: 4px;
      color: var(--ink-500);
      font-size: 11px;
      line-height: 1.5;
    }

    .detail-day-meta {
      flex: 0 0 auto;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(196, 102, 31, 0.12);
      color: #9a5f1d;
      font-size: 11px;
      font-weight: 900;
      white-space: nowrap;
    }

    .detail-day-body {
      display: grid;
      gap: 10px;
      padding: 0 12px 12px;
      border-top: 1px solid rgba(226, 232, 240, 0.72);
    }

    .detail-tab-shell {
      display: grid;
      gap: 10px;
      padding-top: 10px;
    }

    .detail-tab-bar {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .detail-tab-chip {
      border: 0;
      padding: 7px 11px;
      border-radius: 999px;
      background: rgba(241, 245, 249, 0.92);
      color: var(--ink-600, #475569);
      font: inherit;
      font-size: 11px;
      font-weight: 900;
      letter-spacing: 0.02em;
      cursor: pointer;
      transition: background 0.16s ease, color 0.16s ease, box-shadow 0.16s ease;
    }

    .detail-tab-chip.is-active {
      background: rgba(196, 102, 31, 0.14);
      color: #9a5f1d;
      box-shadow: inset 0 0 0 1px rgba(196, 102, 31, 0.18);
    }

    .detail-tab-panel {
      display: none;
      gap: 8px;
    }

    .detail-tab-panel.is-active {
      display: grid;
    }

    .detail-copy-grid {
      display: grid;
      gap: 8px;
    }

    .detail-copy-grid.is-two-col {
      grid-template-columns: repeat(2, minmax(0, 1fr));
    }

    .detail-copy-block {
      display: grid;
      gap: 4px;
      padding: 9px 10px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.86);
      border: 1px solid rgba(226, 232, 240, 0.72);
    }

    .detail-copy-label {
      color: var(--ink-500);
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }

    .detail-copy-value {
      margin: 0;
      color: var(--ink-800, #334155);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.55;
      white-space: pre-line;
      word-break: break-word;
    }

    .summary-metric {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(148, 163, 184, 0.12);
      color: var(--ink-700);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.02em;
    }

    .summary-empty {
      color: var(--ink-500);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.45;
    }

    .metric-inline {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      width: fit-content;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(196, 102, 31, 0.1);
      color: #9a5f1d;
      font-size: 11px;
      font-weight: 900;
    }

    .detail-chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 10px;
    }

    .detail-emphasis {
      padding: 14px;
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(248, 244, 236, 0.92));
      border: 1px solid rgba(226, 232, 240, 0.82);
      box-shadow: 0 10px 22px rgba(15, 23, 42, 0.06);
    }

    @media (max-width: 1080px) {
      .summary-drawer {
        top: 78px;
        right: 14px;
        width: min(360px, calc(100vw - 20px));
      }
    }

    @media (max-width: 768px) {
      .pc06-home-link {
        top: 12px;
        right: 12px;
        padding: 10px 13px;
      }

      .page-shell {
        width: min(100% - 20px, 100%);
        margin: 16px auto 20px;
        padding-top: 54px;
      }

      .toolbar-card,
      .map-card,
      .summary-card {
        border-radius: 24px;
      }

      .summary-card {
        padding: 18px;
      }

      .map-stage {
        min-height: 820px;
      }

      .map-hud {
        right: 12px;
        left: 12px;
        gap: 12px;
      }

      .map-switch-stack {
        max-width: calc(100% - 62px);
      }

      .map-toolbar {
        top: 12px;
        width: auto;
        flex-wrap: wrap;
      }

      .filter-divider {
        display: none;
      }

      .detail-copy-grid.is-two-col {
        grid-template-columns: minmax(0, 1fr);
      }

      .summary-drawer {
        top: 74px;
        right: 10px;
        width: calc(100vw - 20px);
        max-height: calc(100vh - 92px);
      }

      .summary-card {
        max-height: calc(100vh - 146px);
      }
    }
  </style>
</head>
<body>
  <a class="pc06-home-link" href="{{ pc06_home_url or '/dashboard' }}">
    {{ pc06_home_label or 'Đăng nhập PC06' }}
  </a>

  <main class="page-shell">
    <section class="workspace">
      <div class="map-card">
        <div class="map-stage" id="map-stage">
          <div class="map-hud">
            <div class="map-switch-stack">
              <div class="map-overlay-card map-filter-card">
                <div class="map-filter-bar">
                  <div id="direction-tabs"></div>
                  <div class="filter-divider"></div>
                  <div class="day-filter" id="day-filter"></div>
                </div>
              </div>
              <div class="map-header-title">
                PHƯƠNG ÁN THU NHẬN MẪU ADN TRÊN ĐỊA BÀN TỈNH TUYÊN QUANG
              </div>
            </div>
            <div class="map-toolbar">
              <div class="map-toolbar-group">
                <button type="button" class="map-control" id="zoom-out-button" aria-label="Thu nhỏ">-</button>
                <div class="map-status" id="map-status">100%</div>
                <button type="button" class="map-control" id="zoom-in-button" aria-label="Phóng to">+</button>
                <button type="button" class="map-control" id="reset-view-button" aria-label="Đặt lại góc nhìn">↺</button>
                <span style="font-size: 11px; opacity: 0.6; margin-left: 8px; font-weight: 600; font-family: var(--font-display);">v3.9.2</span>

              </div>
              <button type="button" class="summary-toggle" id="summary-toggle" aria-label="Mở thông tin">☰</button>
            </div>
          </div>
          <div id="hub-sidebar"></div>
          <div class="map-viewport" id="map-viewport">
            <svg class="map-svg" id="map-svg" viewBox="0 0 1400 900" aria-hidden="true"></svg>
            <div class="segment-layer" id="segment-layer"></div>
            <div class="node-layer" id="node-layer"></div>
          </div>
          <div class="map-note" id="map-note"></div>
        </div>
      </div>
    </section>
    <aside class="summary-drawer" id="summary-drawer">
      <div class="summary-drawer-shell">
        <div class="summary-drawer-head">
          <button type="button" class="summary-close" id="summary-close" aria-label="Đóng thông tin">×</button>
        </div>
        <section class="summary-card" id="summary-panel"></section>
      </div>
    </aside>
  </main>

  <script src="{{ url_for('static', filename='js/martyr-adn-schedule-data.js') }}"></script>
  <script src="{{ url_for('static', filename='js/martyr-adn-route-metrics.js') }}"></script>
  <script src="{{ url_for('static', filename='js/martyr-adn-catchment-metrics.js') }}"></script>
  <script>
    (() => {
      const data = window.ADN_SCHEDULE_DATA;
      const routeMetrics = window.ADN_ROUTE_METRICS || {};
      const catchmentMetrics = window.ADN_CATCHMENT_METRICS || {};
      const TRACK_COLORS = ["#c4661f", "#325fd8", "#167b73"];
      const DAY_COLORS = ["#c4661f", "#325fd8", "#167b73", "#7c3aed", "#dc2626"];
      const STAGE_WIDTH = 1400;
      const STAGE_HEIGHT = 900;
      const directionTabsEl = document.getElementById("direction-tabs");
      const dayFilterEl = document.getElementById("day-filter");
      const pageShellEl = document.querySelector(".page-shell");
      const mapStageEl = document.getElementById("map-stage");
      const mapViewportEl = document.getElementById("map-viewport");
      const mapSvgEl = document.getElementById("map-svg");
      const nodeLayerEl = document.getElementById("node-layer");
      const segmentLayerEl = document.getElementById("segment-layer");
      const summaryPanelEl = document.getElementById("summary-panel");
      const mapStatusEl = document.getElementById("map-status");
      const mapNoteEl = document.getElementById("map-note");
      const zoomInButtonEl = document.getElementById("zoom-in-button");
      const zoomOutButtonEl = document.getElementById("zoom-out-button");
      const resetViewButtonEl = document.getElementById("reset-view-button");
      const summaryDrawerEl = document.getElementById("summary-drawer");
      const summaryToggleEl = document.getElementById("summary-toggle");
      const summaryCloseEl = document.getElementById("summary-close");

      const state = {
        directionId: data.directions[0].id,
        dayIndex: null,
        activeRouteId: null,
        activeNodeKey: null,
        viewport: {
          scale: 1,
          translateX: 0,
          translateY: 0
        },
        summaryOpen: false,
        shouldAutoFit: true
      };

      const forecastCache = new Map();
      const weatherCache = new Map();
      const elevationCache = new Map();
      const enviroDetailCache = new Map();
      const interactionState = {
        isDragging: false,
        startX: 0,
        startY: 0,
        translateX: 0,
        translateY: 0
      };

      function formatNumber(value) {
        return new Intl.NumberFormat("vi-VN").format(Number(value || 0));
      }

      function toIsoDate(dateLabel) {
        const parts = String(dateLabel || "").split("/");
        if (parts.length !== 3) {
          return "";
        }
        const [day, month, year] = parts;
        return `${year}-${String(Number(month)).padStart(2, "0")}-${String(Number(day)).padStart(2, "0")}`;
      }

      function buildNodeKey(name, lat, lng) {
        return `${name}|${Number(lat).toFixed(6)}|${Number(lng).toFixed(6)}`;
      }

      function buildCatchmentMetricKey(areaName, hubName) {
        return `${normalizePlaceName(areaName)}=>${normalizePlaceName(hubName)}`.toLowerCase();
      }

      function buildRouteMetricKey(origin, destination) {
        return `${Number(origin.lat).toFixed(6)}|${Number(origin.lng).toFixed(6)}|${Number(destination.lat).toFixed(6)}|${Number(destination.lng).toFixed(6)}`;
      }

      function buildCoordKey(lat, lng) {
        return `${Number(lat).toFixed(6)}|${Number(lng).toFixed(6)}`;
      }

      function buildWeatherKey(lat, lng, isoDate) {
        return `${buildCoordKey(lat, lng)}|${isoDate}`;
      }

      function getCatchmentMetric(areaName, hubName) {
        return catchmentMetrics[buildCatchmentMetricKey(areaName, hubName)] || null;
      }

      function hasNumericMetric(metric) {
        return metric && Number.isFinite(Number(metric.distance_km)) && Number.isFinite(Number(metric.travel_minutes));
      }

      function formatMetricText(metric) {
        if (!metric) {
          return "";
        }
        const parts = [];
        if (Number.isFinite(Number(metric.distance_km))) {
          parts.push(`${formatNumber(metric.distance_km)}km`);
        }
        if (Number.isFinite(Number(metric.travel_minutes))) {
          parts.push(`${formatNumber(metric.travel_minutes)}p`);
        }
        return parts.join(" - ");
      }


      function describeWeatherCode(code) {
        if (code === 0) return "☀️ Trời quang";
        if (code >= 1 && code <= 2) return "🌤️ Ít mây";
        if (code === 3) return "☁️ Nhiều mây";
        if (code >= 45 && code <= 48) return "🌫️ Sương mù";
        if (code >= 51 && code <= 55) return "🌦️ Mưa phùn";
        if (code >= 61 && code <= 65) return "🌧️ Mưa vừa";
        if (code === 66 || code === 67) return "🌧️ Mưa đóng băng";
        if (code >= 71 && code <= 77) return "❄️ Mưa tuyết";
        if (code >= 80 && code <= 82) return "🌧️ Mưa rào";
        if (code === 85 || code === 86) return "❄️ Mưa tuyết rào";
        if (code === 95) return "⛈️ Dông";
        if (code >= 96) return "⛈️ Dông đá";
        return "🌥️ Thời tiết thay đổi";
      }

      function weatherDisasterLevel(rain_mm, wind_kmh, code) {
        // Returns { level: 'safe'|'watch'|'warning'|'danger', label, icon }
        const isThunder = code >= 95;
        const isHeavyRain = rain_mm >= 50;
        const isModerateRain = rain_mm >= 15;
        const isStrongWind = wind_kmh >= 50;
        const isModerateWind = wind_kmh >= 30;

        if (isThunder || isHeavyRain || isStrongWind) {
          return { level: 'danger', icon: '🚨', label: `Cảnh báo cao — ${isThunder ? 'Dông sét' : ''}${isHeavyRain ? ' Mưa lớn' : ''}${isStrongWind ? ' Gió mạnh' : ''}`.trim() };
        }
        if (isModerateRain || isModerateWind) {
          return { level: 'warning', icon: '⚠️', label: `Chú ý — ${isModerateRain ? 'Mưa vừa' : ''}${isModerateWind ? ' Gió mạnh vừa' : ''}`.trim() };
        }
        if (rain_mm >= 5) {
          return { level: 'watch', icon: '🔶', label: 'Theo dõi — Có mưa nhẹ' };
        }
        return { level: 'safe', icon: '✅', label: 'Thuận lợi — Thời tiết tốt' };
      }

      function terrainDescription(elevation_m) {
        if (elevation_m == null) return { label: '—', type: 'Không rõ' };
        if (elevation_m < 100) return { label: `${Math.round(elevation_m)}m`, type: '🏙️ Đồng bằng/ven đô' };
        if (elevation_m < 500) return { label: `${Math.round(elevation_m)}m`, type: '🌄 Trung du' };
        if (elevation_m < 1000) return { label: `${Math.round(elevation_m)}m`, type: '⛰️ Miền núi' };
        return { label: `${Math.round(elevation_m)}m`, type: '🏔️ Núi cao' };
      }

      function getSelectedDirection() {
        return data.directions.find((direction) => direction.id === state.directionId) || data.directions[0];
      }

      function getVisibleDays(direction) {
        if (state.dayIndex === null) {
          return direction.days.map((day, index) => ({ day, dayIndex: index }));
        }
        return direction.days[state.dayIndex] ? [{ day: direction.days[state.dayIndex], dayIndex: state.dayIndex }] : [];
      }

      function isReferenceBoardMode(direction) {
        return direction && direction.id === "co-dinh" && state.dayIndex === null;
      }

      function buildDirectionPointLookup(direction) {
        const lookup = new Map();
        direction.days.forEach((day) => {
          day.tracks.forEach((track) => {
            const stops = direction.id === "co-dinh" ? track.stops : track.visits;
            stops.forEach((stop) => {
              if (!stop || !stop.name || lookup.has(stop.name)) {
                return;
              }
              lookup.set(stop.name, {
                name: stop.name,
                lat: Number(stop.lat),
                lng: Number(stop.lng)
              });
            });
          });
        });
        return lookup;
      }

      function renderDirectionTabs(direction) {
        directionTabsEl.innerHTML = "";
        data.directions.forEach((item) => {
          const button = document.createElement("button");
          button.type = "button";
          const cleanLabel = item.id === "co-dinh" ? "Cố định" : (item.id === "luu-dong" ? "Lưu động" : item.label);
          button.className = "segmented-button" + (item.id === direction.id ? " is-active" : "");
          button.title = cleanLabel;
          button.innerHTML = `<strong>${cleanLabel}</strong>`;
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            if (state.directionId === item.id) {
              return;
            }
            state.directionId = item.id;

            state.activeRouteId = null;
            state.activeNodeKey = null;
            state.shouldAutoFit = true;
            render();
          });
          directionTabsEl.appendChild(button);
        });
      }

      function renderDayFilter(direction) {
        dayFilterEl.innerHTML = "";
        const allButton = document.createElement("button");
        allButton.type = "button";
        allButton.className = "day-chip" + (state.dayIndex === null ? " is-active" : "");
        allButton.textContent = "Tất cả";
        allButton.addEventListener("click", (event) => {
          event.stopPropagation();
          if (state.dayIndex === null) {
            return;
          }
          state.dayIndex = null;
          state.activeRouteId = null;
          state.activeNodeKey = null;
          state.shouldAutoFit = true;
          render();
        });
        dayFilterEl.appendChild(allButton);

        direction.days.forEach((day, dayIndex) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "day-chip" + (state.dayIndex === dayIndex ? " is-active" : "");
          button.textContent = day.dateLabel;
          button.addEventListener("click", (event) => {
            event.stopPropagation();
            if (state.dayIndex === dayIndex) {
              return;
            }
            state.dayIndex = dayIndex;
            state.activeRouteId = null;
            state.activeNodeKey = null;
            state.shouldAutoFit = true;
            render();
          });

        });
      }

      function getMetric(origin, destination) {
        const cached = routeMetrics[buildRouteMetricKey(origin, destination)];
        if (cached) {
          return cached;
        }
        const reversed = routeMetrics[buildRouteMetricKey(destination, origin)];
        if (reversed) {
          return reversed;
        }
        if (origin.lat === destination.lat && origin.lng === destination.lng) {
          return {
            distance_km: 0,
            travel_minutes: 0,
            source: "same-site"
          };
        }
        const toRadians = (value) => value * Math.PI / 180;
        const earthRadiusKm = 6371;
        const latDelta = toRadians(destination.lat - origin.lat);
        const lngDelta = toRadians(destination.lng - origin.lng);
        const startLat = toRadians(origin.lat);
        const endLat = toRadians(destination.lat);
        const haversineValue = (
          Math.sin(latDelta / 2) ** 2
          + Math.cos(startLat) * Math.cos(endLat) * Math.sin(lngDelta / 2) ** 2
        );
        const crowDistance = 2 * earthRadiusKm * Math.atan2(
          Math.sqrt(haversineValue),
          Math.sqrt(Math.max(0, 1 - haversineValue))
        );
        const distanceKm = crowdDistanceFix(crowDistance * 1.85);
        return {
          distance_km: Number(distanceKm.toFixed(1)),
          travel_minutes: Math.max(1, Math.round(distanceKm / 55 * 60)),
          source: "estimated"
        };
      }

      function crowdDistanceFix(value) {
        return Number(value || 0);
      }

      function parsePlannedTotal(value) {
        const normalized = String(value || "").trim();
        if (!normalized || /^không có$/i.test(normalized)) {
          return null;
        }
        const match = normalized.match(/(\d[\d.]*)/);
        return match ? Number(match[1].replace(/\./g, "")) : null;
      }

      function dedupeConsecutivePoints(points) {
        const deduped = [];
        points.forEach((point) => {
          if (!deduped.length || deduped[deduped.length - 1].key !== point.key) {
            deduped.push(point);
          }
        });
        return deduped;
      }

      function buildRoutes(direction) {
        const visibleDays = getVisibleDays(direction);
        const routes = [];
        const trackCount = visibleDays[0] ? visibleDays[0].day.tracks.length : 0;

        for (let trackIndex = 0; trackIndex < trackCount; trackIndex += 1) {
          const points = [];
          const dayDetails = [];
          let total = 0;

          visibleDays.forEach(({ day, dayIndex }) => {
            const track = day.tracks[trackIndex];
            const dayPoints = [];
            const dayNotes = [];

            if (direction.id === "co-dinh") {
              track.stops.forEach((stop) => {
                const point = {
                  key: buildNodeKey(stop.name, stop.lat, stop.lng),
                  name: stop.name,
                  lat: stop.lat,
                  lng: stop.lng,
                  total: Number(stop.total || 0),
                  session: stop.session,
                  dayLabel: day.dayLabel,
                  dateLabel: day.dateLabel,
                  isoDate: toIsoDate(day.dateLabel),
                  dayIndex,
                  areas: stop.areas || []
                };
                total += point.total;
                dayPoints.push(point);
                points.push(point);
              });
            } else {
              track.visits.forEach((visit) => {
                if (visit.name) {
                  const point = {
                    key: buildNodeKey(visit.name, visit.lat, visit.lng),
                    name: visit.name,
                    lat: visit.lat,
                    lng: visit.lng,
                    total: Number(visit.count || 0),
                    session: visit.session || "Cả ngày",
                    dayLabel: day.dayLabel,
                    dateLabel: day.dateLabel,
                    isoDate: toIsoDate(day.dateLabel),
                    dayIndex,
                    areas: []
                  };
                  total += point.total;
                  dayPoints.push(point);
                  points.push(point);
                  return;
                }

                if (visit.label) {
                  dayNotes.push(visit.label);
                }
              });
            }

            const explicitTotal = dayPoints.reduce((sum, point) => sum + Number(point.total || 0), 0);
            const reportedTotal = direction.id === "luu-dong"
              ? (parsePlannedTotal(track.planned) ?? explicitTotal)
              : explicitTotal;
            if (direction.id === "luu-dong" && reportedTotal > explicitTotal) {
              dayNotes.push(`Word gốc ghi ${formatNumber(reportedTotal)} TNLS, nhưng chỉ nêu rõ ${formatNumber(explicitTotal)} TNLS theo từng điểm; còn ${formatNumber(reportedTotal - explicitTotal)} TNLS chưa tách địa điểm cụ thể.`);
            }
            const detailSummary = dayPoints.length
              ? dayPoints.map((point) => point.name).join(" -> ")
              : (dayNotes.join(" · ") || track.title || track.label);

            if (dayPoints.length || dayNotes.length || reportedTotal > 0) {
              dayDetails.push({
                dayIndex,
                dayLabel: day.dayLabel,
                dateLabel: day.dateLabel,
                color: DAY_COLORS[dayIndex] || DAY_COLORS[0],
                title: track.sourceTitle || track.title,
                titleShort: track.title || track.sourceTitle || track.label,
                total: reportedTotal,
                summary: detailSummary,
                points: dayPoints,
                notes: dayNotes,
                planned: track.planned || "",
                plannedText: track.plannedText || track.planned || "",
                venue: track.venue || "",
                equipmentProvince: track.equipmentProvince || "",
                equipmentTeam: track.equipmentTeam || "",
                staffCore: track.staffCore || "",
                staffSite: track.staffSite || "",
                scheduleText: track.scheduleText || ""
              });
            }
          });

          const routePoints = dedupeConsecutivePoints(points);
          if (!routePoints.length && !dayDetails.length) {
            continue;
          }

          const segments = [];
          for (let index = 0; index < routePoints.length - 1; index += 1) {
            const origin = routePoints[index];
            const destination = routePoints[index + 1];
            segments.push({
              id: `${trackIndex}-${index}`,
              trackIndex,
              fromKey: origin.key,
              toKey: destination.key,
              fromName: origin.name,
              toName: destination.name,
              dayLabel: destination.dayLabel,
              dateLabel: destination.dateLabel,
              color: DAY_COLORS[destination.dayIndex] || DAY_COLORS[0],
              metric: getMetric(origin, destination)
            });
          }

          const trackLabel = visibleDays[0].day.tracks[trackIndex].label;
          const routeTotal = dayDetails.reduce((sum, detail) => sum + Number(detail.total || 0), 0);
          const noteCount = dayDetails.reduce((sum, detail) => sum + (detail.notes ? detail.notes.length : 0), 0);
          const routeSummary = routePoints.length
            ? routePoints.map((point) => point.name).join(" -> ")
            : (dayDetails.map((detail) => detail.summary).filter(Boolean).join(" · ") || trackLabel);
          routes.push({
            id: `${direction.id}-track-${trackIndex}`,
            trackIndex,
            color: TRACK_COLORS[trackIndex] || TRACK_COLORS[0],
            label: trackLabel,
            title: visibleDays.length > 1
              ? `${trackLabel} · Tuyến xuyên ${visibleDays.length} ngày`
              : (dayDetails[0]?.title || trackLabel),
            dateLabel: visibleDays.length > 1
              ? `${visibleDays[0].day.dateLabel} -> ${visibleDays[visibleDays.length - 1].day.dateLabel}`
              : (dayDetails[0]?.dateLabel || visibleDays[0]?.day.dateLabel || ""),
            summary: routeSummary,
            total: routeTotal,
            meta: dayDetails.map((detail) => `${detail.dayLabel}: ${formatNumber(detail.total)} TNLS`).join(" · "),
            noteCount,
            allPoints: points,
            points: routePoints,
            segments,
            dayDetails
          });
        }
        return routes;
      }

      function resolveActiveRoute(routes) {
        return routes.find((route) => route.id === state.activeRouteId) || routes[0] || null;
      }

      function getPreferredRouteNodeKey(route) {
        if (!route || !route.points.length) {
          return null;
        }
        const preferredPoint = route.points.find((point) => Number(point.total || 0) > 0) || route.points[0];
        return preferredPoint ? preferredPoint.key : null;
      }

      function normalizePlaceName(value) {
        return String(value || "")
          .replace(/^(phường|xã|thị trấn|thị xã|thành phố|tp\.?)\s+/i, "")
          .trim();
      }

      function buildGlobalPointLookup() {
        const lookup = new Map();
        data.directions.forEach((direction) => {
          direction.days.forEach((day) => {
            day.tracks.forEach((track) => {
              const items = direction.id === "co-dinh" ? track.stops : track.visits;
              items.forEach((item) => {
                if (!item || !item.name) {
                  return;
                }
                const normalizedName = normalizePlaceName(item.name);
                const entry = {
                  name: normalizedName,
                  lat: Number(item.lat),
                  lng: Number(item.lng)
                };
                if (!lookup.has(normalizedName)) {
                  lookup.set(normalizedName, entry);
                }
                if (!lookup.has(item.name)) {
                  lookup.set(item.name, entry);
                }
              });
            });
          });
        });
        return lookup;
      }

      function buildFixedCatchmentNodes(routes) {
        const map = new Map();
        const pointLookup = buildGlobalPointLookup();

        routes.forEach((route) => {
          const detail = route.dayDetails[0];
          const hubs = new Map();
          (detail?.points || []).forEach((point) => {
            if (!hubs.has(point.key)) {
              hubs.set(point.key, {
                ...point,
                total: 0,
                sessions: [],
                areaNodes: new Map()
              });
            }
            const hub = hubs.get(point.key);
            hub.total += Number(point.total || 0);
            hub.sessions.push(point);

            (point.areas || []).forEach((area) => {
              const rawAreaName = String(area.name || "").trim();
              const areaName = normalizePlaceName(rawAreaName);
              const metric = getCatchmentMetric(areaName, point.name);
              if (!areaName || areaName.toLowerCase() === normalizePlaceName(point.name).toLowerCase()) {
                return;
              }
              const areaKey = `area|${route.id}|${point.key}|${areaName.toLowerCase()}`;
              if (!hub.areaNodes.has(areaKey)) {
                const lookup = pointLookup.get(areaName) || pointLookup.get(rawAreaName) || null;
                hub.areaNodes.set(areaKey, {
                  key: areaKey,
                  name: areaName,
                  total: 0,
                  lat: metric && Number.isFinite(Number(metric.area_lat)) ? Number(metric.area_lat) : (lookup ? lookup.lat : point.lat),
                  lng: metric && Number.isFinite(Number(metric.area_lng)) ? Number(metric.area_lng) : (lookup ? lookup.lng : point.lng),
                  kind: "area",
                  sourceHubKey: point.key,
                  metric,
                  occurrences: []
                });
              }
              const areaNode = hub.areaNodes.get(areaKey);
              areaNode.total += Number(area.count || 0);
              areaNode.occurrences.push({
                routeId: route.id,
                routeLabel: route.label,
                trackIndex: route.trackIndex,
                dayIndex: point.dayIndex,
                dayLabel: point.dayLabel,
                dateLabel: point.dateLabel,
                isoDate: point.isoDate,
                total: Number(area.count || 0),
                session: point.session,
                color: route.color,
                hubName: point.name,
                hubVenue: detail?.venue || "",
                scheduleText: detail?.scheduleText || "",
                plannedText: detail?.plannedText || "",
                noteText: detail?.staffSite || "",
                metric,
                kind: "area"
              });
            });
          });

          hubs.forEach((hub) => {
            if (!map.has(hub.key)) {
              map.set(hub.key, {
                key: hub.key,
                name: hub.name,
                lat: hub.lat,
                lng: hub.lng,
                total: 0,
                kind: "hub",
                occurrences: []
              });
            }
            const hubNode = map.get(hub.key);
            hubNode.total += hub.total;
            hub.sessions.forEach((point) => {
              hubNode.occurrences.push({
                routeId: route.id,
                routeLabel: route.label,
                trackIndex: route.trackIndex,
                dayIndex: point.dayIndex,
                dayLabel: point.dayLabel,
                dateLabel: point.dateLabel,
                isoDate: point.isoDate,
                total: Number(point.total || 0),
                session: point.session,
                color: route.color,
                areas: point.areas || [],
                lat: point.lat,
                lng: point.lng,
                venue: detail?.venue || "",
                plannedText: detail?.plannedText || "",
                scheduleText: detail?.scheduleText || "",
                noteText: detail?.staffSite || "",
                // Extra fields for lưu động panel
                directionId: detail?.directionId || "",
                trackTitle: detail?.title || detail?.titleShort || "",
                staffCore: detail?.staffCore || "",
                equipmentTeam: detail?.equipmentTeam || "",
                equipmentProvince: detail?.equipmentProvince || "",
                kind: "hub"
              });
            });
            hub.areaNodes.forEach((areaNode) => {
              map.set(areaNode.key, areaNode);
            });
          });
        });

        return map;
      }

      function buildVisibleNodes(routes, direction) {
        if (direction.id === "co-dinh" && state.dayIndex !== null) {
          return buildFixedCatchmentNodes(routes);
        }
        const map = new Map();
        routes.forEach((route) => {
          // Build a lookup: dayIndex -> dayDetail (contains venue, scheduleText, staffCore etc.)
          const detailByDay = new Map();
          (route.dayDetails || []).forEach((detail) => {
            detailByDay.set(detail.dayIndex, detail);
          });

          const sourcePoints = route.allPoints || route.points;
          sourcePoints.forEach((point) => {
            if (!map.has(point.key)) {
              map.set(point.key, {
                key: point.key,
                name: point.name,
                lat: point.lat,
                lng: point.lng,
                total: 0,
                kind: "hub",
                occurrences: []
              });
            }
            const node = map.get(point.key);
            node.total += Number(point.total || 0);

            // Fetch detail for this day to get track-level info
            const detail = detailByDay.get(point.dayIndex) || {};

            node.occurrences.push({
              routeId: route.id,
              routeLabel: route.label,
              trackIndex: route.trackIndex,
              dayIndex: point.dayIndex,
              dayLabel: point.dayLabel,
              dateLabel: point.dateLabel,
              isoDate: point.isoDate,
              total: Number(point.total || 0),
              session: point.session,
              color: route.color,
              areas: point.areas || [],
              lat: point.lat,
              lng: point.lng,
              // Track-level fields for lưu động panel
              venue: detail.venue || "",
              scheduleText: detail.scheduleText || "",
              noteText: detail.staffSite || "",
              staffCore: detail.staffCore || "",
              plannedText: detail.plannedText || "",
              equipmentTeam: detail.equipmentTeam || "",
              equipmentProvince: detail.equipmentProvince || "",
              trackTitle: detail.titleShort || detail.title || route.label || ""
            });
          });
        });
        return map;
      }


      function projectNodes(nodes, options = {}) {
        const {
          avoidCollisions = true,
          paddingX = 120,
          paddingY = 78
        } = options;
        const list = Array.from(nodes.values());
        const latitudes = list.map((node) => Number(node.lat));
        const longitudes = list.map((node) => Number(node.lng));
        const minLat = Math.min(...latitudes);
        const maxLat = Math.max(...latitudes);
        const minLng = Math.min(...longitudes);
        const maxLng = Math.max(...longitudes);
        const latRange = Math.max(0.01, maxLat - minLat);
        const lngRange = Math.max(0.01, maxLng - minLng);
        const projected = list.map((node) => ({
          ...node,
          x: paddingX + ((Number(node.lng) - minLng) / lngRange) * (STAGE_WIDTH - paddingX * 2),
          y: paddingY + ((maxLat - Number(node.lat)) / latRange) * (STAGE_HEIGHT - paddingY * 2)
        }));

        if (avoidCollisions) {
          for (let outer = 0; outer < projected.length; outer += 1) {
            for (let inner = 0; inner < outer; inner += 1) {
              const left = projected[inner];
              const right = projected[outer];
              const deltaX = right.x - left.x;
              const deltaY = right.y - left.y;
              const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
              if (distance < 68) {
                const angle = Math.atan2(deltaY || 1, deltaX || 1);
                const push = (68 - distance) / 2;
                right.x += Math.cos(angle) * push;
                right.y += Math.sin(angle) * push;
                left.x -= Math.cos(angle) * push * 0.22;
                left.y -= Math.sin(angle) * push * 0.22;
              }
            }
          }
        }

        return new Map(projected.map((node) => [node.key, {
          ...node,
          x: Math.min(STAGE_WIDTH - 80, Math.max(80, node.x)),
          y: Math.min(STAGE_HEIGHT - 80, Math.max(80, node.y))
        }]));
      }

      function buildSchematicRoutePositions(route, routeNodes) {
        const uniqueNodes = [];
        const seen = new Set();
        route.points.forEach((point) => {
          if (seen.has(point.key) || !routeNodes.has(point.key)) {
            return;
          }
          seen.add(point.key);
          uniqueNodes.push(routeNodes.get(point.key));
        });

        if (!uniqueNodes.length) {
          return new Map();
        }

        const positions = new Map();
        const total = uniqueNodes.length;
        const cols = total <= 4 ? total : total <= 8 ? 4 : total <= 12 ? 4 : 5;
        const rows = Math.max(1, Math.ceil(total / cols));
        const startX = 150;
        const endX = STAGE_WIDTH - 170;
        const usableWidth = Math.max(260, endX - startX);
        const colGap = cols === 1 ? 0 : usableWidth / (cols - 1);
        const rowGap = rows === 1 ? 0 : Math.min(205, Math.max(140, (STAGE_HEIGHT - 300) / Math.max(1, rows - 1)));
        const startY = rows === 1 ? STAGE_HEIGHT / 2 : 190;

        uniqueNodes.forEach((node, index) => {
          const row = Math.floor(index / cols);
          const col = index % cols;
          const visualCol = row % 2 === 0 ? col : cols - 1 - col;
          const wave = ((visualCol % 2 === 0) ? -1 : 1) * 18;
          positions.set(node.key, {
            ...node,
            x: startX + visualCol * colGap,
            y: startY + row * rowGap + wave
          });
        });

        return positions;
      }

      function buildMultiRouteTimelinePositions(routes, routeNodes) {
        const positions = new Map();
        const rowCount = Math.max(1, routes.length);
        const yGap = rowCount === 1 ? 0 : Math.min(250, Math.max(170, (STAGE_HEIGHT - 260) / (rowCount - 1)));
        const startY = rowCount === 1 ? STAGE_HEIGHT / 2 : 190;

        routes.forEach((route, routeIndex) => {
          const orderedNodes = [];
          const seen = new Set();
          route.points.forEach((point) => {
            if (seen.has(point.key) || !routeNodes.has(point.key)) {
              return;
            }
            seen.add(point.key);
            orderedNodes.push(routeNodes.get(point.key));
          });
          if (!orderedNodes.length) {
            return;
          }
          const startX = 150;
          const endX = STAGE_WIDTH - 180;
          const gap = orderedNodes.length === 1 ? 0 : (endX - startX) / (orderedNodes.length - 1);
          orderedNodes.forEach((node, nodeIndex) => {
            positions.set(node.key, {
              ...node,
              x: startX + nodeIndex * gap,
              y: startY + routeIndex * yGap + ((nodeIndex % 2 === 0) ? -16 : 16)
            });
          });
        });
        return positions;
      }

      function buildFixedDayRoutePositions(routes, routeNodes) {
        const positions = new Map();
        const rowCount = Math.max(1, routes.length);
        const laneYs = rowCount === 1
          ? [STAGE_HEIGHT / 2]
          : rowCount === 2
            ? [330, 610]
            : [235, 470, 705];
        const centerX = STAGE_WIDTH / 2;
        const singlePointOffsets = rowCount === 1
          ? [0]
          : rowCount === 2
            ? [-120, 120]
            : [-170, 0, 170];

        routes.forEach((route, routeIndex) => {
          const orderedNodes = [];
          const seen = new Set();
          route.points.forEach((point) => {
            if (seen.has(point.key) || !routeNodes.has(point.key)) {
              return;
            }
            seen.add(point.key);
            orderedNodes.push(routeNodes.get(point.key));
          });
          if (!orderedNodes.length) {
            return;
          }

          const anchorX = centerX + (singlePointOffsets[routeIndex] || 0);
          const y = laneYs[routeIndex] || laneYs[laneYs.length - 1] || (240 + routeIndex * 220);
          if (orderedNodes.length === 1) {
            positions.set(orderedNodes[0].key, {
              ...orderedNodes[0],
              x: anchorX,
              y
            });
            return;
          }

          const usableWidth = orderedNodes.length === 2
            ? 320
            : Math.min(620, Math.max(360, 220 + orderedNodes.length * 140));
          const startX = Math.max(180, anchorX - usableWidth / 2);
          const endX = Math.min(STAGE_WIDTH - 180, anchorX + usableWidth / 2);
          const gap = orderedNodes.length === 1 ? 0 : (endX - startX) / (orderedNodes.length - 1);

          orderedNodes.forEach((node, nodeIndex) => {
            positions.set(node.key, {
              ...node,
              x: startX + nodeIndex * gap,
              y: y + ((nodeIndex % 2 === 0) ? -12 : 12)
            });
          });
        });

        return positions;
      }



      function buildFixedCatchmentPositions(routes, routeNodes) {
        const positions = new Map();

        // Resolve which hub is currently active
        let activeHubKey = null;
        const activeRoute = resolveActiveRoute(routes);
        const preferredNodeKey = getPreferredRouteNodeKey(activeRoute);
        let activeKey = state.activeNodeKey || preferredNodeKey;
        if (activeKey) {
          const activeNode = routeNodes.get(activeKey);
          if (activeNode) {
            activeHubKey = activeNode.kind === "hub" ? activeNode.key : activeNode.sourceHubKey;
          }
        }

        if (!activeHubKey) return positions;

        const activeHubNode = routeNodes.get(activeHubKey);
        if (!activeHubNode) return positions;

        // Active hub: placed at left-center (anchor point for connecting lines to satellites)
        const HUB_X = STAGE_WIDTH * 0.32;
        const HUB_Y = STAGE_HEIGHT * 0.5;
        positions.set(activeHubKey, { ...activeHubNode, x: HUB_X, y: HUB_Y });

        // Satellites of the active hub: fan out to the right
        const areaNodes = Array.from(routeNodes.values())
          .filter((node) => node.kind === "area" && node.sourceHubKey === activeHubKey)
          .sort((a, b) => Number(b.total || 0) - Number(a.total || 0));

        const count = areaNodes.length;
        const verticalGap = 88;

        if (count > 7) {
          // Two columns: one left, one right of hub center
          // Hub shifts right so left column clears the sidebar panel (~238px)
          const HUB_X_WIDE = STAGE_WIDTH * 0.46;  // ~644px
          const HUB_Y_WIDE = STAGE_HEIGHT * 0.5;
          // Update hub position for this wide layout
          positions.set(activeHubKey, { ...activeHubNode, x: HUB_X_WIDE, y: HUB_Y_WIDE });

          const col1 = [], col2 = [];
          areaNodes.forEach((node, idx) => (idx % 2 === 0 ? col1 : col2).push(node));
          const placeCol = (nodes, colX, anchorY) => {
            const h = (nodes.length - 1) * verticalGap;
            const sy = anchorY - h / 2;
            nodes.forEach((node, idx) => {
              positions.set(node.key, { ...node, x: colX, y: sy + idx * verticalGap });
            });
          };
          // Left column: at least 260px from left (sidebar ends ~238px), so 260px is safe
          placeCol(col1, HUB_X_WIDE - 260, HUB_Y_WIDE);
          placeCol(col2, HUB_X_WIDE + 260, HUB_Y_WIDE);
        } else {
          // Single column to the right
          const h = (count - 1) * verticalGap;
          const sy = HUB_Y - h / 2;
          areaNodes.forEach((node, index) => {
            positions.set(node.key, { ...node, x: HUB_X + 300, y: sy + index * verticalGap });
          });
        }

        return positions;
      }

      function renderHubSidebar(routes, routeNodes, activeHubKey, direction, fixedCatchmentMode) {
        const sidebarEl = document.getElementById("hub-sidebar");
        if (!sidebarEl) return;

        // Only show sidebar when in fixed catchment mode AND a specific day is selected (not Tất cả)
        const show = !!fixedCatchmentMode;
        sidebarEl.classList.toggle("is-visible", show);
        if (!show) { sidebarEl.innerHTML = ""; return; }

        // Collect all unique hubs across all routes
        const allHubs = [];
        const seen = new Set();
        routes.forEach((route) => {
          route.points.forEach((point) => {
            if (seen.has(point.key) || !routeNodes.has(point.key)) return;
            const hubNode = routeNodes.get(point.key);
            if (hubNode && hubNode.kind === "hub") {
              seen.add(point.key);
              allHubs.push(hubNode);
            }
          });
        });

        const activeHubNode = routeNodes.get(activeHubKey);
        const activeName = activeHubNode ? activeHubNode.name : "";

        sidebarEl.innerHTML = `
