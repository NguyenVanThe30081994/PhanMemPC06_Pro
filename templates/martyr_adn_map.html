<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page_title or 'Bản đồ ADN liệt sĩ - PhanMemPC06_Pro' }}</title>
  <style>
    :root {
      color-scheme: light;
      --bg-cream: #f4efe4;
      --bg-warm: #faf8f2;
      --surface: rgba(255, 255, 255, 0.9);
      --surface-strong: rgba(255, 255, 255, 0.97);
      --ink-900: #1f2937;
      --ink-700: #475569;
      --ink-500: #64748b;
      --line-soft: rgba(148, 163, 184, 0.2);
      --shadow-soft: 0 24px 70px rgba(63, 46, 18, 0.12);
      --shadow-card: 0 16px 40px rgba(15, 23, 42, 0.12);
      --track-1: #c4661f;
      --track-2: #325fd8;
      --track-3: #167b73;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
      color: var(--ink-900);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.62), rgba(244, 239, 228, 0.95)),
        radial-gradient(circle at top left, rgba(113, 148, 122, 0.18), transparent 35%),
        radial-gradient(circle at top right, rgba(196, 102, 31, 0.11), transparent 28%),
        var(--bg-cream);
      position: relative;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(122, 106, 70, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(122, 106, 70, 0.08) 1px, transparent 1px);
      background-size: 76px 76px;
      opacity: 0.4;
    }

    .pc06-home-link {
      position: fixed;
      top: 22px;
      right: 22px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 16px;
      border-radius: 999px;
      color: #fff;
      background: rgba(15, 23, 42, 0.9);
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.02em;
      box-shadow: var(--shadow-card);
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .pc06-home-link:hover,
    .pc06-home-link:focus-visible {
      background: rgba(15, 23, 42, 0.98);
      transform: translateY(-1px);
    }

    .page-shell {
      position: relative;
      z-index: 1;
      width: min(1680px, calc(100% - 40px));
      margin: 28px auto 32px;
      padding-top: 24px;
    }

    .hero-card,
    .control-card,
    .board-card,
    .summary-card {
      background: var(--surface);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.76);
      border-radius: 30px;
      box-shadow: var(--shadow-soft);
    }

    .hero-card {
      padding: 26px 28px;
      margin-bottom: 18px;
    }

    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(154, 95, 29, 0.12);
      color: #9a5f1d;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(28px, 4.8vw, 46px);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }

    .control-card {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
    }

    .segmented-button {
      border: 0;
      min-width: 174px;
      padding: 12px 14px;
      border-radius: 18px;
      font: inherit;
      cursor: pointer;
      background: transparent;
      color: var(--ink-700);
      text-align: left;
      transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .segmented-button strong,
    .segmented-button span {
      display: block;
    }

    .segmented-button strong {
      font-size: 14px;
    }

    .segmented-button span {
      margin-top: 3px;
      color: var(--ink-500);
      font-size: 12px;
      line-height: 1.4;
    }

    .segmented-button.is-active {
      background: rgba(255, 255, 255, 0.98);
      color: var(--ink-900);
      box-shadow: inset 0 0 0 1px rgba(196, 102, 31, 0.2), 0 12px 26px rgba(148, 95, 43, 0.1);
      transform: translateY(-1px);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.85fr) minmax(320px, 0.85fr);
      gap: 18px;
      align-items: start;
    }

    .board-card {
      padding: 18px;
      position: sticky;
      top: 22px;
    }

    .summary-card {
      padding: 20px;
      position: sticky;
      top: 22px;
      max-height: calc(100vh - 54px);
      overflow: auto;
    }

    .route-board {
      position: relative;
      min-height: 760px;
      border-radius: 28px;
      overflow: hidden;
      padding: 20px;
      background:
        radial-gradient(circle at 18% 20%, rgba(28, 120, 97, 0.08), transparent 18%),
        radial-gradient(circle at 75% 16%, rgba(99, 102, 241, 0.09), transparent 16%),
        radial-gradient(circle at 82% 70%, rgba(196, 102, 31, 0.08), transparent 22%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(251, 249, 244, 0.96));
      border: 1px solid rgba(226, 232, 240, 0.85);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6);
      isolation: isolate;
    }

    .route-board::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(148, 163, 184, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
      background-size: 90px 90px;
      opacity: 0.82;
    }

    .route-grid {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 16px;
      align-items: start;
    }

    .track-card {
      position: relative;
      padding: 18px 18px 18px 54px;
      border-radius: 24px;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(226, 232, 240, 0.88);
      box-shadow: 0 14px 32px rgba(15, 23, 42, 0.08);
    }

    .track-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 14px;
    }

    .track-title strong,
    .track-title span {
      display: block;
    }

    .track-title strong {
      font-size: 17px;
      line-height: 1.2;
    }

    .track-title span {
      margin-top: 3px;
      color: var(--ink-700);
      font-size: 13px;
      line-height: 1.45;
    }

    .track-total {
      flex: 0 0 auto;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(248, 250, 252, 0.96);
      border: 1px solid rgba(226, 232, 240, 0.9);
      color: var(--ink-900);
      font-size: 12px;
      font-weight: 800;
    }

    .route-chain {
      position: relative;
      display: grid;
      gap: 10px;
    }

    .route-chain::before {
      content: "";
      position: absolute;
      left: -28px;
      top: 14px;
      bottom: 14px;
      width: 4px;
      border-radius: 999px;
      background: linear-gradient(180deg, var(--track-color), rgba(148, 163, 184, 0.28));
      opacity: 0.95;
    }

    .route-node {
      position: relative;
      width: 100%;
      border: 0;
      padding: 13px 14px;
      border-radius: 18px;
      background: rgba(248, 250, 252, 0.92);
      border: 1px solid rgba(226, 232, 240, 0.92);
      text-align: left;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .route-node::before {
      content: "";
      position: absolute;
      left: -35px;
      top: 19px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--track-color);
      border: 3px solid rgba(255, 255, 255, 0.96);
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.64);
    }

    .route-node::after {
      content: "";
      position: absolute;
      left: -19px;
      top: 18px;
      width: 19px;
      height: 14px;
      border-left: 4px solid var(--track-color);
      border-bottom: 4px solid var(--track-color);
      border-bottom-left-radius: 14px;
      opacity: 0.92;
    }

    .route-node:hover,
    .route-node:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.1);
      outline: none;
    }

    .route-node.is-active {
      background: rgba(255, 255, 255, 0.98);
      border-color: rgba(148, 163, 184, 0.44);
      box-shadow: inset 0 0 0 2px var(--track-color), 0 18px 34px rgba(15, 23, 42, 0.12);
    }

    .route-node.is-active::before {
      box-shadow: 0 0 0 4px rgba(255, 255, 255, 0.72), 0 0 0 10px rgba(196, 102, 31, 0.14);
    }

    .route-node strong,
    .route-node span,
    .route-node small {
      display: block;
    }

    .route-node strong {
      font-size: 15px;
      line-height: 1.25;
    }

    .route-node span {
      margin-top: 4px;
      color: var(--ink-700);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.45;
    }

    .route-node small {
      margin-top: 5px;
      color: var(--ink-500);
      font-size: 12px;
      line-height: 1.5;
    }

    .route-date {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 8px;
      padding: 4px 8px;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.06);
      color: var(--ink-700);
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .weather-chip {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      margin-top: 8px;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.08);
      color: #1d4ed8;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
    }

    .weather-chip.is-pending {
      color: var(--ink-500);
      background: rgba(148, 163, 184, 0.12);
    }

    .weather-chip.is-unavailable {
      color: #92400e;
      background: rgba(245, 158, 11, 0.14);
    }

    .route-leg {
      position: relative;
      margin: -2px 0 2px;
      padding-left: 18px;
    }

    .route-leg::before {
      content: "";
      position: absolute;
      left: -28px;
      top: -4px;
      width: 4px;
      height: calc(100% + 8px);
      border-radius: 999px;
      background: linear-gradient(180deg, rgba(148, 163, 184, 0.18), rgba(148, 163, 184, 0.05));
    }

    .route-leg-card {
      position: relative;
      padding: 10px 12px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.82);
      border: 1px dashed rgba(148, 163, 184, 0.35);
      color: var(--ink-700);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.45;
    }

    .route-leg-card strong,
    .route-leg-card span {
      display: block;
    }

    .route-leg-card strong {
      color: var(--ink-900);
      font-size: 12px;
    }

    .summary-head {
      margin-bottom: 16px;
    }

    .summary-head h2 {
      margin: 0;
      font-size: 30px;
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .summary-head p {
      margin: 10px 0 0;
      color: var(--ink-700);
      font-size: 13px;
      line-height: 1.6;
    }

    .summary-strip {
      display: grid;
      gap: 10px;
      margin-bottom: 16px;
    }

    .summary-strip-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(248, 250, 252, 0.92);
      border: 1px solid rgba(226, 232, 240, 0.85);
    }

    .summary-strip-item strong,
    .summary-strip-item span {
      display: block;
    }

    .summary-strip-item strong {
      font-size: 14px;
      line-height: 1.2;
    }

    .summary-strip-item span {
      margin-top: 4px;
      color: var(--ink-500);
      font-size: 12px;
      font-weight: 700;
    }

    .summary-strip-total {
      flex: 0 0 auto;
      color: var(--ink-900);
      font-size: 15px;
      font-weight: 900;
      letter-spacing: -0.02em;
    }

    .focus-card,
    .segment-card {
      margin-bottom: 16px;
      padding: 16px;
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(250, 246, 239, 0.92));
      border: 1px solid rgba(226, 232, 240, 0.92);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.72);
    }

    .focus-card strong,
    .focus-card span,
    .focus-card small,
    .segment-card strong,
    .segment-card span,
    .segment-card small {
      display: block;
    }

    .focus-card strong,
    .segment-card strong {
      font-size: 19px;
      line-height: 1.2;
    }

    .focus-card span,
    .segment-card span {
      margin-top: 5px;
      color: var(--ink-700);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.55;
    }

    .focus-card small,
    .segment-card small {
      margin-top: 8px;
      color: var(--ink-500);
      font-size: 12px;
      line-height: 1.55;
    }

    .focus-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .focus-list-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 11px;
      border-radius: 14px;
      background: rgba(248, 250, 252, 0.92);
      border: 1px solid rgba(226, 232, 240, 0.82);
    }

    .focus-list-item span {
      margin: 0;
      color: var(--ink-700);
      font-size: 12px;
      font-weight: 700;
    }

    .focus-list-item strong {
      margin: 0;
      font-size: 13px;
    }

    .maps-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 999px;
      text-decoration: none;
      background: rgba(15, 23, 42, 0.92);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.02em;
      transition: transform 0.16s ease, background 0.16s ease;
    }

    .maps-link:hover,
    .maps-link:focus-visible {
      background: rgba(15, 23, 42, 1);
      transform: translateY(-1px);
    }

    @media (max-width: 1280px) {
      .route-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 1180px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .board-card,
      .summary-card {
        position: static;
      }
    }

    @media (max-width: 768px) {
      .pc06-home-link {
        top: 12px;
        right: 12px;
        padding: 10px 13px;
      }

      .page-shell {
        width: min(100% - 20px, 100%);
        margin: 16px auto 20px;
        padding-top: 42px;
      }

      .hero-card,
      .board-card,
      .summary-card,
      .control-card {
        border-radius: 24px;
      }

      .hero-card,
      .summary-card {
        padding: 18px;
      }

      .route-board {
        min-height: auto;
      }

      .route-grid {
        grid-template-columns: 1fr;
      }

      .summary-head h2 {
        font-size: 24px;
      }
    }
  </style>
</head>
<body>
  <a class="pc06-home-link" href="{{ pc06_home_url or '/dashboard' }}">
    {{ pc06_home_label or 'Đăng nhập PC06' }}
  </a>

  <main class="page-shell">
    <section class="hero-card">
      <div class="hero-kicker">{{ pc06_shell_label or 'PhanMemPC06_Pro' }}</div>
      <h1>15 điểm tập kết ADN và tuyến thu nhận 5 ngày</h1>
    </section>

    <section class="toolbar">
      <div class="control-card" id="direction-tabs"></div>
    </section>

    <section class="workspace">
      <div class="board-card">
        <div class="route-board" id="route-board"></div>
      </div>
      <aside class="summary-card" id="summary-panel"></aside>
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/martyr-adn-schedule-data.js') }}"></script>
  <script src="{{ url_for('static', filename='js/martyr-adn-route-metrics.js') }}"></script>
  <script>
    (() => {
      const data = window.ADN_SCHEDULE_DATA;
      const routeMetrics = window.ADN_ROUTE_METRICS || {};
      const TRACK_COLORS = ["#c4661f", "#325fd8", "#167b73"];
      const directionTabsEl = document.getElementById("direction-tabs");
      const boardEl = document.getElementById("route-board");
      const summaryPanelEl = document.getElementById("summary-panel");

      const state = {
        directionId: data.directions[0].id,
        activeNodeId: null
      };

      const forecastCache = new Map();
      const weatherByNodeId = new Map();

      function formatNumber(value) {
        return new Intl.NumberFormat("vi-VN").format(Number(value || 0));
      }

      function toIsoDate(dateLabel) {
        const parts = String(dateLabel || "").split("/");
        if (parts.length !== 3) {
          return "";
        }
        const [day, month, year] = parts;
        return `${year}-${String(Number(month)).padStart(2, "0")}-${String(Number(day)).padStart(2, "0")}`;
      }

      function buildCoordKey(lat, lng) {
        return `${Number(lat).toFixed(6)}|${Number(lng).toFixed(6)}`;
      }

      function buildRouteKey(origin, destination) {
        return `${Number(origin.lat).toFixed(6)}|${Number(origin.lng).toFixed(6)}|${Number(destination.lat).toFixed(6)}|${Number(destination.lng).toFixed(6)}`;
      }

      function describeWeatherCode(code) {
        if (code === 0) {
          return "Trời quang";
        }
        if (code >= 1 && code <= 3) {
          return "Nhiều mây";
        }
        if (code >= 45 && code <= 48) {
          return "Sương mù";
        }
        if (code >= 51 && code <= 67) {
          return "Có mưa";
        }
        if (code >= 71 && code <= 77) {
          return "Mưa tuyết";
        }
        if (code >= 80 && code <= 86) {
          return "Mưa rào";
        }
        if (code >= 95) {
          return "Có dông";
        }
        return "Thời tiết thay đổi";
      }

      function buildGoogleMapsUrl(origin, destination) {
        if (!origin || !destination) {
          return "";
        }
        const originText = `${origin.lat},${origin.lng}`;
        const destinationText = `${destination.lat},${destination.lng}`;
        return `https://www.google.com/maps/dir/?api=1&origin=${encodeURIComponent(originText)}&destination=${encodeURIComponent(destinationText)}&travelmode=driving`;
      }

      function estimateMetric(origin, destination) {
        if (origin.lat === destination.lat && origin.lng === destination.lng) {
          return {
            distance_km: 0,
            travel_minutes: 0,
            source: "same-site"
          };
        }
        const toRadians = (value) => value * Math.PI / 180;
        const earthRadiusKm = 6371;
        const latDelta = toRadians(destination.lat - origin.lat);
        const lngDelta = toRadians(destination.lng - origin.lng);
        const startLat = toRadians(origin.lat);
        const endLat = toRadians(destination.lat);
        const haversineValue = (
          Math.sin(latDelta / 2) ** 2
          + Math.cos(startLat) * Math.cos(endLat) * Math.sin(lngDelta / 2) ** 2
        );
        const crowDistance = 2 * earthRadiusKm * Math.atan2(
          Math.sqrt(haversineValue),
          Math.sqrt(Math.max(0, 1 - haversineValue))
        );
        const distanceKm = crowDistance * 1.85;
        const travelMinutes = distanceKm / 55 * 60;
        return {
          distance_km: Number(distanceKm.toFixed(1)),
          travel_minutes: Math.max(1, Math.round(travelMinutes)),
          source: "estimated"
        };
      }

      function getSegmentMetric(origin, destination) {
        return routeMetrics[buildRouteKey(origin, destination)] || estimateMetric(origin, destination);
      }

      function getSelectedDirection() {
        return data.directions.find((direction) => direction.id === state.directionId) || data.directions[0];
      }

      function buildFixedTrackNodes(direction, trackIndex) {
        return direction.days.map((day, dayIndex) => {
          const track = day.tracks[trackIndex];
          const firstStop = track.stops[0];
          const total = track.stops.reduce((sum, stop) => sum + Number(stop.total || 0), 0);
          const sessionSummary = track.stops.map((stop) => `${stop.session}: ${formatNumber(stop.total)} TNLS`).join(" · ");
          const areaSummary = track.stops.flatMap((stop) => (
            (stop.areas || []).map((area) => ({
              label: `${stop.session} · ${area.name}`,
              value: `${formatNumber(area.count)} TNLS`
            }))
          ));
          return {
            id: `${direction.id}-${trackIndex}-${dayIndex}`,
            trackIndex,
            dayIndex,
            trackLabel: track.label,
            trackTitle: track.title,
            dayLabel: day.dayLabel,
            dateLabel: day.dateLabel,
            isoDate: toIsoDate(day.dateLabel),
            name: firstStop.name,
            lat: firstStop.lat,
            lng: firstStop.lng,
            total,
            meta: sessionSummary,
            detailItems: areaSummary
          };
        });
      }

      function buildMobileTrackNodes(direction, trackIndex) {
        const nodes = [];
        direction.days.forEach((day, dayIndex) => {
          const track = day.tracks[trackIndex];
          track.visits.forEach((visit, visitIndex) => {
            if (!visit.name) {
              return;
            }
            nodes.push({
              id: `${direction.id}-${trackIndex}-${dayIndex}-${visitIndex}`,
              trackIndex,
              dayIndex,
              trackLabel: track.label,
              trackTitle: track.title,
              dayLabel: day.dayLabel,
              dateLabel: day.dateLabel,
              isoDate: toIsoDate(day.dateLabel),
              name: visit.name,
              lat: visit.lat,
              lng: visit.lng,
              total: Number(visit.count || 0),
              meta: visit.session || "Cả ngày",
              detailItems: []
            });
          });
        });
        return nodes;
      }

      function buildDirectionTracks(direction) {
        return direction.days[0].tracks.map((track, trackIndex) => {
          const nodes = direction.id === "co-dinh"
            ? buildFixedTrackNodes(direction, trackIndex)
            : buildMobileTrackNodes(direction, trackIndex);
          return {
            trackIndex,
            label: track.label,
            title: direction.id === "co-dinh" ? direction.days[0].tracks[trackIndex].title : track.title,
            total: nodes.reduce((sum, node) => sum + Number(node.total || 0), 0),
            nodes
          };
        });
      }

      function getActiveNode(tracks) {
        const allNodes = tracks.flatMap((track) => track.nodes);
        return allNodes.find((node) => node.id === state.activeNodeId) || allNodes[0] || null;
      }

      function renderDirectionTabs(direction) {
        directionTabsEl.innerHTML = "";
        data.directions.forEach((item) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "segmented-button" + (item.id === direction.id ? " is-active" : "");
          button.innerHTML = `<strong>${item.label}</strong><span>${item.shortLabel || ""}</span>`;
          button.addEventListener("click", () => {
            if (state.directionId === item.id) {
              return;
            }
            state.directionId = item.id;
            state.activeNodeId = null;
            render();
          });
          directionTabsEl.appendChild(button);
        });
      }

      function renderSegment(origin, destination) {
        const metric = getSegmentMetric(origin, destination);
        if (metric.source === "same-site") {
          return `
            <div class="route-leg">
              <div class="route-leg-card">
                <strong>Giữ trạm tại ${destination.name}</strong>
                <span>Không phát sinh quãng di chuyển giữa hai ngày liên tiếp.</span>
              </div>
            </div>
          `;
        }
        return `
          <div class="route-leg">
            <div class="route-leg-card">
              <strong>${formatNumber(metric.distance_km)} km · ${formatNumber(metric.travel_minutes)} phút</strong>
              <span>${origin.name} → ${destination.name}</span>
            </div>
          </div>
        `;
      }

      function renderBoard(direction, tracks) {
        const activeNode = getActiveNode(tracks);
        boardEl.innerHTML = `
          <div class="route-grid">
            ${tracks.map((track) => `
              <article class="track-card" style="--track-color:${TRACK_COLORS[track.trackIndex] || TRACK_COLORS[0]}">
                <div class="track-header">
                  <div class="track-title">
                    <strong>${track.label}</strong>
                    <span>${track.title}</span>
                  </div>
                  <div class="track-total">${formatNumber(track.total)} TNLS</div>
                </div>
                <div class="route-chain">
                  ${track.nodes.map((node, index) => `
                    <button type="button" class="route-node${activeNode && activeNode.id === node.id ? " is-active" : ""}" style="--track-color:${TRACK_COLORS[track.trackIndex] || TRACK_COLORS[0]}" data-node-id="${node.id}">
                      <div class="route-date">${node.dayLabel} · ${node.dateLabel}</div>
                      <strong>${node.name}</strong>
                      <span>${formatNumber(node.total)} TNLS</span>
                      <small>${node.meta}</small>
                      <div class="weather-chip is-pending" data-weather-id="${node.id}">Đang tải thời tiết</div>
                    </button>
                    ${index < track.nodes.length - 1 ? renderSegment(node, track.nodes[index + 1]) : ""}
                  `).join("")}
                </div>
              </article>
            `).join("")}
          </div>
        `;

        boardEl.querySelectorAll("[data-node-id]").forEach((button) => {
          button.addEventListener("click", () => {
            state.activeNodeId = button.getAttribute("data-node-id");
            render();
          });
        });
      }

      function renderSummary(direction, tracks) {
        const activeNode = getActiveNode(tracks);
        if (!activeNode) {
          summaryPanelEl.innerHTML = "";
          return;
        }

        const activeTrack = tracks[activeNode.trackIndex];
        const nodeIndex = activeTrack.nodes.findIndex((node) => node.id === activeNode.id);
        const previousNode = nodeIndex > 0 ? activeTrack.nodes[nodeIndex - 1] : null;
        const nextNode = nodeIndex >= 0 && nodeIndex < activeTrack.nodes.length - 1 ? activeTrack.nodes[nodeIndex + 1] : null;
        const segmentOrigin = previousNode || activeNode;
        const segmentDestination = previousNode ? activeNode : nextNode;
        const segmentMetric = segmentDestination ? getSegmentMetric(segmentOrigin, segmentDestination) : null;
        const directionTotal = tracks.reduce((sum, track) => sum + Number(track.total || 0), 0);
        const detailMarkup = activeNode.detailItems.length
          ? `
            <div class="focus-list">
              ${activeNode.detailItems.map((item) => `
                <div class="focus-list-item">
                  <span>${item.label}</span>
                  <strong>${item.value}</strong>
                </div>
              `).join("")}
            </div>
          `
          : "";
        const routeLabel = segmentDestination
          ? `${segmentOrigin.name} → ${segmentDestination.name}`
          : "Kết thúc tuyến";
        const segmentMeta = segmentMetric
          ? (
            segmentMetric.source === "same-site"
              ? "Không phát sinh quãng di chuyển."
              : `${formatNumber(segmentMetric.distance_km)} km · ${formatNumber(segmentMetric.travel_minutes)} phút`
          )
          : "Không còn chặng kế tiếp.";
        const sourceNote = !segmentMetric ? ""
          : segmentMetric.source === "estimated"
            ? "Số liệu chặng này đang dùng ước tính vì chưa có dữ liệu tuyến chi tiết."
            : segmentMetric.source === "osrm-cache"
              ? "Số liệu chặng này lấy từ cache tuyến hiện có trong dự án."
              : "";

        summaryPanelEl.innerHTML = `
          <div class="summary-head">
            <div class="hero-kicker">${direction.label}</div>
            <h2>${formatNumber(directionTotal)} TNLS</h2>
            <p>${direction.description || ""}</p>
          </div>

          <div class="summary-strip">
            ${tracks.map((track) => `
              <div class="summary-strip-item">
                <div>
                  <strong>${track.label}</strong>
                  <span>${track.title}</span>
                </div>
                <div class="summary-strip-total">${formatNumber(track.total)} TNLS</div>
              </div>
            `).join("")}
          </div>

          <div class="focus-card">
            <strong>${activeNode.name}</strong>
            <span>${activeNode.dayLabel} · ${activeNode.dateLabel} · ${activeNode.trackLabel}</span>
            <span>${formatNumber(activeNode.total)} TNLS · ${activeNode.meta}</span>
            <div class="weather-chip is-pending" data-weather-id="${activeNode.id}">Đang tải thời tiết</div>
            ${detailMarkup}
          </div>

          <div class="segment-card">
            <strong>${routeLabel}</strong>
            <span>${segmentMeta}</span>
            ${sourceNote ? `<small>${sourceNote}</small>` : ""}
            ${segmentDestination ? `<a class="maps-link" href="${buildGoogleMapsUrl(segmentOrigin, segmentDestination)}" target="_blank" rel="noopener noreferrer">Mở trên Google Maps</a>` : ""}
          </div>
        `;
      }

      async function fetchForecastForNode(node) {
        const coordKey = buildCoordKey(node.lat, node.lng);
        if (!forecastCache.has(coordKey)) {
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(node.lat)}&longitude=${encodeURIComponent(node.lng)}&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FBangkok&forecast_days=16`;
          forecastCache.set(coordKey, fetch(url).then((response) => response.json()).catch(() => null));
        }
        const payload = await forecastCache.get(coordKey);
        if (!payload || !payload.daily || !Array.isArray(payload.daily.time)) {
          return {
            status: "error",
            text: "Không lấy được thời tiết"
          };
        }
        const dayIndex = payload.daily.time.indexOf(node.isoDate);
        if (dayIndex < 0) {
          return {
            status: "unavailable",
            text: `Chưa có dự báo cho ${node.dateLabel}`
          };
        }
        const weatherCode = payload.daily.weather_code[dayIndex];
        const minTemp = Math.round(payload.daily.temperature_2m_min[dayIndex]);
        const maxTemp = Math.round(payload.daily.temperature_2m_max[dayIndex]);
        return {
          status: "ready",
          text: `${describeWeatherCode(weatherCode)} · ${minTemp}-${maxTemp}°C`
        };
      }

      function applyWeatherState(nodeId, weatherState) {
        document.querySelectorAll(`[data-weather-id="${nodeId}"]`).forEach((element) => {
          element.textContent = weatherState.text;
          element.classList.remove("is-pending", "is-unavailable");
          if (weatherState.status === "unavailable" || weatherState.status === "error") {
            element.classList.add("is-unavailable");
          }
        });
      }

      async function hydrateWeather(tracks) {
        const nodes = tracks.flatMap((track) => track.nodes);
        await Promise.all(nodes.map(async (node) => {
          if (!weatherByNodeId.has(node.id)) {
            const weatherState = await fetchForecastForNode(node);
            weatherByNodeId.set(node.id, weatherState);
          }
          applyWeatherState(node.id, weatherByNodeId.get(node.id));
        }));
      }

      function render() {
        const direction = getSelectedDirection();
        const tracks = buildDirectionTracks(direction);
        renderDirectionTabs(direction);
        renderBoard(direction, tracks);
        renderSummary(direction, tracks);
        hydrateWeather(tracks);
      }

      render();
      window.setInterval(() => {
        forecastCache.clear();
        weatherByNodeId.clear();
        render();
      }, 600000);
    })();
  </script>
</body>
</html>
