<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ page_title or 'Bản đồ ADN liệt sĩ - PhanMemPC06_Pro' }}</title>
  <style>
    :root {
      color-scheme: light;
      --bg-cream: #f4efe4;
      --surface: rgba(255, 255, 255, 0.9);
      --surface-strong: rgba(255, 255, 255, 0.97);
      --ink-900: #1f2937;
      --ink-700: #475569;
      --ink-500: #64748b;
      --shadow-soft: 0 24px 70px rgba(63, 46, 18, 0.12);
      --shadow-card: 0 16px 40px rgba(15, 23, 42, 0.12);
      --day-1: #c4661f;
      --day-2: #325fd8;
      --day-3: #167b73;
      --day-4: #7c3aed;
      --day-5: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      font-family: "Avenir Next", "Segoe UI", "Helvetica Neue", sans-serif;
      color: var(--ink-900);
      background:
        linear-gradient(180deg, rgba(255, 255, 255, 0.62), rgba(244, 239, 228, 0.95)),
        radial-gradient(circle at top left, rgba(113, 148, 122, 0.18), transparent 35%),
        radial-gradient(circle at top right, rgba(196, 102, 31, 0.11), transparent 28%),
        var(--bg-cream);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(122, 106, 70, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(122, 106, 70, 0.08) 1px, transparent 1px);
      background-size: 76px 76px;
      opacity: 0.42;
    }

    .pc06-home-link {
      position: fixed;
      top: 22px;
      right: 22px;
      z-index: 10;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 11px 16px;
      border-radius: 999px;
      color: #fff;
      background: rgba(15, 23, 42, 0.9);
      text-decoration: none;
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.02em;
      box-shadow: var(--shadow-card);
      transition: transform 0.18s ease, background 0.18s ease;
    }

    .pc06-home-link:hover,
    .pc06-home-link:focus-visible {
      background: rgba(15, 23, 42, 0.98);
      transform: translateY(-1px);
    }

    .page-shell {
      position: relative;
      z-index: 1;
      width: min(1780px, calc(100% - 40px));
      margin: 28px auto 32px;
      padding-top: 24px;
    }

    .page-shell.is-reference-mode {
      width: min(1840px, calc(100% - 28px));
      margin: 16px auto 24px;
      padding-top: 8px;
    }

    .page-shell.is-reference-mode .hero-card {
      display: none;
    }

    .page-shell.is-reference-mode .toolbar {
      margin-bottom: 12px;
    }

    .page-shell.is-reference-mode .workspace {
      grid-template-columns: minmax(0, 1fr) 320px;
      gap: 16px;
    }

    .page-shell.is-reference-mode .map-card {
      padding: 14px;
      top: 12px;
    }

    .page-shell.is-reference-mode .summary-card {
      padding: 18px;
      top: 12px;
      max-height: calc(100vh - 28px);
    }

    .hero-card,
    .toolbar-card,
    .map-card,
    .summary-card {
      background: var(--surface);
      backdrop-filter: blur(18px);
      border: 1px solid rgba(255, 255, 255, 0.76);
      border-radius: 30px;
      box-shadow: var(--shadow-soft);
    }

    .hero-card {
      padding: 20px 24px;
      margin-bottom: 18px;
    }

    .hero-kicker {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(154, 95, 29, 0.12);
      color: #9a5f1d;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.09em;
      text-transform: uppercase;
      margin-bottom: 14px;
    }

    h1 {
      margin: 0;
      font-size: clamp(24px, 3.6vw, 34px);
      line-height: 1.05;
      letter-spacing: -0.03em;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 18px;
    }

    .toolbar-card {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
    }

    .segmented-button,
    .day-chip {
      border: 0;
      border-radius: 18px;
      font: inherit;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease, color 0.16s ease;
    }

    .segmented-button {
      min-width: 176px;
      padding: 12px 14px;
      background: transparent;
      color: var(--ink-700);
      text-align: left;
    }

    .segmented-button strong,
    .segmented-button span {
      display: block;
    }

    .segmented-button strong {
      font-size: 14px;
    }

    .segmented-button span {
      margin-top: 3px;
      color: var(--ink-500);
      font-size: 12px;
      line-height: 1.4;
    }

    .segmented-button.is-active {
      background: rgba(255, 255, 255, 0.98);
      color: var(--ink-900);
      box-shadow: inset 0 0 0 1px rgba(196, 102, 31, 0.2), 0 12px 26px rgba(148, 95, 43, 0.1);
      transform: translateY(-1px);
    }

    .day-filter {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .day-chip {
      padding: 11px 14px;
      background: rgba(255, 255, 255, 0.78);
      color: var(--ink-700);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.02em;
      box-shadow: var(--shadow-card);
    }

    .day-chip.is-active {
      color: #fff;
      background: linear-gradient(135deg, rgba(196, 102, 31, 0.98), rgba(154, 95, 29, 0.96));
      box-shadow: 0 18px 30px rgba(196, 102, 31, 0.24);
    }

    .workspace {
      display: grid;
      grid-template-columns: minmax(0, 1.95fr) minmax(360px, 0.62fr);
      gap: 18px;
      align-items: start;
    }

    .map-card {
      padding: 18px;
      position: sticky;
      top: 22px;
    }

    .summary-card {
      padding: 20px;
      position: sticky;
      top: 22px;
      max-height: calc(100vh - 54px);
      overflow: auto;
    }

    .map-stage {
      position: relative;
      min-height: 920px;
      border-radius: 28px;
      overflow: hidden;
      user-select: none;
      background:
        radial-gradient(circle at 18% 20%, rgba(28, 120, 97, 0.08), transparent 18%),
        radial-gradient(circle at 75% 16%, rgba(99, 102, 241, 0.09), transparent 16%),
        radial-gradient(circle at 82% 70%, rgba(196, 102, 31, 0.08), transparent 22%),
        linear-gradient(180deg, rgba(255, 255, 255, 0.92), rgba(251, 249, 244, 0.96));
      border: 1px solid rgba(226, 232, 240, 0.85);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.6);
      isolation: isolate;
    }

    .map-stage.is-reference-mode {
      min-height: 640px;
    }

    .map-stage::before {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(148, 163, 184, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.08) 1px, transparent 1px);
      background-size: 86px 86px;
      opacity: 0.82;
    }

    .map-stage.is-grabbing {
      cursor: grabbing;
    }

    .map-toolbar {
      position: absolute;
      top: 16px;
      left: 16px;
      z-index: 6;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(226, 232, 240, 0.92);
      box-shadow: 0 14px 30px rgba(15, 23, 42, 0.1);
      backdrop-filter: blur(14px);
    }

    .map-stage.is-reference-mode .map-toolbar {
      opacity: 0;
      pointer-events: none;
    }

    .map-toolbar-group {
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .map-control {
      border: 0;
      width: 34px;
      height: 34px;
      border-radius: 12px;
      background: rgba(248, 250, 252, 0.96);
      color: var(--ink-900);
      font: inherit;
      font-size: 18px;
      font-weight: 900;
      cursor: pointer;
      box-shadow: inset 0 0 0 1px rgba(226, 232, 240, 0.92);
      transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .map-control:hover,
    .map-control:focus-visible {
      transform: translateY(-1px);
      background: rgba(255, 255, 255, 0.98);
      box-shadow: inset 0 0 0 1px rgba(196, 102, 31, 0.28), 0 10px 20px rgba(15, 23, 42, 0.08);
      outline: none;
    }

    .map-status {
      min-width: 84px;
      color: var(--ink-700);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.02em;
      text-align: center;
    }

    .map-hint {
      color: var(--ink-500);
      font-size: 11px;
      font-weight: 700;
      white-space: nowrap;
    }

    .map-viewport {
      position: absolute;
      top: 0;
      left: 0;
      width: 1400px;
      height: 900px;
      transform-origin: 0 0;
      z-index: 1;
      will-change: transform;
    }

    .map-svg,
    .node-layer,
    .segment-layer {
      position: absolute;
      inset: 0;
      width: 1400px;
      height: 900px;
    }

    .map-svg {
      z-index: 1;
      overflow: visible;
    }

    .segment-layer {
      z-index: 2;
      pointer-events: none;
    }

    .node-layer {
      z-index: 3;
      pointer-events: none;
    }

    .route-path {
      fill: none;
      stroke-linecap: round;
      stroke-linejoin: round;
      opacity: 0.96;
      transition: opacity 0.18s ease, stroke-width 0.18s ease;
    }

    .route-path.is-active {
      opacity: 1;
      filter: drop-shadow(0 10px 20px rgba(15, 23, 42, 0.14));
    }

    .map-node {
      position: absolute;
      width: 0;
      height: 0;
      border: 0;
      padding: 0;
      background: transparent;
      cursor: pointer;
      pointer-events: auto;
      color: inherit;
      transform: none;
      transition: transform 0.16s ease, opacity 0.16s ease;
      overflow: visible;
    }

    .map-node.is-dimmed {
      opacity: 0.82;
    }

    .map-node:hover,
    .map-node:focus-visible {
      transform: scale(1.03);
      outline: none;
      z-index: 5;
    }

    .map-node.is-active {
      z-index: 6;
    }

    .map-node-dot {
      position: absolute;
      left: 0;
      top: 0;
      transform: translate(-50%, -50%);
      width: var(--node-size);
      height: var(--node-size);
      border-radius: 50%;
      background: var(--node-color);
      border: 4px solid rgba(255, 255, 255, 0.96);
      box-shadow:
        0 0 0 6px rgba(255, 255, 255, 0.24),
        0 18px 34px rgba(15, 23, 42, 0.2);
    }

    .map-node.is-active .map-node-dot {
      box-shadow:
        0 0 0 7px rgba(255, 255, 255, 0.34),
        0 0 0 15px rgba(196, 102, 31, 0.16),
        0 22px 42px rgba(15, 23, 42, 0.28);
    }

    .map-node-label {
      position: absolute;
      min-width: max-content;
      max-width: 210px;
      padding: 0;
      border-radius: 0;
      background: transparent;
      border: 0;
      box-shadow: none;
      color: var(--ink-900);
      text-align: left;
      pointer-events: none;
    }

    .map-node-label strong,
    .map-node-label span,
    .map-node-label small {
      display: block;
    }

    .map-node-label strong {
      font-size: 16px;
      line-height: 1.14;
      letter-spacing: -0.02em;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.98), 0 0 2px rgba(255, 255, 255, 0.92);
    }

    .map-node-label span {
      margin-top: 4px;
      color: var(--ink-700);
      font-size: 12px;
      font-weight: 900;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.98), 0 0 2px rgba(255, 255, 255, 0.92);
    }

    .map-node-label small {
      margin-top: 6px;
      color: var(--ink-500);
      font-size: 11px;
      font-weight: 700;
      line-height: 1.35;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.98), 0 0 2px rgba(255, 255, 255, 0.92);
    }

    .map-node:not(.is-active) .map-node-label small {
      display: none;
    }

    .map-node.is-active .map-node-label {
      padding: 8px 10px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(226, 232, 240, 0.88);
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.08);
    }

    .anchor-right .map-node-label {
      left: 16px;
      top: 0;
      transform: translateY(-58%);
    }

    .anchor-left .map-node-label {
      right: 16px;
      top: 0;
      transform: translateY(-58%);
      text-align: right;
    }

    .anchor-bottom .map-node-label {
      top: 16px;
      left: 0;
      transform: translateX(-50%);
      text-align: center;
    }

    .anchor-top .map-node-label {
      bottom: 16px;
      left: 0;
      transform: translateX(-50%);
      text-align: center;
    }

    .segment-badge {
      position: absolute;
      transform: translate(-50%, -50%);
      padding: 8px 10px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(226, 232, 240, 0.94);
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.1);
      color: var(--ink-900);
      font-size: 11px;
      font-weight: 800;
      line-height: 1.35;
      white-space: nowrap;
      pointer-events: none;
      max-width: 170px;
      text-align: center;
    }

    .segment-badge span {
      display: block;
      color: var(--ink-500);
      font-size: 10px;
      font-weight: 700;
      margin-top: 2px;
    }

    .map-note {
      position: absolute;
      left: 50%;
      bottom: 18px;
      z-index: 6;
      transform: translateX(-50%);
      width: min(760px, calc(100% - 48px));
      padding: 12px 16px;
      border-radius: 18px;
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 18px 34px rgba(15, 23, 42, 0.08);
      color: var(--ink-700);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.45;
      text-align: left;
    }

    .map-note strong {
      color: var(--ink-900);
    }

    .summary-head h2 {
      margin: 0;
      font-size: 32px;
      line-height: 1.02;
      letter-spacing: -0.03em;
    }

    .route-summary {
      display: grid;
      gap: 12px;
      margin-top: 18px;
    }

    .route-day-group {
      display: grid;
      gap: 8px;
    }

    .route-day-title {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--ink-900);
      font-size: 13px;
      font-weight: 900;
      letter-spacing: 0.02em;
      text-transform: uppercase;
    }

    .route-day-swatch {
      width: 24px;
      height: 8px;
      border-radius: 999px;
      background: var(--day-color);
      flex: 0 0 auto;
    }

    .route-item {
      width: 100%;
      border: 0;
      padding: 12px 14px;
      border-radius: 18px;
      background: rgba(248, 250, 252, 0.94);
      border: 1px solid rgba(226, 232, 240, 0.88);
      text-align: left;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, background 0.16s ease;
    }

    .route-item:hover,
    .route-item:focus-visible {
      transform: translateY(-1px);
      box-shadow: 0 14px 28px rgba(15, 23, 42, 0.08);
      outline: none;
    }

    .route-item.is-active {
      background: rgba(255, 255, 255, 0.98);
      box-shadow: inset 0 0 0 2px var(--route-color), 0 18px 34px rgba(15, 23, 42, 0.1);
    }

    .route-item strong,
    .route-item span,
    .route-item small {
      display: block;
    }

    .route-item strong {
      font-size: 14px;
      line-height: 1.3;
    }

    .route-item span {
      margin-top: 4px;
      color: var(--ink-700);
      font-size: 12px;
      font-weight: 800;
      line-height: 1.45;
    }

    .route-item small {
      margin-top: 6px;
      color: var(--ink-500);
      font-size: 11px;
      line-height: 1.45;
    }

    .detail-card {
      margin-top: 16px;
      padding: 16px;
      border-radius: 24px;
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.98), rgba(250, 246, 239, 0.92));
      border: 1px solid rgba(226, 232, 240, 0.92);
      box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.72);
    }

    .detail-card strong,
    .detail-card span,
    .detail-card small {
      display: block;
    }

    .detail-card strong {
      font-size: 18px;
      line-height: 1.2;
    }

    .detail-card span {
      margin-top: 5px;
      color: var(--ink-700);
      font-size: 13px;
      font-weight: 700;
      line-height: 1.55;
    }

    .detail-card small {
      margin-top: 8px;
      color: var(--ink-500);
      font-size: 12px;
      line-height: 1.55;
    }

    .detail-list {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }

    .detail-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 9px 11px;
      border-radius: 14px;
      background: rgba(248, 250, 252, 0.92);
      border: 1px solid rgba(226, 232, 240, 0.82);
    }

    .detail-row span,
    .detail-row strong {
      margin: 0;
    }

    .detail-row span {
      color: var(--ink-700);
      font-size: 12px;
      font-weight: 700;
      line-height: 1.45;
    }

    .detail-row strong {
      font-size: 13px;
    }

    .weather-chip {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      margin-top: 8px;
      padding: 5px 9px;
      border-radius: 999px;
      background: rgba(37, 99, 235, 0.08);
      color: #1d4ed8;
      font-size: 11px;
      font-weight: 700;
      line-height: 1.3;
    }

    .weather-chip.is-pending {
      color: var(--ink-500);
      background: rgba(148, 163, 184, 0.12);
    }

    .weather-chip.is-unavailable {
      color: #92400e;
      background: rgba(245, 158, 11, 0.14);
    }

    .maps-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-top: 12px;
      padding: 10px 14px;
      border-radius: 999px;
      text-decoration: none;
      background: rgba(15, 23, 42, 0.92);
      color: #fff;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.02em;
      transition: transform 0.16s ease, background 0.16s ease;
    }

    .maps-link:hover,
    .maps-link:focus-visible {
      background: rgba(15, 23, 42, 1);
      transform: translateY(-1px);
    }

    @media (max-width: 1080px) {
      .workspace {
        grid-template-columns: 1fr;
      }

      .map-card,
      .summary-card {
        position: static;
      }
    }

    @media (max-width: 768px) {
      .pc06-home-link {
        top: 12px;
        right: 12px;
        padding: 10px 13px;
      }

      .page-shell {
        width: min(100% - 20px, 100%);
        margin: 16px auto 20px;
        padding-top: 42px;
      }

      .hero-card,
      .toolbar-card,
      .map-card,
      .summary-card {
        border-radius: 24px;
      }

      .hero-card,
      .summary-card {
        padding: 18px;
      }

      .map-stage {
        min-height: 700px;
      }

      .map-toolbar {
        top: 12px;
        left: 12px;
        right: 12px;
        width: auto;
        justify-content: space-between;
        flex-wrap: wrap;
      }

      .map-hint {
        white-space: normal;
      }
    }
  </style>
</head>
<body>
  <a class="pc06-home-link" href="{{ pc06_home_url or '/dashboard' }}">
    {{ pc06_home_label or 'Đăng nhập PC06' }}
  </a>

  <main class="page-shell">
    <section class="hero-card">
      <div class="hero-kicker">{{ pc06_shell_label or 'PhanMemPC06_Pro' }}</div>
      <h1>15 điểm tập kết ADN</h1>
    </section>

    <section class="toolbar">
      <div class="toolbar-card" id="direction-tabs"></div>
      <div class="day-filter" id="day-filter"></div>
    </section>

    <section class="workspace">
      <div class="map-card">
        <div class="map-stage" id="map-stage">
          <div class="map-toolbar">
            <div class="map-toolbar-group">
              <button type="button" class="map-control" id="zoom-out-button" aria-label="Thu nhỏ">-</button>
              <div class="map-status" id="map-status">100%</div>
              <button type="button" class="map-control" id="zoom-in-button" aria-label="Phóng to">+</button>
              <button type="button" class="map-control" id="reset-view-button" aria-label="Đặt lại góc nhìn">↺</button>
            </div>
            <div class="map-hint">Lăn chuột để zoom, kéo nền để di chuyển</div>
          </div>
          <div class="map-viewport" id="map-viewport">
            <svg class="map-svg" id="map-svg" viewBox="0 0 1400 900" aria-hidden="true"></svg>
            <div class="segment-layer" id="segment-layer"></div>
            <div class="node-layer" id="node-layer"></div>
          </div>
          <div class="map-note" id="map-note"></div>
        </div>
      </div>
      <aside class="summary-card" id="summary-panel"></aside>
    </section>
  </main>

  <script src="{{ url_for('static', filename='js/martyr-adn-schedule-data.js') }}"></script>
  <script src="{{ url_for('static', filename='js/martyr-adn-route-metrics.js') }}"></script>
  <script>
    (() => {
      const data = window.ADN_SCHEDULE_DATA;
      const routeMetrics = window.ADN_ROUTE_METRICS || {};
      const TRACK_COLORS = ["#c4661f", "#325fd8", "#167b73"];
      const DAY_COLORS = ["#c4661f", "#325fd8", "#167b73", "#7c3aed", "#dc2626"];
      const FIXED_DAY_ROUTE_PLAN = [
        ["Sơn Dương", "Minh Xuân", "Xuân Vân"],
        ["Chiêm Hóa", "Lâm Bình", "Bắc Quang"],
        ["Quang Bình", "Hà Giang 2", "Bắc Mê"],
        ["Quản Bạ", "Yên Minh", "Đồng Văn", "Mèo Vạc"],
        ["Hoàng Su Phì", "Pà Vầy Sủ"]
      ];
      const FIXED_POINT_TOTALS = {
        "Sơn Dương": 675,
        "Minh Xuân": 662,
        "Xuân Vân": 509,
        "Chiêm Hóa": 529,
        "Lâm Bình": 291,
        "Bắc Quang": 365,
        "Quang Bình": 246,
        "Hà Giang 2": 265,
        "Bắc Mê": 105,
        "Quản Bạ": 62,
        "Yên Minh": 48,
        "Đồng Văn": 17,
        "Mèo Vạc": 11,
        "Hoàng Su Phì": 60,
        "Pà Vầy Sủ": 64
      };
      const STAGE_WIDTH = 1400;
      const STAGE_HEIGHT = 900;
      const directionTabsEl = document.getElementById("direction-tabs");
      const dayFilterEl = document.getElementById("day-filter");
      const pageShellEl = document.querySelector(".page-shell");
      const mapStageEl = document.getElementById("map-stage");
      const mapViewportEl = document.getElementById("map-viewport");
      const mapSvgEl = document.getElementById("map-svg");
      const nodeLayerEl = document.getElementById("node-layer");
      const segmentLayerEl = document.getElementById("segment-layer");
      const summaryPanelEl = document.getElementById("summary-panel");
      const mapStatusEl = document.getElementById("map-status");
      const mapNoteEl = document.getElementById("map-note");
      const zoomInButtonEl = document.getElementById("zoom-in-button");
      const zoomOutButtonEl = document.getElementById("zoom-out-button");
      const resetViewButtonEl = document.getElementById("reset-view-button");

      const state = {
        directionId: data.directions[0].id,
        dayIndex: null,
        activeRouteId: null,
        activeNodeKey: null,
        viewport: {
          scale: 1,
          translateX: 0,
          translateY: 0
        },
        shouldAutoFit: true
      };

      const forecastCache = new Map();
      const weatherCache = new Map();
      const interactionState = {
        isDragging: false,
        startX: 0,
        startY: 0,
        translateX: 0,
        translateY: 0
      };

      function formatNumber(value) {
        return new Intl.NumberFormat("vi-VN").format(Number(value || 0));
      }

      function toIsoDate(dateLabel) {
        const parts = String(dateLabel || "").split("/");
        if (parts.length !== 3) {
          return "";
        }
        const [day, month, year] = parts;
        return `${year}-${String(Number(month)).padStart(2, "0")}-${String(Number(day)).padStart(2, "0")}`;
      }

      function buildNodeKey(name, lat, lng) {
        return `${name}|${Number(lat).toFixed(6)}|${Number(lng).toFixed(6)}`;
      }

      function buildRouteMetricKey(origin, destination) {
        return `${Number(origin.lat).toFixed(6)}|${Number(origin.lng).toFixed(6)}|${Number(destination.lat).toFixed(6)}|${Number(destination.lng).toFixed(6)}`;
      }

      function buildCoordKey(lat, lng) {
        return `${Number(lat).toFixed(6)}|${Number(lng).toFixed(6)}`;
      }

      function buildWeatherKey(lat, lng, isoDate) {
        return `${buildCoordKey(lat, lng)}|${isoDate}`;
      }

      function describeWeatherCode(code) {
        if (code === 0) {
          return "Trời quang";
        }
        if (code >= 1 && code <= 3) {
          return "Nhiều mây";
        }
        if (code >= 45 && code <= 48) {
          return "Sương mù";
        }
        if (code >= 51 && code <= 67) {
          return "Có mưa";
        }
        if (code >= 71 && code <= 77) {
          return "Mưa tuyết";
        }
        if (code >= 80 && code <= 86) {
          return "Mưa rào";
        }
        if (code >= 95) {
          return "Có dông";
        }
        return "Thời tiết thay đổi";
      }

      function getSelectedDirection() {
        return data.directions.find((direction) => direction.id === state.directionId) || data.directions[0];
      }

      function getVisibleDays(direction) {
        if (state.dayIndex === null) {
          return direction.days.map((day, index) => ({ day, dayIndex: index }));
        }
        return direction.days[state.dayIndex] ? [{ day: direction.days[state.dayIndex], dayIndex: state.dayIndex }] : [];
      }

      function isReferenceBoardMode(direction) {
        return direction && direction.id === "co-dinh" && state.dayIndex === null;
      }

      function buildDirectionPointLookup(direction) {
        const lookup = new Map();
        direction.days.forEach((day) => {
          day.tracks.forEach((track) => {
            const stops = direction.id === "co-dinh" ? track.stops : track.visits;
            stops.forEach((stop) => {
              if (!stop || !stop.name || lookup.has(stop.name)) {
                return;
              }
              lookup.set(stop.name, {
                name: stop.name,
                lat: Number(stop.lat),
                lng: Number(stop.lng)
              });
            });
          });
        });
        return lookup;
      }

      function renderDirectionTabs(direction) {
        directionTabsEl.innerHTML = "";
        data.directions.forEach((item) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "segmented-button" + (item.id === direction.id ? " is-active" : "");
          button.innerHTML = `<strong>${item.label}</strong><span>${item.shortLabel || ""}</span>`;
          button.addEventListener("click", () => {
            if (state.directionId === item.id) {
              return;
            }
            state.directionId = item.id;
            state.dayIndex = null;
            state.activeRouteId = null;
            state.activeNodeKey = null;
            state.shouldAutoFit = true;
            render();
          });
          directionTabsEl.appendChild(button);
        });
      }

      function renderDayFilter(direction) {
        dayFilterEl.innerHTML = "";
        const allButton = document.createElement("button");
        allButton.type = "button";
        allButton.className = "day-chip" + (state.dayIndex === null ? " is-active" : "");
        allButton.textContent = "Tất cả 5 ngày";
        allButton.addEventListener("click", () => {
          if (state.dayIndex === null) {
            return;
          }
          state.dayIndex = null;
          state.activeRouteId = null;
          state.activeNodeKey = null;
          state.shouldAutoFit = true;
          render();
        });
        dayFilterEl.appendChild(allButton);

        direction.days.forEach((day, dayIndex) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "day-chip" + (state.dayIndex === dayIndex ? " is-active" : "");
          button.textContent = `${day.dayLabel} · ${day.dateLabel}`;
          button.addEventListener("click", () => {
            if (state.dayIndex === dayIndex) {
              return;
            }
            state.dayIndex = dayIndex;
            state.activeRouteId = null;
            state.activeNodeKey = null;
            state.shouldAutoFit = true;
            render();
          });
          dayFilterEl.appendChild(button);
        });
      }

      function getMetric(origin, destination) {
        const cached = routeMetrics[buildRouteMetricKey(origin, destination)];
        if (cached) {
          return cached;
        }
        const reversed = routeMetrics[buildRouteMetricKey(destination, origin)];
        if (reversed) {
          return reversed;
        }
        if (origin.lat === destination.lat && origin.lng === destination.lng) {
          return {
            distance_km: 0,
            travel_minutes: 0,
            source: "same-site"
          };
        }
        const toRadians = (value) => value * Math.PI / 180;
        const earthRadiusKm = 6371;
        const latDelta = toRadians(destination.lat - origin.lat);
        const lngDelta = toRadians(destination.lng - origin.lng);
        const startLat = toRadians(origin.lat);
        const endLat = toRadians(destination.lat);
        const haversineValue = (
          Math.sin(latDelta / 2) ** 2
          + Math.cos(startLat) * Math.cos(endLat) * Math.sin(lngDelta / 2) ** 2
        );
        const crowDistance = 2 * earthRadiusKm * Math.atan2(
          Math.sqrt(haversineValue),
          Math.sqrt(Math.max(0, 1 - haversineValue))
        );
        const distanceKm = crowdDistanceFix(crowDistance * 1.85);
        return {
          distance_km: Number(distanceKm.toFixed(1)),
          travel_minutes: Math.max(1, Math.round(distanceKm / 55 * 60)),
          source: "estimated"
        };
      }

      function crowdDistanceFix(value) {
        return Number(value || 0);
      }

      function dedupeConsecutivePoints(points) {
        const deduped = [];
        points.forEach((point) => {
          if (!deduped.length || deduped[deduped.length - 1].key !== point.key) {
            deduped.push(point);
          }
        });
        return deduped;
      }

      function buildRoutes(direction) {
        if (direction.id === "co-dinh") {
          const pointLookup = buildDirectionPointLookup(direction);
          const routePlans = state.dayIndex === null
            ? FIXED_DAY_ROUTE_PLAN.map((points, dayIndex) => ({ dayIndex, points }))
            : (FIXED_DAY_ROUTE_PLAN[state.dayIndex] ? [{ dayIndex: state.dayIndex, points: FIXED_DAY_ROUTE_PLAN[state.dayIndex] }] : []);

          return routePlans.map(({ dayIndex, points }) => {
            const day = direction.days[dayIndex];
            const routePoints = points.map((name) => {
              const coords = pointLookup.get(name);
              if (!coords) {
                return null;
              }
              return {
                key: buildNodeKey(name, coords.lat, coords.lng),
                name,
                lat: coords.lat,
                lng: coords.lng,
                total: Number(FIXED_POINT_TOTALS[name] || 0),
                session: "Cả ngày",
                dayLabel: day.dayLabel,
                dateLabel: day.dateLabel,
                isoDate: toIsoDate(day.dateLabel),
                dayIndex,
                areas: []
              };
            }).filter(Boolean);

            const segments = [];
            for (let index = 0; index < routePoints.length - 1; index += 1) {
              const origin = routePoints[index];
              const destination = routePoints[index + 1];
              segments.push({
                id: `${dayIndex}-${index}`,
                trackIndex: dayIndex,
                fromKey: origin.key,
                toKey: destination.key,
                fromName: origin.name,
                toName: destination.name,
                dayLabel: day.dayLabel,
                dateLabel: day.dateLabel,
                color: DAY_COLORS[dayIndex] || DAY_COLORS[0],
                metric: getMetric(origin, destination)
              });
            }

            return {
              id: `${direction.id}-day-${dayIndex}`,
              trackIndex: dayIndex,
              color: DAY_COLORS[dayIndex] || DAY_COLORS[0],
              label: day.dayLabel,
              title: points.join(" -> "),
              dateLabel: day.dateLabel,
              summary: points.join(" -> "),
              total: routePoints.reduce((sum, point) => sum + Number(point.total || 0), 0),
              meta: `${day.dateLabel} · ${routePoints.reduce((sum, point) => sum + Number(point.total || 0), 0).toLocaleString("vi-VN")} TNLS`,
              points: routePoints,
              segments,
              dayDetails: [{
                dayIndex,
                dayLabel: day.dayLabel,
                dateLabel: day.dateLabel,
                color: DAY_COLORS[dayIndex] || DAY_COLORS[0],
                title: points.join(" -> "),
                total: routePoints.reduce((sum, point) => sum + Number(point.total || 0), 0),
                summary: points.join(" -> "),
                points: routePoints
              }]
            };
          }).filter((route) => route.points.length);
        }

        const visibleDays = getVisibleDays(direction);
        const routes = [];
        const trackCount = visibleDays[0] ? visibleDays[0].day.tracks.length : 0;

        for (let trackIndex = 0; trackIndex < trackCount; trackIndex += 1) {
          const points = [];
          const dayDetails = [];
          let total = 0;

          visibleDays.forEach(({ day, dayIndex }) => {
            const track = day.tracks[trackIndex];
            const dayPoints = [];

            if (direction.id === "co-dinh") {
              track.stops.forEach((stop) => {
                const point = {
                  key: buildNodeKey(stop.name, stop.lat, stop.lng),
                  name: stop.name,
                  lat: stop.lat,
                  lng: stop.lng,
                  total: Number(stop.total || 0),
                  session: stop.session,
                  dayLabel: day.dayLabel,
                  dateLabel: day.dateLabel,
                  isoDate: toIsoDate(day.dateLabel),
                  dayIndex,
                  areas: stop.areas || []
                };
                total += point.total;
                dayPoints.push(point);
                points.push(point);
              });
            } else {
              track.visits.filter((visit) => visit.name).forEach((visit) => {
                const point = {
                  key: buildNodeKey(visit.name, visit.lat, visit.lng),
                  name: visit.name,
                  lat: visit.lat,
                  lng: visit.lng,
                  total: Number(visit.count || 0),
                  session: visit.session || "Cả ngày",
                  dayLabel: day.dayLabel,
                  dateLabel: day.dateLabel,
                  isoDate: toIsoDate(day.dateLabel),
                  dayIndex,
                  areas: []
                };
                total += point.total;
                dayPoints.push(point);
                points.push(point);
              });
            }

            if (dayPoints.length) {
              dayDetails.push({
                dayIndex,
                dayLabel: day.dayLabel,
                dateLabel: day.dateLabel,
                color: DAY_COLORS[dayIndex] || DAY_COLORS[0],
                title: track.title,
                total: dayPoints.reduce((sum, point) => sum + Number(point.total || 0), 0),
                summary: dayPoints.map((point) => point.name).join(" -> "),
                points: dayPoints
              });
            }
          });

          const routePoints = dedupeConsecutivePoints(points);
          if (!routePoints.length) {
            continue;
          }

          const segments = [];
          for (let index = 0; index < routePoints.length - 1; index += 1) {
            const origin = routePoints[index];
            const destination = routePoints[index + 1];
            segments.push({
              id: `${trackIndex}-${index}`,
              trackIndex,
              fromKey: origin.key,
              toKey: destination.key,
              fromName: origin.name,
              toName: destination.name,
              dayLabel: destination.dayLabel,
              dateLabel: destination.dateLabel,
              color: DAY_COLORS[destination.dayIndex] || DAY_COLORS[0],
              metric: getMetric(origin, destination)
            });
          }

          const trackLabel = visibleDays[0].day.tracks[trackIndex].label;
          routes.push({
            id: `${direction.id}-track-${trackIndex}`,
            trackIndex,
            color: TRACK_COLORS[trackIndex] || TRACK_COLORS[0],
            label: trackLabel,
            title: visibleDays.length > 1 ? `${trackLabel} · Tuyến xuyên ${visibleDays.length} ngày` : dayDetails[0].title,
            dateLabel: visibleDays.length > 1
              ? `${visibleDays[0].day.dateLabel} -> ${visibleDays[visibleDays.length - 1].day.dateLabel}`
              : dayDetails[0].dateLabel,
            summary: routePoints.map((point) => point.name).join(" -> "),
            total,
            meta: dayDetails.map((detail) => `${detail.dayLabel}: ${formatNumber(detail.total)} TNLS`).join(" · "),
            points: routePoints,
            segments,
            dayDetails
          });
        }
        return routes;
      }

      function resolveActiveRoute(routes) {
        return routes.find((route) => route.id === state.activeRouteId) || routes[0] || null;
      }

      function getPreferredRouteNodeKey(route) {
        if (!route || !route.points.length) {
          return null;
        }
        const preferredPoint = route.points.find((point) => Number(point.total || 0) > 0) || route.points[0];
        return preferredPoint ? preferredPoint.key : null;
      }

      function buildVisibleNodes(routes) {
        const map = new Map();
        routes.forEach((route) => {
          route.points.forEach((point) => {
            if (!map.has(point.key)) {
              map.set(point.key, {
                key: point.key,
                name: point.name,
                lat: point.lat,
                lng: point.lng,
                total: 0,
                occurrences: []
              });
            }
            const node = map.get(point.key);
            node.total += Number(point.total || 0);
            node.occurrences.push({
              routeId: route.id,
              routeLabel: route.label,
              trackIndex: route.trackIndex,
              dayIndex: point.dayIndex,
              dayLabel: point.dayLabel,
              dateLabel: point.dateLabel,
              isoDate: point.isoDate,
              total: Number(point.total || 0),
              session: point.session,
              color: route.color,
              areas: point.areas || [],
              lat: point.lat,
              lng: point.lng
            });
          });
        });
        return map;
      }

      function projectNodes(nodes, options = {}) {
        const {
          avoidCollisions = true,
          paddingX = 120,
          paddingY = 78
        } = options;
        const list = Array.from(nodes.values());
        const latitudes = list.map((node) => Number(node.lat));
        const longitudes = list.map((node) => Number(node.lng));
        const minLat = Math.min(...latitudes);
        const maxLat = Math.max(...latitudes);
        const minLng = Math.min(...longitudes);
        const maxLng = Math.max(...longitudes);
        const latRange = Math.max(0.01, maxLat - minLat);
        const lngRange = Math.max(0.01, maxLng - minLng);
        const projected = list.map((node) => ({
          ...node,
          x: paddingX + ((Number(node.lng) - minLng) / lngRange) * (STAGE_WIDTH - paddingX * 2),
          y: paddingY + ((maxLat - Number(node.lat)) / latRange) * (STAGE_HEIGHT - paddingY * 2)
        }));

        if (avoidCollisions) {
          for (let outer = 0; outer < projected.length; outer += 1) {
            for (let inner = 0; inner < outer; inner += 1) {
              const left = projected[inner];
              const right = projected[outer];
              const deltaX = right.x - left.x;
              const deltaY = right.y - left.y;
              const distance = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
              if (distance < 68) {
                const angle = Math.atan2(deltaY || 1, deltaX || 1);
                const push = (68 - distance) / 2;
                right.x += Math.cos(angle) * push;
                right.y += Math.sin(angle) * push;
                left.x -= Math.cos(angle) * push * 0.22;
                left.y -= Math.sin(angle) * push * 0.22;
              }
            }
          }
        }

        return new Map(projected.map((node) => [node.key, {
          ...node,
          x: Math.min(STAGE_WIDTH - 80, Math.max(80, node.x)),
          y: Math.min(STAGE_HEIGHT - 80, Math.max(80, node.y))
        }]));
      }

      function buildStraightPath(points) {
        if (points.length < 2) {
          return "";
        }
        let path = `M ${points[0].x} ${points[0].y}`;
        for (let index = 1; index < points.length; index += 1) {
          path += ` L ${points[index].x} ${points[index].y}`;
        }
        return path;
      }

      function buildSegmentBadgePosition(fromNode, toNode) {
        const midX = (fromNode.x + toNode.x) / 2;
        const midY = (fromNode.y + toNode.y) / 2;
        const deltaX = toNode.x - fromNode.x;
        const deltaY = toNode.y - fromNode.y;
        const distance = Math.hypot(deltaX, deltaY) || 1;
        const normalX = -deltaY / distance;
        const normalY = deltaX / distance;
        const offset = 24;
        return {
          x: midX + normalX * offset,
          y: midY + normalY * offset
        };
      }

      function nodeSize(total, maxTotal) {
        if (!maxTotal) {
          return 24;
        }
        return 22 + Math.sqrt(Math.max(0, total) / maxTotal) * 30;
      }

      function nodeColor(node, activeRoute) {
        if (activeRoute && activeRoute.points.some((point) => point.key === node.key)) {
          const matchingOccurrence = node.occurrences.find((occurrence) => occurrence.routeId === activeRoute.id);
          return matchingOccurrence ? TRACK_COLORS[matchingOccurrence.trackIndex] || activeRoute.color : activeRoute.color;
        }
        const dominant = node.occurrences.reduce((best, occurrence) => (
          !best || occurrence.total > best.total ? occurrence : best
        ), null);
        return dominant ? TRACK_COLORS[dominant.trackIndex] || dominant.color : TRACK_COLORS[0];
      }

      function clampScale(value) {
        return Math.min(2.8, Math.max(0.75, value));
      }

      function updateViewport() {
        mapViewportEl.style.transform = `translate(${state.viewport.translateX}px, ${state.viewport.translateY}px) scale(${state.viewport.scale})`;
        mapStatusEl.textContent = `${Math.round(state.viewport.scale * 100)}%`;
      }

      function setViewport(scale, translateX, translateY) {
        state.viewport.scale = clampScale(scale);
        state.viewport.translateX = translateX;
        state.viewport.translateY = translateY;
        updateViewport();
      }

      function zoomAt(clientX, clientY, scaleFactor) {
        const rect = mapStageEl.getBoundingClientRect();
        const offsetX = clientX - rect.left;
        const offsetY = clientY - rect.top;
        const previousScale = state.viewport.scale;
        const nextScale = clampScale(previousScale * scaleFactor);
        if (nextScale === previousScale) {
          return;
        }
        const worldX = (offsetX - state.viewport.translateX) / previousScale;
        const worldY = (offsetY - state.viewport.translateY) / previousScale;
        state.viewport.scale = nextScale;
        state.viewport.translateX = offsetX - worldX * nextScale;
        state.viewport.translateY = offsetY - worldY * nextScale;
        updateViewport();
      }

      function fitViewportToPositions(routePoints, positions) {
        if (!routePoints.length) {
          setViewport(1, 0, 0);
          return;
        }
        const projected = routePoints.map((point) => positions.get(point.key)).filter(Boolean);
        if (!projected.length) {
          setViewport(1, 0, 0);
          return;
        }
        const bounds = projected.reduce((acc, point) => ({
          minX: Math.min(acc.minX, point.x),
          maxX: Math.max(acc.maxX, point.x),
          minY: Math.min(acc.minY, point.y),
          maxY: Math.max(acc.maxY, point.y)
        }), {
          minX: projected[0].x,
          maxX: projected[0].x,
          minY: projected[0].y,
          maxY: projected[0].y
        });
        const rect = mapStageEl.getBoundingClientRect();
        const viewWidth = rect.width || STAGE_WIDTH;
        const viewHeight = rect.height || STAGE_HEIGHT;
        const padding = 140;
        const contentWidth = Math.max(220, bounds.maxX - bounds.minX);
        const contentHeight = Math.max(180, bounds.maxY - bounds.minY);
        const scale = clampScale(Math.min(
          (viewWidth - padding) / contentWidth,
          (viewHeight - padding) / contentHeight
        ));
        const centerX = (bounds.minX + bounds.maxX) / 2;
        const centerY = (bounds.minY + bounds.maxY) / 2;
        const translateX = viewWidth / 2 - centerX * scale;
        const translateY = viewHeight / 2 - centerY * scale;
        setViewport(scale, translateX, translateY);
      }

      function initializeViewportControls() {
        if (mapStageEl.dataset.viewportReady === "true") {
          return;
        }
        mapStageEl.dataset.viewportReady = "true";

        zoomInButtonEl.addEventListener("click", () => {
          const rect = mapStageEl.getBoundingClientRect();
          zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 1.18);
        });

        zoomOutButtonEl.addEventListener("click", () => {
          const rect = mapStageEl.getBoundingClientRect();
          zoomAt(rect.left + rect.width / 2, rect.top + rect.height / 2, 1 / 1.18);
        });

        resetViewButtonEl.addEventListener("click", () => {
          state.shouldAutoFit = true;
          render();
        });

        mapStageEl.addEventListener("wheel", (event) => {
          event.preventDefault();
          const scaleFactor = event.deltaY < 0 ? 1.12 : 1 / 1.12;
          zoomAt(event.clientX, event.clientY, scaleFactor);
        }, { passive: false });

        mapStageEl.addEventListener("pointerdown", (event) => {
          if (event.target.closest(".map-node") || event.target.closest(".map-toolbar")) {
            return;
          }
          interactionState.isDragging = true;
          interactionState.startX = event.clientX;
          interactionState.startY = event.clientY;
          interactionState.translateX = state.viewport.translateX;
          interactionState.translateY = state.viewport.translateY;
          mapStageEl.classList.add("is-grabbing");
        });

        window.addEventListener("pointermove", (event) => {
          if (!interactionState.isDragging) {
            return;
          }
          state.viewport.translateX = interactionState.translateX + (event.clientX - interactionState.startX);
          state.viewport.translateY = interactionState.translateY + (event.clientY - interactionState.startY);
          updateViewport();
        });

        window.addEventListener("pointerup", () => {
          interactionState.isDragging = false;
          mapStageEl.classList.remove("is-grabbing");
        });
      }

      function labelAnchor(node) {
        if (node.x > STAGE_WIDTH - 260) {
          return "anchor-left";
        }
        if (node.x < 180) {
          return "anchor-right";
        }
        if (node.y > STAGE_HEIGHT - 160) {
          return "anchor-top";
        }
        if (node.y < 140) {
          return "anchor-bottom";
        }
        return node.y > STAGE_HEIGHT * 0.64 ? "anchor-top" : "anchor-right";
      }

      function renderBoard(routes, nodes) {
        const direction = getSelectedDirection();
        const activeRoute = resolveActiveRoute(routes);
        if (!activeRoute) {
          mapSvgEl.innerHTML = "";
          segmentLayerEl.innerHTML = "";
          nodeLayerEl.innerHTML = "";
          return;
        }

        const referenceMode = isReferenceBoardMode(direction);
        pageShellEl.classList.toggle("is-reference-mode", referenceMode);
        mapStageEl.classList.toggle("is-reference-mode", referenceMode);
        mapNoteEl.style.display = referenceMode ? "block" : "none";
        mapNoteEl.innerHTML = referenceMode
          ? `<strong>Chú thích thời gian:</strong> mọi thời gian được ghi theo thứ tự <strong>10 phút / 15 phút / 20 phút</strong> cho mỗi trường hợp.`
          : "";

        const routeNodes = referenceMode ? nodes : new Map();
        if (!referenceMode) {
          activeRoute.points.forEach((point) => {
            if (nodes.has(point.key)) {
              routeNodes.set(point.key, nodes.get(point.key));
            }
          });
        }
        const preferredNodeKey = getPreferredRouteNodeKey(activeRoute);
        const activeNodeKey = routeNodes.has(state.activeNodeKey) ? state.activeNodeKey : preferredNodeKey;
        if (activeNodeKey && state.activeNodeKey !== activeNodeKey) {
          state.activeNodeKey = activeNodeKey;
        }
        const positions = projectNodes(routeNodes, referenceMode ? {
          avoidCollisions: false,
          paddingX: 135,
          paddingY: 92
        } : {});
        const maxTotal = Math.max(...Array.from(routeNodes.values()).map((node) => node.total), 0);

        const visibleRoutes = referenceMode ? routes : [activeRoute];
        mapSvgEl.innerHTML = visibleRoutes.map((route) => {
          return route.segments.map((segment) => {
            const fromNode = positions.get(segment.fromKey);
            const toNode = positions.get(segment.toKey);
            if (!fromNode || !toNode || segment.metric.source === "same-site") {
              return "";
            }
            const path = buildStraightPath([fromNode, toNode]);
            const isActiveRoute = activeRoute && activeRoute.id === route.id;
            const baseColor = referenceMode ? route.color : activeRoute.color;
            return `
              <path
                class="route-path${isActiveRoute ? " is-active" : ""}"
                d="${path}"
                stroke="rgba(255, 255, 255, 0.9)"
                stroke-width="${referenceMode ? 10 : 12}"
                opacity="${referenceMode ? 0.48 : 0.96}"
              ></path>
              <path
                class="route-path${isActiveRoute ? " is-active" : ""}"
                d="${path}"
                stroke="${baseColor}"
                stroke-width="${referenceMode ? 5 : 6}"
                opacity="${referenceMode ? (isActiveRoute ? 1 : 0.9) : 1}"
              ></path>
            `;
          }).join("");
        }).join("");

        segmentLayerEl.innerHTML = referenceMode ? "" : activeRoute.segments.map((segment) => {
          const fromNode = positions.get(segment.fromKey);
          const toNode = positions.get(segment.toKey);
          if (!fromNode || !toNode || segment.metric.source === "same-site") {
            return "";
          }
          const badgePosition = buildSegmentBadgePosition(fromNode, toNode);
          const metricText = `${formatNumber(segment.metric.distance_km)} km · ${formatNumber(segment.metric.travel_minutes)} phút`;
          return `
            <div class="segment-badge" style="left:${badgePosition.x}px; top:${badgePosition.y}px; border-color:${activeRoute.color}; box-shadow:0 14px 28px rgba(15, 23, 42, 0.12), inset 0 0 0 1px ${activeRoute.color};">
              ${metricText}
              <span>${segment.fromName} → ${segment.toName}</span>
            </div>
          `;
        }).join("");

        nodeLayerEl.innerHTML = Array.from(positions.values()).map((node) => {
          const anchor = labelAnchor(node);
          const primaryOccurrence = node.occurrences[0];
          const color = referenceMode
            ? (DAY_COLORS[primaryOccurrence.dayIndex] || activeRoute.color)
            : activeRoute.color;
          const size = nodeSize(node.total, maxTotal);
          const isActive = activeNodeKey === node.key;
          const occurrenceCount = node.occurrences.length;
          return `
            <button
              type="button"
              class="map-node ${anchor}${isActive ? " is-active" : ""}"
              style="left:${node.x}px; top:${node.y}px; --node-color:${color}; --node-size:${size}px;"
              data-node-key="${node.key}"
            >
              <div class="map-node-dot"></div>
              <div class="map-node-label">
                <strong>${node.name}</strong>
                <span>${formatNumber(node.total)} người</span>
                <small>${occurrenceCount} lượt tuyến</small>
              </div>
            </button>
          `;
        }).join("");

        nodeLayerEl.querySelectorAll("[data-node-key]").forEach((button) => {
          button.addEventListener("click", () => {
            state.activeNodeKey = button.getAttribute("data-node-key");
            render();
          });
        });

        if (state.shouldAutoFit) {
          fitViewportToPositions(referenceMode ? Array.from(routeNodes.values()) : activeRoute.points, positions);
          state.shouldAutoFit = false;
        } else {
          updateViewport();
        }
      }

      function buildGoogleMapsUrl(route) {
        if (!route || route.points.length < 2) {
          return "";
        }
        const origin = `${route.points[0].lat},${route.points[0].lng}`;
        const destination = `${route.points[route.points.length - 1].lat},${route.points[route.points.length - 1].lng}`;
        const waypointPoints = route.points.slice(1, -1).map((point) => `${point.lat},${point.lng}`);
        const params = new URLSearchParams({
          api: "1",
          origin,
          destination,
          travelmode: "driving"
        });
        if (waypointPoints.length) {
          params.set("waypoints", waypointPoints.join("|"));
        }
        return `https://www.google.com/maps/dir/?${params.toString()}`;
      }

      function buildNodeDetail(node) {
        if (!node) {
          return "";
        }
        const occurrenceRows = node.occurrences.map((occurrence, index) => `
          <div class="detail-row">
            <span>${occurrence.routeLabel} · ${occurrence.dayLabel} · ${occurrence.session}</span>
            <strong>${formatNumber(occurrence.total)} TNLS</strong>
          </div>
          <div class="weather-chip is-pending" data-weather-key="${buildWeatherKey(occurrence.lat, occurrence.lng, occurrence.isoDate)}">${index === 0 ? "Đang tải thời tiết" : "Đang tải thời tiết"}</div>
        `).join("");
        return `
          <div class="detail-card">
            <strong>${node.name}</strong>
            <span>${formatNumber(node.total)} TNLS trên các tuyến đang hiển thị</span>
            <div class="detail-list">${occurrenceRows}</div>
          </div>
        `;
      }

      function buildRouteDetail(route) {
        if (!route) {
          return "";
        }
        const segmentRows = route.segments.length
          ? route.segments.map((segment) => {
            if (segment.metric.source === "same-site") {
              return "";
            }
            const metricText = `${formatNumber(segment.metric.distance_km)} km · ${formatNumber(segment.metric.travel_minutes)} phút`;
            return `
              <div class="detail-row">
                <span>${segment.dayLabel} · ${segment.fromName} → ${segment.toName}</span>
                <strong>${metricText}</strong>
              </div>
            `;
          }).join("")
          : `<div class="detail-row"><span>Trong ngày không phát sinh chặng di chuyển</span><strong>0 km</strong></div>`;
        const dayRows = route.dayDetails.map((detail) => `
          <div class="detail-row">
            <span>${detail.dayLabel} · ${detail.summary}</span>
            <strong>${formatNumber(detail.total)} TNLS</strong>
          </div>
        `).join("");
        const weatherRows = route.points.map((point) => `
          <div class="detail-row">
            <span>${point.dayLabel} · ${point.name} · ${point.session || "Di chuyển"}</span>
            <strong>${point.total ? `${formatNumber(point.total)} TNLS` : "Điểm trung gian"}</strong>
          </div>
          <div class="weather-chip is-pending" data-weather-key="${buildWeatherKey(point.lat, point.lng, point.isoDate)}">Đang tải thời tiết</div>
        `).join("");
        const mapsUrl = buildGoogleMapsUrl(route);
        return `
          <div class="detail-card">
            <strong>${route.label}</strong>
            <span>${route.summary}</span>
            <small>${route.dateLabel} · ${formatNumber(route.total)} TNLS</small>
            <div class="detail-list">${dayRows}</div>
            <div class="detail-list">${segmentRows}</div>
            <div class="detail-list" style="margin-top:14px;">${weatherRows}</div>
            ${mapsUrl ? `<a class="maps-link" href="${mapsUrl}" target="_blank" rel="noopener noreferrer">Mở trên Google Maps</a>` : ""}
          </div>
        `;
      }

      function renderSummary(direction, routes, nodes) {
        const activeRoute = resolveActiveRoute(routes);
        const referenceMode = isReferenceBoardMode(direction);
        if (activeRoute && !state.activeNodeKey) {
          state.activeNodeKey = getPreferredRouteNodeKey(activeRoute);
        }
        const activeNode = nodes.get(state.activeNodeKey) || (activeRoute ? nodes.get(getPreferredRouteNodeKey(activeRoute)) : null);
        const directionTotal = Array.from(nodes.values()).reduce((sum, node) => sum + Number(node.total || 0), 0);

        if (referenceMode) {
          summaryPanelEl.innerHTML = `
            <div class="summary-head">
              <div class="hero-kicker">${direction.label}</div>
              <h2>Tuyến 5 ngày</h2>
              <div class="weather-chip is-pending" data-meta="direction-total">${formatNumber(directionTotal)} TNLS</div>
            </div>

            <div class="detail-card">
              <strong>Bản đồ mô phỏng 5 tuyến ngày</strong>
              <span>Các điểm được nối thẳng theo đúng chuỗi tuyến trong phương án 5 ngày, ưu tiên điểm đông trước rồi giảm dần về điểm ít.</span>
            </div>

            <div class="route-summary">
              ${routes.map((route) => `
                <section class="route-day-group">
                  <div class="route-day-title" style="--day-color:${route.color}">
                    <span class="route-day-swatch"></span>
                    ${route.label}
                  </div>
                  <button type="button" class="route-item${activeRoute && activeRoute.id === route.id ? " is-active" : ""}" style="--route-color:${route.color}" data-route-id="${route.id}">
                    <strong>${route.summary}</strong>
                    <small>${route.dateLabel} · ${formatNumber(route.total)} TNLS</small>
                  </button>
                </section>
              `).join("")}
            </div>

            ${buildNodeDetail(activeNode)}
          `;

          summaryPanelEl.querySelectorAll("[data-route-id]").forEach((button) => {
            button.addEventListener("click", () => {
              state.activeRouteId = button.getAttribute("data-route-id");
              const nextRoute = routes.find((route) => route.id === state.activeRouteId);
              state.activeNodeKey = getPreferredRouteNodeKey(nextRoute);
              state.shouldAutoFit = true;
              render();
            });
          });
          return;
        }

        summaryPanelEl.innerHTML = `
          <div class="summary-head">
            <div class="hero-kicker">${direction.label}</div>
            <h2>Tuyến 5 ngày</h2>
            <div class="weather-chip is-pending" data-meta="direction-total">${formatNumber(directionTotal)} TNLS</div>
          </div>

          <div class="route-summary">
            ${routes.map((route) => `
              <section class="route-day-group">
                <div class="route-day-title" style="--day-color:${route.color}">
                  <span class="route-day-swatch"></span>
                  ${route.label}
                </div>
                <button type="button" class="route-item${activeRoute && activeRoute.id === route.id ? " is-active" : ""}" style="--route-color:${route.color}" data-route-id="${route.id}">
                  <strong>${route.title}</strong>
                  <span>${route.summary}</span>
                  <small>${route.meta}</small>
                </button>
              </section>
            `).join("")}
          </div>

          ${buildRouteDetail(activeRoute)}
          ${buildNodeDetail(activeNode)}
        `;

        summaryPanelEl.querySelectorAll("[data-route-id]").forEach((button) => {
          button.addEventListener("click", () => {
            state.activeRouteId = button.getAttribute("data-route-id");
            const nextRoute = routes.find((route) => route.id === state.activeRouteId);
            state.activeNodeKey = getPreferredRouteNodeKey(nextRoute);
            state.shouldAutoFit = true;
            render();
          });
        });
      }

      async function fetchForecast(lat, lng) {
        const coordKey = buildCoordKey(lat, lng);
        if (!forecastCache.has(coordKey)) {
          const url = `https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(lat)}&longitude=${encodeURIComponent(lng)}&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=Asia%2FBangkok&forecast_days=16`;
          forecastCache.set(coordKey, fetch(url).then((response) => response.json()).catch(() => null));
        }
        return forecastCache.get(coordKey);
      }

      async function resolveWeather(lat, lng, isoDate, dateLabel) {
        const key = buildWeatherKey(lat, lng, isoDate);
        if (weatherCache.has(key)) {
          return weatherCache.get(key);
        }
        const payload = await fetchForecast(lat, lng);
        if (!payload || !payload.daily || !Array.isArray(payload.daily.time)) {
          const value = { status: "unavailable", text: "Không lấy được thời tiết" };
          weatherCache.set(key, value);
          return value;
        }
        const dayIndex = payload.daily.time.indexOf(isoDate);
        if (dayIndex < 0) {
          const value = { status: "unavailable", text: `Chưa có dự báo cho ${dateLabel}` };
          weatherCache.set(key, value);
          return value;
        }
        const code = payload.daily.weather_code[dayIndex];
        const minTemp = Math.round(payload.daily.temperature_2m_min[dayIndex]);
        const maxTemp = Math.round(payload.daily.temperature_2m_max[dayIndex]);
        const value = { status: "ready", text: `${describeWeatherCode(code)} · ${minTemp}-${maxTemp}°C` };
        weatherCache.set(key, value);
        return value;
      }

      function updateWeatherElement(key, weather) {
        document.querySelectorAll(`[data-weather-key="${key}"]`).forEach((element) => {
          element.textContent = weather.text;
          element.classList.remove("is-pending", "is-unavailable");
          if (weather.status !== "ready") {
            element.classList.add("is-unavailable");
          }
        });
      }

      async function hydrateWeather(routes) {
        const tasks = [];
        routes.forEach((route) => {
          route.points.forEach((point) => {
            const key = buildWeatherKey(point.lat, point.lng, point.isoDate);
            tasks.push((async () => {
              const weather = await resolveWeather(point.lat, point.lng, point.isoDate, point.dateLabel);
              updateWeatherElement(key, weather);
            })());
          });
        });
        await Promise.all(tasks);
      }

      function render() {
        const direction = getSelectedDirection();
        const routes = buildRoutes(direction);
        const activeRoute = resolveActiveRoute(routes);
        if (activeRoute) {
          state.activeRouteId = activeRoute.id;
          if (!activeRoute.points.some((point) => point.key === state.activeNodeKey)) {
            state.activeNodeKey = getPreferredRouteNodeKey(activeRoute);
          }
        }
        const nodes = buildVisibleNodes(routes);
        renderDirectionTabs(direction);
        renderDayFilter(direction);
        renderBoard(routes, nodes);
        renderSummary(direction, routes, nodes);
        hydrateWeather(routes);
      }

      initializeViewportControls();
      updateViewport();
      render();
      window.setInterval(() => {
        forecastCache.clear();
        weatherCache.clear();
        render();
      }, 600000);
    })();
  </script>
</body>
</html>
