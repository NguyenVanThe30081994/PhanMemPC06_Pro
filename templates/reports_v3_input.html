{% extends "base.html" %}

{% block content %}
<style>
    .grid-container { overflow-x: auto; max-height: 70vh; overflow-y: auto; }
    .grid-table { border-collapse: collapse; min-width: 100%; }
    .grid-table th, .grid-table td { border: 1px solid #dee2e6; padding: 6px 8px; text-align: center; white-space: nowrap; }
    .grid-table th { background-color: #f8f9fa; font-weight: 600; position: sticky; top: 0; z-index: 10; }
    .grid-input { width: 100%; border: none; text-align: center; background: transparent; padding: 4px; }
    .grid-input:focus { background-color: #fff3cd; outline: 2px solid #ffc107; }
    .grid-input.readonly { background-color: #e9ecef; cursor: not-allowed; }
    .header-merged { background-color: #343a40; color: white; }
    .data-cell { min-width: 120px; }
    .data-cell.editable { background-color: #f0fff0; }
    .saved { background-color: #d4edda; }
    .unsaved { background-color: #fff3cd; }
    .status-bar { font-size: 0.85rem; }
</style>

<div class="container-fluid py-2" style="height: 88vh; display: flex; flex-direction: column;">
    <!-- Header -->
    <div class="d-flex justify-content-between align-items-center mb-2 pb-2 border-bottom">
        <div>
            <h5 class="mb-0 fw-bold text-primary">{{ template.name }}</h5>
            <div class="text-muted small">
                <span class="me-3">Phiên bản: {{ version.version_tag }}</span>
                <span>Đơn vị: <strong class="text-danger">{{ session.get('unit_area', '') }}</strong></span>
            </div>
        </div>
        <div class="d-flex gap-2 align-items-center">
            <span class="status-bar text-muted" id="statusBar">Chưa lưu</span>
            <button class="btn btn-success btn-sm fw-bold" onclick="saveData()" id="saveBtn">
                <i class="fa-solid fa-floppy-disk me-1"></i>LƯU
            </button>
            <button class="btn btn-primary btn-sm fw-bold" onclick="submitReport()" id="submitBtn" disabled>
                <i class="fa-solid fa-paper-plane me-1"></i>NỘP BÁO CÁO
            </button>
            <button class="btn btn-outline-dark btn-sm" onclick="exportExcel()">
                <i class="fa-solid fa-file-excel me-1"></i>Export Excel
            </button>
            <a href="{{ url_for('excel_builder_bp.dashboard') }}" class="btn btn-outline-secondary btn-sm">
                <i class="fa-solid fa-arrow-left me-1"></i>Thoát
            </a>
        </div>
    </div>

    <!-- Grid -->
    <div class="grid-container flex-grow-1 bg-white border">
        <table class="grid-table" id="dataGrid">
            <!-- Built by JS -->
        </table>
    </div>
</div>

<script>
    const SCHEMA = {{ config | safe if config else '{}' }};
    const MY_UNIT = "{{ session.get('unit_area', '') }}".toLowerCase();
    const USER_UNIT_KEY = "{{ user_unit_key | safe if user_unit_key else '' }}";
    const IS_ADMIN = {{ 'true' if session.get('is_admin') else 'false' }};
    const TEMPLATE_ID = {{ template.id }};
    const VERSION_ID = {{ version.id }};
    let REPORT_ID = {{ report_id if report_id else 'null' }};
    
    let dataValues = {};      // { field_code: value }
    let fieldIndexMap = {};   // field_code -> col index
    let dirtyFields = new Set();
    let currentStatus = 'draft';

    $(function () {
        try {
            buildGrid();
            if (REPORT_ID) {
                loadData();
            }
        } catch (e) {
            console.error("Error building grid:", e);
            document.getElementById('grid-container').innerHTML = `<div class="alert alert-danger m-3">Lỗi khi tải biểu mẫu: ${e.message}</div>`;
        }
    });

    function buildGrid() {
        console.log("V3 Grid: Building grid with schema:", SCHEMA);
        const container = document.getElementById('grid-container');
        if (!container) {
            console.error("V3 Grid: Container 'grid-container' not found!");
            return;
        }
        container.innerHTML = '';
        
        try {
            const fields = SCHEMA.fields || [];
            const headerCount = SCHEMA.header_row_count || 1;
            const tree = SCHEMA.grid_header_tree || [];
            
            if (fields.length === 0) {
                container.innerHTML = '<div class="alert alert-warning m-3"><i class="fa-solid fa-triangle-exclamation me-2"></i>Không tìm thấy cột dữ liệu nào trong biểu mẫu này. Vui lòng kiểm tra lại cấu hình header.</div>';
                return;
            }

            const table = document.createElement('table');
            table.className = 'grid-table';
            
            const thead = document.createElement('thead');
            for (let r = 0; r < headerCount; r++) {
                const tr = document.createElement('tr');
                for (let c = 0; c < tree.length; c++) {
                    const th = document.createElement('th');
                    th.textContent = (tree[c] && tree[c][r]) || '';
                    tr.appendChild(th);
                }
                thead.appendChild(tr);
            }
            table.appendChild(thead);
            
            const tbody = document.createElement('tbody');
            
            // Build data rows
            const dataRows = (SCHEMA.total_rows && SCHEMA.total_rows > headerCount) ? (SCHEMA.total_rows - headerCount) : 10;
            const rowUnitKeys = SCHEMA.row_unit_keys || [];
            const rowNames = SCHEMA.row_names || [];

            console.log(`V3 Grid: Rendering ${dataRows} rows`);

            for (let r = 0; r < dataRows; r++) {
                const tr = document.createElement('tr');
                
                // Check if this row belongs to the user
                const rowUnitKey = rowUnitKeys[r] || "";
                const rowName = rowNames[r] || "";
                
                // Smart match: if Admin, or if key matches, or if row is empty (new row)
                const isMyRow = IS_ADMIN || (USER_UNIT_KEY && rowUnitKey === USER_UNIT_KEY);
                
                if (isMyRow && !IS_ADMIN) {
                    tr.classList.add('my-unit-row');
                    tr.style.backgroundColor = '#fff9db';
                } else if (!isMyRow && !IS_ADMIN) {
                    tr.style.opacity = '0.7';
                }

                for (let c = 0; c < fields.length; c++) {
                    const td = document.createElement('td');
                    const fc = fields[c].field_code;
                    
                    const input = document.createElement('input');
                    input.type = fields[c].data_type === 'number' ? 'number' : 'text';
                    
                    // Row-level editable check
                    const canEdit = fields[c].editable && isMyRow;
                    
                    input.className = 'grid-input' + (canEdit ? ' editable' : ' readonly');
                    input.readOnly = !canEdit;
                    input.setAttribute('data-field', fc);
                    if (r === 0) input.setAttribute('placeholder', fields[c].field_name || fc);
                    
                    if (canEdit) {
                        input.onchange = function () {
                            const val = this.value;
                            if (!dataValues[r]) dataValues[r] = {};
                            dataValues[r][fc] = val;
                            dirtyFields.add(`${r}_${fc}`);
                        };
                    }
                    
                    td.appendChild(input);
                    tr.appendChild(td);
                }
                tbody.appendChild(tr);
            }
            table.appendChild(tbody);
            container.appendChild(table);
            
            console.log("V3 Grid: Render complete.");
        } catch (err) {
            console.error("V3 Grid Render Error:", err);
            container.innerHTML = `<div class="alert alert-danger m-3">
                <h5><i class="fa-solid fa-circle-exclamation me-2"></i>Lỗi hiển thị biểu mẫu</h5>
                <p>${err.message}</p>
                <pre class="small mt-2">${err.stack}</pre>
            </div>`;
        }
    }

    function loadData() {
        if (!REPORT_ID) return;
        
        fetch(`/reports-v3/reports/${REPORT_ID}/values`)
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    dataValues = d.values || {};
                    currentStatus = d.status || 'draft';
                    
                    // Fill grid
                    for (const [fc, val] of Object.entries(dataValues)) {
                        const inp = document.querySelector(`[data-field="${fc}"]`);
                        if (inp) {
                            inp.value = val || '';
                            inp.classList.add('saved');
                        }
                    }
                    
                    updateStatus(currentStatus === 'submitted' ? 'submitted' : 'saved');
                    if (currentStatus === 'submitted') {
                        document.querySelectorAll('.grid-input').forEach(i => i.readOnly = true);
                        document.getElementById('saveBtn').disabled = true;
                        document.getElementById('submitBtn').disabled = true;
                    }
                }
            });
    }

    function updateStatus(status) {
        const bar = document.getElementById('statusBar');
        const submitBtn = document.getElementById('submitBtn');
        
        if (status === 'saved') {
            bar.textContent = 'Đã lưu';
            bar.className = 'status-bar text-success';
            submitBtn.disabled = false;
        } else if (status === 'unsaved') {
            bar.textContent = 'Chưa lưu - có thay đổi';
            bar.className = 'status-bar text-warning';
            submitBtn.disabled = true;
        } else if (status === 'submitted') {
            bar.textContent = 'Đã nộp (khóa sửa)';
            bar.className = 'status-bar text-primary';
            submitBtn.disabled = true;
        }
    }

    function saveData() {
        const btn = document.getElementById('saveBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i>ĐANG LƯU...';

        let url, body;
        
        if (REPORT_ID) {
            url = `/reports-v3/reports/${REPORT_ID}/values`;
            body = JSON.stringify({ values: dataValues });
        } else {
            // Create report first
            fetch('/reports-v3/reports/create', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ template_id: TEMPLATE_ID })
            })
            .then(r => r.json())
            .then(d => {
                if (d.success && d.report_id) {
                    REPORT_ID = d.report_id;
                    return fetch(`/reports-v3/reports/${REPORT_ID}/values`, {
                        method: 'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ values: dataValues })
                    });
                }
            });
        }

        // Simplified: save values
        if (REPORT_ID) {
            fetch(`/reports-v3/reports/${REPORT_ID}/values`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ values: dataValues })
            })
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    dirtyFields.clear();
                    document.querySelectorAll('.grid-input').forEach(i => i.classList.add('saved'));
                    updateStatus('saved');
                    alert('Lưu thành công!');
                } else {
                    alert('Lỗi: ' + (d.message || 'Không rõ'));
                }
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-floppy-disk me-1"></i>LƯU';
            })
            .catch(e => {
                alert('Lỗi: ' + e);
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-floppy-disk me-1"></i>LƯU';
            });
        }
    }

    function submitReport() {
        if (!confirm('Sau khi nộp sẽ không thể sửa. Tiếp tục?')) return;

        fetch(`/reports-v3/reports/${REPORT_ID}/submit`, { method: 'POST' })
            .then(r => r.json())
            .then(d => {
                if (d.success) {
                    document.querySelectorAll('.grid-input').forEach(i => {
                        i.readOnly = true;
                        i.classList.remove('unsaved');
                        i.classList.add('saved');
                    });
                    document.getElementById('saveBtn').disabled = true;
                    document.getElementById('submitBtn').disabled = true;
                    updateStatus('submitted');
                    alert('Nộp báo cáo thành công!');
                } else {
                    alert('Lỗi: ' + (d.message || 'Không rõ'));
                }
            });
    }

    function exportExcel() {
        if (REPORT_ID) {
            window.location.href = `/reports-v3/reports/${REPORT_ID}/export`;
        } else {
            alert('Chưa lưu báo cáo!');
        }
    }
</script>
{% endblock %}
