{% extends "base.html" %}

{% block content %}
<style>
    .grid-container { overflow-x: auto; max-height: 70vh; overflow-y: auto; }
    .grid-table { border-collapse: collapse; width: 100%; }
    .grid-table th, .grid-table td { border: 1px solid #ddd; padding: 8px; text-align: center; }
    .grid-table th { background-color: #f8f9fa; font-weight: bold; }
    .grid-input { width: 100%; border: none; text-align: center; }
    .header-row { background-color: #e9ecef; }
</style>

<div class="container-fluid" style="height: 85vh; display: flex; flex-direction: column;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h4 class="mb-0 fw-bold">Nhập báo cáo V3: {{ template.name }}</h4>
            <div class="text-muted small">Đơn vị của bạn: <strong>{{ unit_area }}</strong></div>
        </div>
        <div class="d-flex gap-2">
            <button class="btn btn-primary btn-sm fw-bold" onclick="submitData()" id="submitBtn">
                <i class="fa-solid fa-paper-plane me-1"></i>GỬI BÁO CÁO (LƯU)
            </button>
            <a href="{{ url_for('dashboard_bp.dashboard') }}" class="btn btn-outline-secondary btn-sm">Thoát</a>
        </div>
    </div>

    <div class="grid-container">
        <table class="grid-table" id="dataGrid">
            <!-- Headers will be generated by JS -->
        </table>
    </div>
</div>

<script>
    const CONFIG = JSON.parse('{{ config | safe }}');
    const MY_UNIT = "{{ unit_area }}".toLowerCase();
    const TEMPLATE_ID = {{ template.id }};
    let dataValues = {}; // { "r_c": value }

    $(function () {
        buildGrid();
        loadExistingData();
    });

    function buildGrid() {
        const table = document.getElementById('dataGrid');
        const headerRows = CONFIG.grid_header_tree || [];
        const fields = CONFIG.fields || [];
        const headerRowCount = CONFIG.header_row_count || 3;

        // Build header rows
        for (let r = 0; r < headerRowCount; r++) {
            const tr = document.createElement('tr');
            tr.className = 'header-row';
            for (let c = 0; c < headerRows.length; c++) {
                const th = document.createElement('th');
                th.textContent = headerRows[c] ? headerRows[c][r] || '' : '';
                tr.appendChild(th);
            }
            table.appendChild(tr);
        }

        // Add data rows (assume 10 rows for demo)
        for (let r = 0; r < 10; r++) {
            const tr = document.createElement('tr');
            for (let c = 0; c < fields.length; c++) {
                const td = document.createElement('td');
                const input = document.createElement('input');
                input.type = 'text';
                input.className = 'grid-input';
                input.setAttribute('data-r', r);
                input.setAttribute('data-c', c);
                input.onchange = function() {
                    dataValues[`${r}_${c}`] = this.value;
                };
                td.appendChild(input);
                tr.appendChild(td);
            }
            table.appendChild(tr);
        }
    }

    function loadExistingData() {
        // Load existing submission if any
        // For simplicity, assume no existing data for now
    }

    function submitData() {
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin me-1"></i>ĐANG LƯU...';

        fetch('/reports-v3/submit', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                template_id: TEMPLATE_ID,
                values: dataValues
            })
        })
        .then(res => res.json())
        .then(d => {
            if (d.success) {
                alert('Lưu báo cáo thành công!');
            } else {
                alert('Lỗi: ' + (d.message || 'Không rõ'));
            }
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-paper-plane me-1"></i>GỬI BÁO CÁO (LƯU)';
        })
        .catch(e => {
            alert('Lỗi kết nối: ' + e);
            btn.disabled = false;
            btn.innerHTML = '<i class="fa-solid fa-paper-plane me-1"></i>GỬI BÁO CÁO (LƯU)';
        });
    }
</script>
{% endblock %}
