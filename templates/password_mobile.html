{% extends "base_mobile.html" %}

{% block title %}Đổi mật khẩu - PC06 Mobile{% endblock %}

{% block content %}
<div class="pc-login-mobile" style="max-width: 480px; margin: 0 auto; padding: var(--pc-space-6) var(--pc-space-5);">
    <div class="text-center mb-4">
        <div class="d-inline-flex p-3 mb-3" style="border-radius: var(--pc-radius-pill); background: var(--pc-primary-soft); color: var(--pc-primary);">
            <i class="fa-solid fa-key fs-3"></i>
        </div>
        <h1 style="font-size: 24px; font-weight: 800; letter-spacing: -.02em; color: var(--pc-text);">Cập nhật Mật khẩu</h1>
        <p style="color: var(--pc-text-muted); font-size: var(--pc-text-body); margin: 0;">Vui lòng nhập mật khẩu mới để bảo vệ tài khoản</p>
    </div>

    <div class="pc-card pc-login">
        <div class="pc-card-body">
            <span class="pc-badge pc-badge-primary mb-4">BẢO MẬT TÀI KHOẢN</span>
            <form method="POST">
                <div class="pc-form-group">
                    <label class="pc-label" for="old_pw_m">Mật khẩu hiện tại</label>
                    <div class="d-flex">
                        <input type="password" name="old_password" id="old_pw_m" class="pc-input" placeholder="••••••••" autocomplete="current-password" required style="height: 50px; border-top-right-radius: 0; border-bottom-right-radius: 0;">
                        <button class="pc-btn pc-btn-secondary toggle-password" type="button" aria-label="Hiện hoặc ẩn mật khẩu" style="border-top-left-radius: 0; border-bottom-left-radius: 0; border-left: 0;">
                            <i class="fa-solid fa-eye-slash"></i>
                        </button>
                    </div>
                </div>

                <div class="pc-form-group">
                    <label class="pc-label" for="new_pw_m">Mật khẩu mới</label>
                    <div class="d-flex">
                        <input type="password" name="new_password" id="new_pw_m" class="pc-input" placeholder="Ít nhất 8 ký tự" autocomplete="new-password" required minlength="8" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$" title="Ít nhất 8 ký tự, gồm chữ hoa, thường, số và ký tự đặc biệt." style="height: 50px; border-top-right-radius: 0; border-bottom-right-radius: 0;">
                        <button class="pc-btn pc-btn-secondary toggle-password" type="button" aria-label="Hiện hoặc ẩn mật khẩu" style="border-top-left-radius: 0; border-bottom-left-radius: 0; border-left: 0;">
                            <i class="fa-solid fa-eye-slash"></i>
                        </button>
                    </div>
                    <div class="pc-help">Mật khẩu cần có chữ hoa, chữ thường, số và ký tự đặc biệt.</div>
                </div>

                <div class="mt-5">
                    <button type="submit" class="pc-btn pc-btn-primary w-100" aria-label="Lưu mật khẩu" title="Lưu mật khẩu">
                        <i class="fa-solid fa-shield-check"></i><span class="visually-hidden">Lưu mật khẩu</span>
                    </button>
                    <a href="/" class="pc-btn pc-btn-ghost w-100 mt-2" aria-label="Quay lại trang chủ" title="Quay lại trang chủ"><i class="fa-solid fa-house"></i><span class="visually-hidden">Quay lại trang chủ</span></a>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
document.querySelectorAll('.toggle-password').forEach(btn => {
    btn.addEventListener('click', () => {
        const input = btn.parentElement.querySelector('input');
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        }
    });
});
</script>
{% endblock %}
