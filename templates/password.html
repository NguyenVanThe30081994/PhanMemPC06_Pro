{% extends "base.html" %}

{% block content %}
<div class="container-fluid py-4 px-3 px-lg-4">
    <div class="row justify-content-center">
        <div class="col-xl-5 col-lg-6">
            <div class="pc-card pc-login">
                <div class="pc-card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex align-items-center justify-content-center mb-3"
                             style="width: 64px; height: 64px; border-radius: var(--pc-radius-lg); background: var(--pc-primary-soft); color: var(--pc-primary);">
                            <i class="fa-solid fa-key fs-4"></i>
                        </div>
                        <div><span class="pc-badge pc-badge-primary mb-3">AN NINH HỆ THỐNG</span></div>
                        <h1 style="font-size: var(--pc-text-h2); font-weight: 800; letter-spacing: -.02em; color: var(--pc-text); margin: 0;">Cập nhật Mật khẩu</h1>
                    </div>

                    <form method="POST">
                        <div class="pc-form-group">
                            <label class="pc-label" for="old_pw">Mật khẩu hiện tại</label>
                            <div class="d-flex">
                                <input type="password" name="old_password" id="old_pw" class="pc-input" placeholder="••••••••" autocomplete="current-password" required style="border-top-right-radius: 0; border-bottom-right-radius: 0;">
                                <button class="pc-btn pc-btn-secondary toggle-password" type="button" aria-label="Hiện hoặc ẩn mật khẩu" style="border-top-left-radius: 0; border-bottom-left-radius: 0; border-left: 0;">
                                    <i class="fa-solid fa-eye-slash"></i>
                                </button>
                            </div>
                        </div>

                        <div class="pc-form-group">
                            <label class="pc-label" for="new_pw">Mật khẩu mới</label>
                            <div class="d-flex">
                                <input type="password" name="new_password" id="new_pw" class="pc-input" placeholder="Nhập mật khẩu mới" autocomplete="new-password" required minlength="8" pattern="^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{8,}$" title="Mật khẩu phải có ít nhất 8 ký tự, bao gồm chữ hoa, chữ thường, số và ký tự đặc biệt (@$!%*?&)." style="border-top-right-radius: 0; border-bottom-right-radius: 0;">
                                <button class="pc-btn pc-btn-secondary toggle-password" type="button" aria-label="Hiện hoặc ẩn mật khẩu" style="border-top-left-radius: 0; border-bottom-left-radius: 0; border-left: 0;">
                                    <i class="fa-solid fa-eye-slash"></i>
                                </button>
                            </div>
                        </div>

                        <div class="d-grid gap-3 mt-5">
                            <button type="submit" class="pc-btn pc-btn-primary w-100">
                                <i class="fa-solid fa-shield-check me-2"></i>LƯU THAY ĐỔI
                            </button>
                            <a href="{{ url_for('admin_bp.index') }}" class="pc-btn pc-btn-ghost w-100">Để sau, quay lại trang chủ</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.querySelectorAll('.toggle-password').forEach(btn => {
    btn.addEventListener('click', () => {
        const input = btn.parentElement.querySelector('input');
        const icon = btn.querySelector('i');
        if (input.type === 'password') {
            input.type = 'text';
            icon.classList.replace('fa-eye-slash', 'fa-eye');
        } else {
            input.type = 'password';
            icon.classList.replace('fa-eye', 'fa-eye-slash');
        }
    });
});
</script>
{% endblock %}
