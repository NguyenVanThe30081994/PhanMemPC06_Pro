{% extends "base.html" %}

{% block content %}
<div class="overview-shell">
    <section class="overview-metric-grid">
        {% for metric in overview_metrics %}
        <a href="{{ metric.href }}" class="overview-metric-card accent-{{ metric.accent_class }}">
            <span>{{ metric.title }}</span>
            <strong>{{ metric.value }}</strong>
        </a>
        {% endfor %}
    </section>

    <section class="overview-chart-grid">
        <article class="overview-panel">
            <div class="overview-panel-head">
                <h2>Tổng hợp</h2>
            </div>
            <div class="overview-canvas-wrap">
                <canvas id="overviewBarChart"></canvas>
            </div>
        </article>

        <article class="overview-panel">
            <div class="overview-panel-head">
                <h2>Tỷ lệ đơn vị</h2>
            </div>
            <div class="overview-canvas-wrap">
                <canvas id="overviewDonutChart"></canvas>
            </div>
        </article>
    </section>
</div>

<style>
    .overview-shell {
        display: grid;
        gap: 16px;
    }

    .overview-panel,
    .overview-metric-card {
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 26px;
        box-shadow: 0 18px 42px rgba(15, 23, 42, 0.06);
    }

    .overview-panel-head h2 {
        margin: 0;
        color: var(--text-main);
        font-weight: 800;
    }

    .overview-metric-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 14px;
    }

    .overview-metric-card {
        display: grid;
        gap: 8px;
        min-height: 152px;
        padding: 18px 20px 16px;
        text-decoration: none;
        color: var(--text-main);
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .overview-metric-card:hover {
        transform: translateY(-2px);
        color: var(--text-main);
        box-shadow: 0 22px 40px rgba(15, 23, 42, 0.1);
    }

    .overview-metric-card span {
        color: var(--text-muted);
        font-size: 0.8rem;
        font-weight: 700;
        line-height: 1.35;
        max-width: 16ch;
    }

    .overview-metric-card strong {
        font-size: clamp(2rem, 2.7vw, 2.9rem);
        line-height: 0.95;
        font-weight: 800;
        align-self: end;
    }

    .overview-metric-card.accent-primary {
        border-top: 5px solid #0066ff;
    }

    .overview-metric-card.accent-warning {
        border-top: 5px solid #d97706;
    }

    .overview-metric-card.accent-success {
        border-top: 5px solid #059669;
    }

    .overview-metric-card.accent-indigo {
        border-top: 5px solid #4f46e5;
    }

    .overview-chart-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.45fr) minmax(300px, 0.8fr);
        gap: 16px;
    }

    .overview-panel {
        padding: 18px 20px 20px;
    }

    .overview-panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 12px;
    }

    .overview-panel-head h2 {
        font-size: clamp(1.7rem, 2.7vw, 2.35rem);
        line-height: 1.05;
    }

    .overview-canvas-wrap {
        position: relative;
        height: 300px;
    }

    [data-theme="dark"] .overview-panel,
    [data-theme="dark"] .overview-metric-card {
        background: rgba(15, 23, 42, 0.84);
        border-color: rgba(148, 163, 184, 0.18);
        box-shadow: 0 18px 45px rgba(2, 6, 23, 0.34);
    }

    @media (max-width: 1399.98px) {
        .overview-metric-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }

        .overview-chart-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }

    @media (max-width: 991.98px) {
        .overview-metric-grid,
        .overview-chart-grid {
            grid-template-columns: 1fr;
        }
    }

    @media (max-width: 767.98px) {
        .overview-panel,
        .overview-metric-card {
            padding: 16px;
            border-radius: 22px;
        }

        .overview-metric-card {
            min-height: 132px;
        }

        .overview-canvas-wrap {
            height: 260px;
        }
    }
</style>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const barCanvas = document.getElementById('overviewBarChart');
        const donutCanvas = document.getElementById('overviewDonutChart');
        if (!barCanvas || !donutCanvas || typeof Chart === 'undefined') {
            return;
        }

        const barLabels = {{ overview_chart['chart_labels']|tojson }};
        const barValues = {{ overview_chart['chart_values']|tojson }};
        const donutLabels = {{ completion_chart['chart_labels']|tojson }};
        const donutValues = {{ completion_chart['chart_values']|tojson }};
        const darkMode = document.documentElement.getAttribute('data-theme') === 'dark';
        const axisColor = darkMode ? '#94a3b8' : '#64748b';
        const gridColor = darkMode ? 'rgba(148, 163, 184, 0.18)' : 'rgba(148, 163, 184, 0.14)';

        new Chart(barCanvas, {
            type: 'bar',
            data: {
                labels: barLabels,
                datasets: [{
                    data: barValues,
                    backgroundColor: ['#0066ff', '#d97706', '#059669', '#4f46e5'],
                    borderRadius: 14,
                    borderSkipped: false,
                    maxBarThickness: 72,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    x: {
                        ticks: {
                            color: axisColor,
                            font: { weight: '700' }
                        },
                        grid: { display: false }
                    },
                    y: {
                        beginAtZero: true,
                        ticks: {
                            precision: 0,
                            color: axisColor,
                            font: { weight: '700' }
                        },
                        grid: {
                            color: gridColor
                        }
                    }
                }
            }
        });

        new Chart(donutCanvas, {
            type: 'doughnut',
            data: {
                labels: donutLabels,
                datasets: [{
                    data: donutValues,
                    backgroundColor: ['#0066ff', '#f59e0b', '#10b981', '#7c3aed'],
                    borderWidth: 0,
                    hoverOffset: 8,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '62%',
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            color: axisColor,
                            usePointStyle: true,
                            pointStyle: 'circle',
                            boxWidth: 10,
                            padding: 18,
                            font: { weight: '700' }
                        }
                    }
                }
            }
        });
    });
</script>
{% endblock %}
