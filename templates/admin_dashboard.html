{% extends "base.html" %}

{% block content %}
<div class="overview-shell">
    <section class="overview-topbar">
        <h1>Trang chủ</h1>
        <div class="overview-date">{{ now_str }}</div>
    </section>

    <section class="overview-metric-grid">
        {% for metric in overview_metrics %}
        <a href="{{ metric.href }}" class="overview-metric-card accent-{{ metric.accent_class }}">
            <span>{{ metric.title }}</span>
            <strong>{{ metric.value }}</strong>
        </a>
        {% endfor %}
    </section>

    <section class="overview-chart-grid">
        <article class="overview-panel">
            <div class="overview-panel-head">
                <h2>Tổng hợp</h2>
            </div>
            <div class="overview-canvas-wrap">
                <canvas id="overviewBarChart"></canvas>
            </div>
        </article>

        <article class="overview-panel">
            <div class="overview-panel-head">
                <h2>Tỷ lệ đơn vị</h2>
            </div>
            <div class="overview-canvas-wrap">
                <canvas id="overviewDonutChart"></canvas>
            </div>
        </article>
    </section>
</div>

<style>
    .overview-shell {
        display: grid;
        gap: 20px;
    }

    .overview-topbar,
    .overview-panel,
    .overview-metric-card {
        background: rgba(255, 255, 255, 0.94);
        border: 1px solid rgba(148, 163, 184, 0.16);
        border-radius: 26px;
        box-shadow: 0 18px 42px rgba(15, 23, 42, 0.06);
    }

    .overview-topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 22px 24px;
    }

    .overview-topbar h1,
    .overview-panel-head h2 {
        margin: 0;
        color: var(--text-main);
        font-weight: 800;
    }

    .overview-date {
        padding: 10px 16px;
        border-radius: 999px;
        background: rgba(37, 99, 235, 0.08);
        color: var(--primary);
        font-weight: 800;
    }

    .overview-metric-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 16px;
    }

    .overview-metric-card {
        display: grid;
        gap: 12px;
        padding: 22px;
        text-decoration: none;
        color: var(--text-main);
        transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
    }

    .overview-metric-card:hover {
        transform: translateY(-2px);
        color: var(--text-main);
        box-shadow: 0 22px 40px rgba(15, 23, 42, 0.1);
    }

    .overview-metric-card span {
        color: var(--text-muted);
        font-size: 0.86rem;
        font-weight: 700;
        line-height: 1.5;
    }

    .overview-metric-card strong {
        font-size: clamp(2rem, 3vw, 2.6rem);
        line-height: 1;
        font-weight: 800;
    }

    .overview-metric-card.accent-primary {
        border-top: 5px solid #2563eb;
    }

    .overview-metric-card.accent-warning {
        border-top: 5px solid #d97706;
    }

    .overview-metric-card.accent-success {
        border-top: 5px solid #059669;
    }

    .overview-metric-card.accent-indigo {
        border-top: 5px solid #4f46e5;
    }

    .overview-chart-grid {
        display: grid;
        grid-template-columns: minmax(0, 1.35fr) minmax(320px, 0.85fr);
        gap: 20px;
    }

    .overview-panel {
        padding: 22px 24px;
    }

    .overview-panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 18px;
    }

    .overview-canvas-wrap {
        position: relative;
        height: 360px;
    }

    [data-theme="dark"] .overview-topbar,
    [data-theme="dark"] .overview-panel,
    [data-theme="dark"] .overview-metric-card {
        background: rgba(15, 23, 42, 0.84);
        border-color: rgba(148, 163, 184, 0.18);
        box-shadow: 0 18px 45px rgba(2, 6, 23, 0.34);
    }

    [data-theme="dark"] .overview-date {
        background: rgba(37, 99, 235, 0.16);
        color: #93c5fd;
    }

    @media (max-width: 1399.98px) {
        .overview-metric-grid,
        .overview-chart-grid {
            grid-template-columns: repeat(2, minmax(0, 1fr));
        }
    }

    @media (max-width: 991.98px) {
        .overview-topbar,
        .overview-metric-grid,
        .overview-chart-grid {
            grid-template-columns: 1fr;
        }

        .overview-topbar {
            flex-direction: column;
            align-items: flex-start;
        }
    }

    @media (max-width: 767.98px) {
        .overview-topbar,
        .overview-panel,
        .overview-metric-card {
            padding: 18px;
            border-radius: 22px;
        }

        .overview-canvas-wrap {
            height: 300px;
        }
    }
</style>
{% endblock %}

{% block scripts %}
{{ super() }}
<script>
    document.addEventListener('DOMContentLoaded', function () {
        const barCanvas = document.getElementById('overviewBarChart');
        const donutCanvas = document.getElementById('overviewDonutChart');
        if (!barCanvas || !donutCanvas || typeof Chart === 'undefined') {
            return;
        }

        const barLabels = {{ overview_chart['chart_labels']|tojson }};
        const barValues = {{ overview_chart['chart_values']|tojson }};
        const donutLabels = {{ completion_chart['chart_labels']|tojson }};
        const donutValues = {{ completion_chart['chart_values']|tojson }};
        const darkMode = document.documentElement.getAttribute('data-theme') === 'dark';
        const axisColor = darkMode ? '#94a3b8' : '#64748b';
        const gridColor = darkMode ? 'rgba(148, 163, 184, 0.18)' : 'rgba(148, 163, 184, 0.14)';

        new Chart(barCanvas, {
            type: 'bar',
            data: {
                labels: barLabels,
                datasets: [{
                    data: barValues,
                    backgroundColor: ['#2563eb', '#d97706', '#059669', '#4f46e5'],
                    borderRadius: 14,
                    borderSkipped: false,
                    maxBarThickness: 72,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { display: false }
                },
                scales: {
                    x: {
                        ticks: {
                            color: axisColor,
                            font: { weight: '700' }
                        },
                        grid: { display: false }
                    },
                    y: {
                        beginAtZero: true,
                        ticks: {
                            precision: 0,
                            color: axisColor,
                            font: { weight: '700' }
                        },
                        grid: {
                            color: gridColor
                        }
                    }
                }
            }
        });

        new Chart(donutCanvas, {
            type: 'doughnut',
            data: {
                labels: donutLabels,
                datasets: [{
                    data: donutValues,
                    backgroundColor: ['#2563eb', '#f59e0b', '#10b981', '#7c3aed'],
                    borderWidth: 0,
                    hoverOffset: 8,
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '62%',
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            color: axisColor,
                            usePointStyle: true,
                            pointStyle: 'circle',
                            boxWidth: 10,
                            padding: 18,
                            font: { weight: '700' }
                        }
                    }
                }
            }
        });
    });
</script>
{% endblock %}
