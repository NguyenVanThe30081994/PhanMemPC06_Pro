{% extends "base.html" %}

{% block title %}Cấu hình báo cáo - {{ template.name }}{% endblock %}

{% block content %}
<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="mb-1"><i class="bi bi-gear"></i> Cấu hình loại báo cáo & Hạn nộp</h3>
      <p class="text-muted mb-0">{{ template.name }}</p>
    </div>
    <a href="{{ url_for('reporting_bp.template_workspace', template_id=template.id) }}" class="btn btn-outline-secondary">
      <i class="bi bi-arrow-left"></i> Quay lại
    </a>
  </div>

  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <form method="POST">
        <div class="mb-4">
          <label class="form-label fw-bold">Loại báo cáo</label>
          <select name="report_type" id="reportTypeSelect" class="form-select" onchange="toggleConfigFields()">
            {% set rt = template.report_type|default('adhoc', true) %}
            <option value="adhoc" {% if rt == 'adhoc' %}selected{% endif %}>Đột xuất (Tùy chỉnh hạn nộp khi tạo kỳ)</option>
            <option value="daily" {% if rt == 'daily' %}selected{% endif %}>Hàng ngày</option>
            <option value="periodic" {% if rt == 'periodic' %}selected{% endif %}>Định kỳ (Tuần/Tháng/Quý/Năm)</option>
          </select>
        </div>

        <div id="frequencyConfig" class="mb-4" style="display: none;">
          <label class="form-label fw-bold">Tần suất báo cáo</label>
          <select name="frequency" class="form-select">
            {% set freq = template.frequency|default('', true) %}
            <option value="weekly" {% if freq == 'weekly' %}selected{% endif %}>Hàng tuần</option>
            <option value="monthly" {% if freq == 'monthly' %}selected{% endif %}>Hàng tháng</option>
            <option value="quarterly" {% if freq == 'quarterly' %}selected{% endif %}>Hàng quý</option>
            <option value="yearly" {% if freq == 'yearly' %}selected{% endif %}>Hàng năm</option>
          </select>
        </div>

        <div id="deadlineRuleConfig" class="mb-4" style="display: none;">
          <label class="form-label fw-bold" id="deadlineLabel">Quy tắc hạn nộp</label>
          <input type="text" name="deadline_rule" class="form-control" value="{{ template.deadline_rule|default('', true) }}" placeholder="Ví dụ: 16:30">
          <div class="form-text" id="deadlineHelp"></div>
        </div>

        <button type="submit" class="btn btn-primary px-4"><i class="bi bi-save"></i> Lưu cấu hình</button>
      </form>
    </div>
  </div>
</div>

<script>
function toggleConfigFields() {
  const type = document.getElementById('reportTypeSelect').value;
  const freq = document.getElementById('frequencyConfig');
  const deadline = document.getElementById('deadlineRuleConfig');
  const dLabel = document.getElementById('deadlineLabel');
  const dHelp = document.getElementById('deadlineHelp');

  if (type === 'adhoc') {
    freq.style.display = 'none';
    deadline.style.display = 'none';
  } else if (type === 'daily') {
    freq.style.display = 'none';
    deadline.style.display = 'block';
    dLabel.textContent = 'Giờ hết hạn trong ngày';
    dHelp.textContent = 'Nhập giờ theo định dạng HH:MM (Ví dụ: 16:30)';
  } else if (type === 'periodic') {
    freq.style.display = 'block';
    deadline.style.display = 'block';
    dLabel.textContent = 'Số ngày hạn nộp (tính từ ngày kết thúc kỳ)';
    dHelp.textContent = 'Ví dụ: Báo cáo tháng kết thúc ngày 30, nhập "5" tức là hạn nộp vào ngày mùng 5 tháng sau.';
  }
}

// Khởi chạy khi load trang
document.addEventListener('DOMContentLoaded', toggleConfigFields);
</script>
{% endblock %}
